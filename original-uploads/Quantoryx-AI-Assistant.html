<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantoryx — AI Trading Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
/* ═══════════════════════════════════════════════════════════
   QUANTORYX DESIGN SYSTEM v5.0 — Exact token parity
═══════════════════════════════════════════════════════════ */
:root {
  --q-bg-base:       #0a0b14;
  --q-bg-surface:    #0f1022;
  --q-bg-card:       rgba(255,255,255,0.04);
  --q-bg-card-hover: rgba(255,255,255,0.07);
  --q-bg-sidebar:    #0c0d1f;
  --q-bg-glass:      rgba(13,14,32,0.85);
  --q-grad-primary:  linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#2563eb 100%);
  --q-grad-accent:   linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);
  --q-grad-success:  linear-gradient(135deg,#059669 0%,#10b981 100%);
  --q-grad-danger:   linear-gradient(135deg,#dc2626 0%,#ef4444 100%);
  --q-text-primary:  #f0f1ff;
  --q-text-secondary:#8b8fa8;
  --q-text-tertiary: #5a5e7a;
  --q-text-accent:   #a78bfa;
  --q-text-success:  #10b981;
  --q-text-danger:   #f87171;
  --q-text-warning:  #fbbf24;
  --q-border:        rgba(255,255,255,0.07);
  --q-border-active: rgba(139,92,246,0.4);
  --q-border-glass:  rgba(255,255,255,0.1);
  --q-purple-500:    #8b5cf6;
  --q-purple-600:    #7c3aed;
  --q-purple-400:    #a78bfa;
  --q-blue-500:      #3b82f6;
  --q-blue-600:      #2563eb;
  --q-indigo-500:    #6366f1;
  --q-green-500:     #10b981;
  --q-red-500:       #ef4444;
  --q-yellow-400:    #fbbf24;
  --q-cyan-400:      #67e8f9;
  --q-shadow-card:   0 4px 24px rgba(0,0,0,0.3);
  --q-shadow-glow:   0 0 32px rgba(139,92,246,0.15);
  --q-shadow-elev:   0 8px 40px rgba(0,0,0,0.4);
  --q-sidebar-w:     220px;
  --q-header-h:      56px;
  --q-radius:        12px;
  --q-radius-sm:     8px;
  --q-radius-lg:     16px;
  --q-t:             0.15s ease;
  --q-t-md:          0.25s ease;
}

.light-mode {
  --q-bg-base:       #f4f5fa;
  --q-bg-surface:    #ffffff;
  --q-bg-card:       rgba(255,255,255,0.9);
  --q-bg-card-hover: rgba(255,255,255,1);
  --q-bg-sidebar:    #ffffff;
  --q-bg-glass:      rgba(255,255,255,0.92);
  --q-text-primary:  #0f1022;
  --q-text-secondary:#4b5563;
  --q-text-tertiary: #9ca3af;
  --q-text-success:  #059669;
  --q-text-danger:   #dc2626;
  --q-text-warning:  #d97706;
  --q-border:        rgba(0,0,0,0.08);
  --q-border-active: rgba(139,92,246,0.3);
  --q-border-glass:  rgba(0,0,0,0.1);
  --q-shadow-card:   0 2px 16px rgba(0,0,0,0.08);
  --q-shadow-glow:   0 0 24px rgba(139,92,246,0.1);
  --q-shadow-elev:   0 8px 32px rgba(0,0,0,0.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
body{background:var(--q-bg-base);color:var(--q-text-primary);transition:background .3s ease,color .3s ease;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(139,92,246,.3);border-radius:2px;}
::selection{background:rgba(139,92,246,.2);color:var(--q-text-primary);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* ── App Shell ── */
.app-layout{display:grid;grid-template-columns:var(--q-sidebar-w) 1fr;grid-template-rows:var(--q-header-h) 1fr;height:100vh;overflow:hidden;}

/* ── Header ── */
.header{grid-column:1/-1;background:var(--q-bg-glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--q-border);display:flex;align-items:center;padding:0 20px;gap:16px;position:relative;z-index:100;}
.header-logo{display:flex;align-items:center;gap:10px;width:var(--q-sidebar-w);flex-shrink:0;}
.logo-icon{width:32px;height:32px;background:var(--q-grad-primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:white;letter-spacing:-1px;}
.logo-text{display:flex;flex-direction:column;line-height:1;}
.logo-name{font-size:15px;font-weight:700;color:var(--q-text-primary);letter-spacing:.5px;}
.logo-tagline{font-size:9px;color:var(--q-text-secondary);margin-top:1px;}
.header-search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--q-bg-card);border:1px solid var(--q-border);border-radius:var(--q-radius-sm);padding:0 14px;height:36px;}
.header-search input{background:none;border:none;outline:none;color:var(--q-text-primary);font-size:13px;flex:1;font-family:inherit;}
.header-search input::placeholder{color:var(--q-text-tertiary);}
.kbd{background:var(--q-bg-card);border:1px solid var(--q-border);border-radius:4px;padding:1px 6px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--q-text-tertiary);}
.header-spacer{flex:1;}
.market-status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--q-text-secondary);}
.status-dot{width:7px;height:7px;border-radius:50%;}
.status-dot.open{background:#10b981;box-shadow:0 0 6px #10b981;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
.header-actions{display:flex;align-items:center;gap:4px;}
.icon-btn{width:34px;height:34px;border-radius:var(--q-radius-sm);border:none;background:var(--q-bg-card);color:var(--q-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all var(--q-t);}
.icon-btn:hover{background:var(--q-bg-card-hover);color:var(--q-text-primary);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--q-grad-primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px;cursor:pointer;border:2px solid var(--q-border-active);}

/* ── Sidebar ── */
.sidebar{background:var(--q-bg-sidebar);border-right:1px solid var(--q-border);overflow-y:auto;display:flex;flex-direction:column;padding:12px 10px;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--q-radius-sm);cursor:pointer;color:var(--q-text-secondary);font-size:13px;font-weight:500;transition:all var(--q-t);position:relative;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--q-bg-card);color:var(--q-text-primary);}
.nav-item.active{background:rgba(139,92,246,.12);color:var(--q-purple-400);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--q-grad-accent);border-radius:0 2px 2px 0;}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--q-grad-accent);color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;}
.nav-dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#10b981;}
.sidebar-ai-card{margin:12px 4px 4px;padding:16px;background:var(--q-grad-primary);border-radius:var(--q-radius);position:relative;overflow:hidden;}
.sidebar-ai-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%;}
.sidebar-ai-title{font-size:13px;font-weight:700;color:white;margin-bottom:2px;}
.sidebar-ai-sub{font-size:11px;color:rgba(255,255,255,.7);margin-bottom:12px;}
.sidebar-ai-btn{background:rgba(255,255,255,.2);border:none;border-radius:6px;color:white;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;transition:background var(--q-t);width:100%;font-family:inherit;}
.sidebar-ai-btn:hover{background:rgba(255,255,255,.3);}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--q-border);padding-top:8px;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-family:inherit;font-weight:600;cursor:pointer;transition:all var(--q-t);white-space:nowrap;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--q-grad-primary);color:white;box-shadow:0 2px 12px rgba(139,92,246,.3);}
.btn-primary:hover:not(:disabled){box-shadow:0 4px 20px rgba(139,92,246,.5);transform:translateY(-1px);}
.btn-ghost{background:var(--q-bg-card);border:1px solid var(--q-border);color:var(--q-text-secondary);}
.btn-ghost:hover:not(:disabled){border-color:var(--q-border-glass);color:var(--q-text-primary);}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px;}
.btn-md{padding:7px 14px;font-size:12px;}
.btn-full{width:100%;justify-content:center;}

/* ── Cards ── */
.card{background:var(--q-bg-card);border:1px solid var(--q-border);border-radius:var(--q-radius);backdrop-filter:blur(12px);transition:border-color var(--q-t),box-shadow var(--q-t);}
.card:hover{border-color:var(--q-border-glass);box-shadow:var(--q-shadow-card);}

/* ── Mobile Nav ── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--q-bg-glass);backdrop-filter:blur(20px);border-top:1px solid var(--q-border);padding:8px 0 12px;z-index:200;}
.mobile-nav-items{display:flex;justify-content:space-around;align-items:center;}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--q-text-tertiary);cursor:pointer;padding:4px 12px;border:none;background:none;font-family:inherit;}
.mobile-nav-item.active{color:var(--q-purple-400);}
.mobile-nav-item-icon{font-size:18px;}

/* ═══════════════════════════════════════════════════════════
   AI ASSISTANT PAGE — Production layout
═══════════════════════════════════════════════════════════ */

.ai-page {
  display: grid;
  grid-template-columns: 1fr 300px;
  height: 100%;
  overflow: hidden;
  background: var(--q-bg-base);
}

/* ── Left: Chat column ── */
.chat-column {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  border-right: 1px solid var(--q-border);
}

/* ── Chat top bar ── */
.chat-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--q-border);
  flex-shrink: 0;
  background: var(--q-bg-glass);
  backdrop-filter: blur(16px);
}

.chat-topbar-left { display: flex; align-items: center; gap: 10px; }
.chat-topbar-title { font-size: 15px; font-weight: 700; color: var(--q-text-primary); }
.chat-topbar-sub { font-size: 11px; color: var(--q-text-secondary); margin-top: 1px; }

.ai-live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.2);
  border-radius: 20px; padding: 3px 8px;
  font-size: 10px; font-weight: 600; color: var(--q-green-500);
}

.ai-live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--q-green-500);
  animation: pulse 2s infinite;
}

.chat-actions { display: flex; align-items: center; gap: 6px; }

.chat-action-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--q-border);
  background: var(--q-bg-card);
  color: var(--q-text-secondary);
  font-size: 11px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: all var(--q-t);
  white-space: nowrap;
}

.chat-action-btn:hover { border-color: var(--q-border-glass); color: var(--q-text-primary); }
.chat-action-btn.danger:hover { border-color: rgba(239,68,68,.3); color: var(--q-text-danger); }

/* ── Keyboard shortcuts hint ── */
.kbd-hint {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--q-text-tertiary);
}

.kbd-tag {
  display: inline-flex; align-items: center;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 4px; padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--q-text-tertiary);
}

/* ── Messages area ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── Empty / Welcome state ── */
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 16px;
  padding: 40px 20px;
  text-align: center;
  animation: fadeUp .4s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

.welcome-orb {
  width: 68px; height: 68px;
  background: var(--q-grad-primary);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  box-shadow: 0 12px 32px rgba(139,92,246,.35), 0 0 60px rgba(139,92,246,.1);
  animation: orbFloat 3s ease-in-out infinite;
}

@keyframes orbFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.welcome-title { font-size: 20px; font-weight: 700; color: var(--q-text-primary); }
.welcome-sub { font-size: 13px; color: var(--q-text-secondary); max-width: 340px; line-height: 1.6; }

.welcome-caps {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; max-width: 420px;
}

.welcome-cap {
  display: flex; align-items: center; gap: 6px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 6px; padding: 5px 10px;
  font-size: 11px; font-weight: 500; color: var(--q-text-secondary);
}

.welcome-cap-dot { width: 5px; height: 5px; border-radius: 50%; }

/* ── Suggested prompts ── */
.suggested-prompts {
  display: flex; flex-direction: column; gap: 6px;
  width: 100%; max-width: 500px;
  margin-top: 4px;
}

.suggested-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--q-text-tertiary);
  text-align: left; margin-bottom: 2px;
}

.prompt-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px; color: var(--q-text-secondary);
  font-family: inherit; text-align: left;
  transition: all var(--q-t-md);
  animation: fadeUp .4s ease both;
  width: 100%;
}

.prompt-chip:hover {
  border-color: var(--q-border-active);
  color: var(--q-text-primary);
  background: rgba(139,92,246,.06);
  box-shadow: var(--q-shadow-glow);
  transform: translateX(3px);
}

.prompt-chip-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: rgba(139,92,246,.1);
  transition: background var(--q-t);
}

.prompt-chip:hover .prompt-chip-icon { background: rgba(139,92,246,.2); }

.prompt-chip-text { flex: 1; font-size: 13px; font-weight: 500; }
.prompt-chip-arrow { color: var(--q-text-tertiary); font-size: 14px; transition: transform var(--q-t); }
.prompt-chip:hover .prompt-chip-arrow { transform: translateX(3px); color: var(--q-purple-400); }

/* ── Message bubbles ── */
.message-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: msgIn .25s ease both;
  margin-bottom: 6px;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.message-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 0;
}

.message-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  margin-top: 2px;
}

.msg-avatar.ai {
  background: var(--q-grad-primary);
  color: white;
  box-shadow: 0 2px 8px rgba(139,92,246,.3);
}

.msg-avatar.user {
  background: rgba(139,92,246,.15);
  color: var(--q-purple-400);
  border: 1px solid var(--q-border-active);
}

.msg-body { max-width: 76%; display: flex; flex-direction: column; gap: 4px; }
.message-row.user .msg-body { align-items: flex-end; }

.msg-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--q-text-tertiary);
  padding: 0 4px;
}

.message-row.user .msg-meta { flex-direction: row-reverse; }

.msg-name { font-weight: 600; color: var(--q-text-secondary); font-size: 11px; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.65;
  position: relative;
  word-break: break-word;
}

.msg-bubble.ai {
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 14px 14px 14px 4px;
  color: var(--q-text-primary);
}

.msg-bubble.user {
  background: var(--q-grad-primary);
  color: white;
  border-radius: 14px 14px 4px 14px;
  box-shadow: 0 2px 12px rgba(139,92,246,.25);
}

/* ── Message actions (hover) ── */
.msg-actions {
  display: flex; align-items: center; gap: 3px;
  opacity: 0; transition: opacity var(--q-t);
  margin-top: 2px;
}

.message-group:hover .msg-actions { opacity: 1; }

.msg-action-btn {
  width: 26px; height: 26px;
  border-radius: 6px; border: 1px solid var(--q-border);
  background: var(--q-bg-card);
  color: var(--q-text-tertiary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all var(--q-t);
}

.msg-action-btn:hover { border-color: var(--q-border-glass); color: var(--q-text-primary); }
.msg-action-btn.copied { color: var(--q-green-500); border-color: rgba(16,185,129,.3); }

/* ── Markdown rendering ── */
.md-content h1 { font-size: 17px; font-weight: 700; margin: 12px 0 6px; color: var(--q-text-primary); }
.md-content h2 { font-size: 15px; font-weight: 700; margin: 10px 0 5px; color: var(--q-text-primary); }
.md-content h3 { font-size: 13px; font-weight: 600; margin: 8px 0 4px; color: var(--q-text-primary); }
.md-content p  { margin: 6px 0; }
.md-content ul, .md-content ol { padding-left: 18px; margin: 6px 0; }
.md-content li { margin: 3px 0; }
.md-content strong { font-weight: 700; color: var(--q-text-primary); }
.md-content em    { font-style: italic; }
.md-content hr    { border: none; border-top: 1px solid var(--q-border); margin: 12px 0; }

.md-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  background: rgba(139,92,246,.12);
  color: var(--q-purple-400);
  padding: 1px 5px;
  border-radius: 4px;
}

.msg-bubble.user .md-content code {
  background: rgba(255,255,255,.2);
  color: rgba(255,255,255,.95);
}

.md-codeblock {
  position: relative;
  margin: 10px 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--q-border);
}

.md-codeblock-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px;
  background: rgba(0,0,0,.3);
  border-bottom: 1px solid var(--q-border);
}

.md-codeblock-lang {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--q-text-tertiary);
  font-family: 'JetBrains Mono', monospace;
}

.md-codeblock-copy {
  font-size: 10px; font-weight: 600; color: var(--q-text-tertiary);
  background: none; border: none; cursor: pointer;
  font-family: inherit; transition: color var(--q-t);

/* ═══════════════════════════════════════════════════════════
   MARKDOWN RENDERER
   Handles: headers, bold, italic, code blocks, inline code,
            lists, tables, blockquotes, hr
═══════════════════════════════════════════════════════════ */
const MarkdownRenderer = ({ content, isStreaming = false }) => {
  const [copiedBlock, setCopiedBlock] = useState(null);

  const copyBlock = (code, idx) => {
    navigator.clipboard?.writeText(code).catch(() => {});
    setCopiedBlock(idx);
    setTimeout(() => setCopiedBlock(null), 2000);
  };

  const renderLine = (line, key) => {
    // Table row
    if (line.startsWith('|')) {
      return null; // handled in block
    }
    // HR
    if (/^---+$/.test(line.trim())) {
      return <hr key={key} style={{ border: 'none', borderTop: '1px solid var(--q-border)', margin: '10px 0' }} />;
    }
    // Headers
    const h3 = line.match(/^###\s+(.+)/);
    const h2 = line.match(/^##\s+(.+)/);
    const h1 = line.match(/^#\s+(.+)/);
    if (h1) return <h1 key={key}>{inlineFormat(h1[1])}</h1>;
    if (h2) return <h2 key={key}>{inlineFormat(h2[1])}</h2>;
    if (h3) return <h3 key={key}>{inlineFormat(h3[1])}</h3>;
    // Blockquote
    if (line.startsWith('> ')) {
      return (
        <blockquote key={key} style={{
          borderLeft: '3px solid var(--q-purple-400)',
          paddingLeft: 12, margin: '8px 0',
          color: 'var(--q-text-secondary)', fontStyle: 'italic'
        }}>{inlineFormat(line.slice(2))}</blockquote>
      );
    }
    // List items
    if (/^[-*]\s/.test(line)) {
      return <li key={key} style={{ marginLeft: 16 }}>{inlineFormat(line.replace(/^[-*]\s/, ''))}</li>;
    }
    if (/^\d+\.\s/.test(line)) {
      return <li key={key} style={{ marginLeft: 16 }}>{inlineFormat(line.replace(/^\d+\.\s/, ''))}</li>;
    }
    // Empty line
    if (!line.trim()) return <div key={key} style={{ height: 6 }} />;
    // Normal paragraph
    return <p key={key}>{inlineFormat(line)}</p>;
  };

  const inlineFormat = (text) => {
    // Split on inline code, bold, italic patterns
    const parts = [];
    let remaining = text;
    let i = 0;
    const patterns = [
      { re: /`([^`]+)`/,           render: (m) => <code key={i++}>{m[1]}</code> },
      { re: /\*\*([^*]+)\*\*/,      render: (m) => <strong key={i++}>{m[1]}</strong> },
      { re: /\*([^*]+)\*/,          render: (m) => <em key={i++}>{m[1]}</em> },
      { re: /✅|❌|⚠️|🔴|🟢|🏆|🥇|🥈|🥉|⚡|💡|📊|🤖|📈|📉|💼|🎯|⚙|🔔/u, render: (m) => <span key={i++}>{m[0]}</span> },
    ];
    // Simple sequential parse
    const tokens = [];
    let src = text;
    while (src.length > 0) {
      let matched = false;
      for (const { re, render } of patterns) {
        const m = src.match(re);
        if (m && m.index === 0) {
          tokens.push(render(m));
          src = src.slice(m[0].length);
          matched = true; break;
        } else if (m) {
          tokens.push(src.slice(0, m.index));
          tokens.push(render(m));
          src = src.slice(m.index + m[0].length);
          matched = true; break;
        }
      }
      if (!matched) { tokens.push(src); src = ''; }
    }
    return tokens.map((t, idx) => typeof t === 'string' ? <React.Fragment key={idx}>{t}</React.Fragment> : React.cloneElement(t, { key: idx }));
  };

  // Split into blocks: code blocks and table blocks vs line content
  const blocks = [];
  const lines = content.split('\n');
  let i = 0;
  let codeBlockIdx = 0;

  while (i < lines.length) {
    // Code block
    if (lines[i].startsWith('```')) {
      const lang = lines[i].slice(3).trim() || 'text';
      const start = i + 1;
      let end = start;
      while (end < lines.length && !lines[end].startsWith('```')) end++;
      const code = lines.slice(start, end).join('\n');
      const cbIdx = codeBlockIdx++;
      blocks.push(
        <div key={`cb-${i}`} className="md-codeblock">
          <div className="md-codeblock-header">
            <span className="md-codeblock-lang">{lang}</span>
            <button
              className={`md-codeblock-copy ${copiedBlock === cbIdx ? 'copied' : ''}`}
              onClick={() => copyBlock(code, cbIdx)}
            >
              {copiedBlock === cbIdx ? '✓ Copied' : '⎘ Copy'}
            </button>
          </div>
          <pre>{code}</pre>
        </div>
      );
      i = end + 1;
      continue;
    }
    // Table block
    if (lines[i].startsWith('|') && i + 1 < lines.length && lines[i+1].startsWith('|---')) {
      const headers = lines[i].split('|').filter(Boolean).map(h => h.trim());
      const tableRows = [];
      let j = i + 2;
      while (j < lines.length && lines[j].startsWith('|')) {
        tableRows.push(lines[j].split('|').filter(Boolean).map(c => c.trim()));
        j++;
      }
      blocks.push(
        <div key={`t-${i}`} style={{ overflowX: 'auto', margin: '8px 0' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
            <thead>
              <tr>{headers.map((h, hi) => (
                <th key={hi} style={{ padding: '6px 10px', background: 'rgba(139,92,246,.1)', borderBottom: '1px solid var(--q-border)', textAlign: 'left', fontWeight: 600, color: 'var(--q-text-primary)', fontSize: 11 }}>
                  {h}
                </th>
              ))}</tr>
            </thead>
            <tbody>
              {tableRows.map((row, ri) => (
                <tr key={ri}>
                  {row.map((cell, ci) => (
                    <td key={ci} style={{ padding: '6px 10px', borderBottom: '1px solid var(--q-border)', color: 'var(--q-text-secondary)' }}>
                      {inlineFormat(cell)}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
      i = j;
      continue;
    }
    // Normal line
    blocks.push(renderLine(lines[i], `l-${i}`));
    i++;
  }

  return (
    <div className="md-content">
      {blocks}
      {isStreaming && <span className="stream-cursor" />}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const ConfidenceRing = ({ value, color = '#8b5cf6' }) => {
  const r = 20; const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return (
    <div className="conf-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle className="conf-ring-bg" cx="26" cy="26" r={r} />
        <circle className="conf-ring-fill"
          cx="26" cy="26" r={r}
          stroke={color}
          strokeDasharray={circ}
          strokeDashoffset={offset}
        />
      </svg>
      <div className="conf-ring-text" style={{ color }}>{value}%</div>
    </div>
  );
};

                    cursor: 'pointer', whiteSpace: 'nowrap',
                    font: '500 11px/1 Inter,sans-serif',
                    transition: 'all .15s ease', flexShrink: 0,
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--q-border-active)'; e.currentTarget.style.color = 'var(--q-text-primary)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--q-border)'; e.currentTarget.style.color = 'var(--q-text-secondary)'; }}
                  disabled={isStreaming}
                >
                  {p.icon} {p.text}
                </button>
              ))}
            </div>
          )}

          <div className="chat-input-wrap">
            <textarea
              ref={textareaRef}
              className="chat-textarea"
              placeholder="Ask anything — market analysis, risk, strategies…"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              rows={1}
              maxLength={maxChars}
              disabled={false}
              aria-label="Chat input"
            />
            <div className="chat-input-actions">
              <button className="attach-btn" title="Attach file" aria-label="Attach file">📎</button>
              {isStreaming ? (
                <button className="send-btn stop" onClick={stopStream} title="Stop generating" aria-label="Stop">■</button>
              ) : (
                <button
                  className="send-btn"
                  onClick={() => sendMessage()}
                  disabled={!input.trim()}
                  title="Send (Enter)"
                  aria-label="Send"
                >
                  ↑
                </button>
              )}
            </div>
          </div>

          <div className="chat-input-footer">
            <span style={{ color: 'var(--q-text-tertiary)', fontSize: 10 }}>
              {isStreaming ? (
                <span style={{ color: 'var(--q-purple-400)', fontWeight: 500 }}>● Generating response…</span>
              ) : (
                'Enter to send · Shift+Enter for new line · Esc to stop'
              )}
            </span>
            <span className={`char-count ${charCount > maxChars * 0.85 ? 'warn' : ''}`}>
              {charCount} / {maxChars}
            </span>
          </div>
        </div>
      </div>

      {/* ── RIGHT: Insights + History ── */}
      <div className="right-panel">
        <div className="right-panel-tabs">
          <button className={`rpanel-tab ${activeTab === 'insights' ? 'active' : ''}`} onClick={() => setActiveTab('insights')}>📊 AI Insights</button>
          <button className={`rpanel-tab ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>🕐 History</button>
        </div>
        <div className="right-panel-content">
          {activeTab === 'insights' ? (
            <InsightCards analysisState={analysisState} />
          ) : (
            <HistoryPanel
              sessions={sessions}
              activeId={activeSession}
              onSelect={id => { setActiveSession(id); clearChat(); }}
              onNew={newSession}
            />
          )}
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div className="toast">
          <span className="toast-icon">{toast.icon}</span>
          <span>{toast.message}</span>
        </div>
      )}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════ */
const App = () => {
  const [isDark, setIsDark]         = useState(true);
  const [activePage, setActivePage] = useState('ai');
  const [loggedIn, setLoggedIn]     = useState(false);
  const [loginForm, setLoginForm]   = useState({ u:'', p:'' });
  const [loginLoading, setLoading]  = useState(false);
  const [loginError, setLoginError] = useState('');

  const toggleTheme = () => {
    setIsDark(d => !d);
    document.body.classList.toggle('light-mode');
  };

  const handleLogin = async () => {
    if (!loginForm.u || !loginForm.p) { setLoginError('Please fill in all fields.'); return; }
    setLoading(true); setLoginError('');
    await new Promise(r => setTimeout(r, 700));
    setLoading(false);
    setLoggedIn(true);
  };

  if (!loggedIn) return (
    <div style={{ minHeight:'100vh', background:'var(--q-bg-base)', display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
      <div style={{ width:'100%', maxWidth:380, background:'var(--q-bg-card)', border:'1px solid var(--q-border)', borderRadius:16, padding:32, backdropFilter:'blur(20px)' }}>
        <div style={{ textAlign:'center', marginBottom:24 }}>
          <div style={{ width:46, height:46, background:T.gradPrimary, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, fontWeight:800, color:'white', margin:'0 auto 12px', boxShadow:'0 8px 24px rgba(139,92,246,.35)' }}>Q</div>
          <div style={{ fontSize:19, fontWeight:700 }}>Welcome to Quantoryx</div>
          <div style={{ fontSize:12, color:'var(--q-text-secondary)', marginTop:4 }}>AI-Powered Trading Platform</div>
        </div>
        {loginError && <div style={{ background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.2)', borderRadius:8, padding:'8px 12px', fontSize:12, color:'#fca5a5', marginBottom:14 }}>{loginError}</div>}
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {[['Username','text',loginForm.u, v => setLoginForm(f=>({...f,u:v}))],['Password','password',loginForm.p, v => setLoginForm(f=>({...f,p:v}))]].map(([label, type, val, setter]) => (
            <div key={label} style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <label style={{ fontSize:10, fontWeight:600, textTransform:'uppercase', letterSpacing:.4, color:'var(--q-text-secondary)' }}>{label}</label>
              <input type={type} value={val} onChange={e=>setter(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}
                style={{ background:'rgba(255,255,255,.04)', border:'1px solid var(--q-border)', borderRadius:6, padding:'8px 12px', color:'var(--q-text-primary)', fontSize:13, fontFamily:'inherit', outline:'none' }}
                placeholder={label === 'Username' ? 'Enter username' : '••••••••'} />
            </div>
          ))}
          <button onClick={handleLogin} disabled={loginLoading}
            style={{ background:T.gradPrimary, color:'white', border:'none', borderRadius:8, padding:'10px', fontSize:14, fontWeight:700, cursor:'pointer', marginTop:6, display:'flex', alignItems:'center', justifyContent:'center', gap:8, fontFamily:'inherit', boxShadow:'0 2px 12px rgba(139,92,246,.35)' }}>
            {loginLoading ? '⏳ Signing in…' : '→ Sign In'}
          </button>
        </div>
        <div style={{ marginTop:18, padding:'10px 12px', background:'rgba(139,92,246,.06)', border:'1px solid rgba(139,92,246,.14)', borderRadius:8, fontSize:11, color:'var(--q-text-tertiary)', textAlign:'center' }}>
          🚀 Demo: enter any username/password to access the AI Assistant
        </div>
      </div>
    </div>
  );

  const renderPage = () => {
    if (activePage === 'ai') return <AIAssistantPage />;
    const pmap = { dashboard:{t:'Dashboard',i:'⬛'}, strategies:{t:'Strategies',i:'📋'}, backtest:{t:'Backtest',i:'▶'}, optimize:{t:'Optimize',i:'⚙'}, portfolio:{t:'Portfolio',i:'💼'}, reports:{t:'Reports',i:'📊'}, regime:{t:'Market Regime',i:'📡'}, settings:{t:'Settings',i:'⚙'} };
    const p = pmap[activePage];
    return <PlaceholderPage title={p?.t||activePage} icon={p?.i||'📄'} />;
  };

  return (
    <div className={`app-layout ${isDark ? '' : 'light-mode'}`}>
      <Header isDark={isDark} onToggleTheme={toggleTheme} />
      <Sidebar activePage={activePage} onPageChange={setActivePage} />
      {renderPage()}
      <MobileNav activePage={activePage} onPageChange={setActivePage} />
    </div>
  );
};

</script>
