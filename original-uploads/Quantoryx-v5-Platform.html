<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantoryx v5.0 — AI-Powered Trading Platform</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
/* ═══════════════════════════════════════════════
   QUANTORYX DESIGN SYSTEM v5.0
   Dashboard + AI Assistant — Unified
═══════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════
       QUANTORYX DESIGN SYSTEM v5.0
       Token-based, glassmorphism, purple→blue gradient
    ═══════════════════════════════════════════════ */
    :root {
      /* Core Palette */
      --q-bg-base: #0a0b14;
      --q-bg-surface: #0f1022;
      --q-bg-card: rgba(255,255,255,0.04);
      --q-bg-card-hover: rgba(255,255,255,0.07);
      --q-bg-sidebar: #0c0d1f;
      --q-bg-glass: rgba(13,14,32,0.85);

      /* Gradient Brand */
      --q-grad-primary: linear-gradient(135deg, #7c3aed 0%, #4f46e5 50%, #2563eb 100%);
      --q-grad-accent: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      --q-grad-success: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --q-grad-danger: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);

      /* Text */
      --q-text-primary: #f0f1ff;
      --q-text-secondary: #8b8fa8;
      --q-text-tertiary: #5a5e7a;
      --q-text-accent: #a78bfa;
      --q-text-success: #10b981;
      --q-text-danger: #f87171;
      --q-text-warning: #fbbf24;

      /* Borders */
      --q-border: rgba(255,255,255,0.07);
      --q-border-active: rgba(139,92,246,0.4);
      --q-border-glass: rgba(255,255,255,0.1);

      /* Purple Brand */
      --q-purple-500: #8b5cf6;
      --q-purple-600: #7c3aed;
      --q-purple-400: #a78bfa;
      --q-blue-500: #3b82f6;
      --q-blue-600: #2563eb;
      --q-indigo-500: #6366f1;

      /* Shadows */
      --q-shadow-card: 0 4px 24px rgba(0,0,0,0.3);
      --q-shadow-glow: 0 0 32px rgba(139,92,246,0.15);
      --q-shadow-elevated: 0 8px 40px rgba(0,0,0,0.4);

      /* Layout */
      --q-sidebar-w: 220px;
      --q-header-h: 56px;
      --q-radius: 12px;
      --q-radius-sm: 8px;
      --q-radius-lg: 16px;
    }

    /* Light Mode */
    .light-mode {
      --q-bg-base: #f4f5fa;
      --q-bg-surface: #ffffff;
      --q-bg-card: rgba(255,255,255,0.9);
      --q-bg-card-hover: rgba(255,255,255,1);
      --q-bg-sidebar: #ffffff;
      --q-bg-glass: rgba(255,255,255,0.9);
      --q-text-primary: #0f1022;
      --q-text-secondary: #4b5563;
      --q-text-tertiary: #9ca3af;
      --q-border: rgba(0,0,0,0.08);
      --q-border-active: rgba(139,92,246,0.3);
      --q-border-glass: rgba(0,0,0,0.1);
      --q-shadow-card: 0 2px 16px rgba(0,0,0,0.08);
      --q-shadow-glow: 0 0 24px rgba(139,92,246,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--q-bg-base);
      color: var(--q-text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 2px; }

    /* ═══ LAYOUT ═══ */
    .app-layout {
      display: grid;
      grid-template-columns: var(--q-sidebar-w) 1fr;
      grid-template-rows: var(--q-header-h) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══ HEADER ═══ */
    .header {
      grid-column: 1 / -1;
      background: var(--q-bg-glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--q-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      width: var(--q-sidebar-w);
      padding-left: 4px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--q-grad-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
    }

    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-name { font-size: 15px; font-weight: 700; color: var(--q-text-primary); letter-spacing: 0.5px; }
    .logo-tagline { font-size: 9px; color: var(--q-text-secondary); font-weight: 400; margin-top: 1px; }

    .header-search {
      flex: 1;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: var(--q-radius-sm);
      padding: 0 14px;
      height: 36px;
      color: var(--q-text-secondary);
      font-size: 13px;
    }

    .header-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--q-text-primary);
      font-size: 13px;
      flex: 1;
      font-family: inherit;
    }

    .header-search input::placeholder { color: var(--q-text-tertiary); }

    .kbd {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--q-text-tertiary);
    }

    .header-spacer { flex: 1; }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.open { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-dot.closed { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--q-radius-sm);
      border: none;
      background: var(--q-bg-card);
      color: var(--q-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--q-bg-card-hover);
      color: var(--q-text-primary);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--q-grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: 2px solid var(--q-border-active);
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      background: var(--q-bg-sidebar);
      border-right: 1px solid var(--q-border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 2px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--q-text-tertiary);
      padding: 10px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--q-radius-sm);
      cursor: pointer;
      color: var(--q-text-secondary);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      position: relative;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--q-bg-card);
      color: var(--q-text-primary);
    }

    .nav-item.active {
      background: rgba(139,92,246,0.12);
      color: var(--q-purple-400);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: var(--q-grad-accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    .nav-badge {
      margin-left: auto;
      background: var(--q-grad-accent);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
    }

    .nav-dot {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .sidebar-ai-card {
      margin: 12px 4px 4px;
      padding: 16px;
      background: var(--q-grad-primary);
      border-radius: var(--q-radius);
      position: relative;
      overflow: hidden;
    }

    .sidebar-ai-card::before {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .sidebar-ai-title { font-size: 13px; font-weight: 700; color: white; margin-bottom: 2px; }
    .sidebar-ai-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }

    .sidebar-ai-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s;
      width: 100%;
    }

    .sidebar-ai-btn:hover { background: rgba(255,255,255,0.3); }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid var(--q-border);
      padding-top: 8px;
    }

    /* ═══ MAIN CONTENT ═══ */
    .main-content {
      overflow-y: auto;
      background: var(--q-bg-base);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ═══ PAGE HEADER ═══ */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .page-title { font-size: 20px; font-weight: 700; color: var(--q-text-primary); }
    .page-sub { font-size: 13px; color: var(--q-text-secondary); margin-top: 2px; }

    .page-actions { display: flex; gap: 8px; align-items: center; }

    /* ═══ CARDS ═══ */
    .card {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: var(--q-radius);
      padding: 16px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: var(--q-border-glass);
      box-shadow: var(--q-shadow-card);
    }

    /* ═══ STAT CARDS ROW ═══ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: var(--q-radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .stat-card:hover { border-color: var(--q-border-active); box-shadow: var(--q-shadow-glow); }
    .stat-card:hover::before { opacity: 1; }
    .stat-card.grad-purple::before { background: var(--q-grad-accent); }
    .stat-card.grad-blue::before { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
    .stat-card.grad-green::before { background: var(--q-grad-success); }
    .stat-card.grad-red::before { background: var(--q-grad-danger); }
    .stat-card.grad-orange::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
    .stat-card.grad-cyan::before { background: linear-gradient(90deg, #06b6d4, #3b82f6); }

    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

    .stat-label { font-size: 11px; font-weight: 500; color: var(--q-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }

    .stat-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .stat-icon.purple { background: rgba(139,92,246,0.15); color: var(--q-purple-400); }
    .stat-icon.blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .stat-icon.green { background: rgba(16,185,129,0.15); color: #34d399; }
    .stat-icon.red { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .stat-icon.orange { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .stat-icon.cyan { background: rgba(6,182,212,0.15); color: #67e8f9; }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .stat-change {
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stat-change.up { color: var(--q-text-success); }
    .stat-change.down { color: var(--q-text-danger); }
    .stat-change.neutral { color: var(--q-text-secondary); }

    .sparkline { margin-top: 8px; opacity: 0.8; }

    /* ═══ CHARTS GRID ═══ */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 320px 260px;
      gap: 14px;
    }

    /* ═══ AI INSIGHT CARD ═══ */
    .ai-insight-card {
      background: linear-gradient(135deg, rgba(17,17,40,0.95) 0%, rgba(26,17,60,0.95) 100%);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: var(--q-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .ai-insight-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);
    }

    .ai-header { display: flex; align-items: center; justify-content: space-between; }
    .ai-header-title { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--q-text-secondary); }
    .ai-badge { background: var(--q-grad-accent); color: white; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

    .ai-signal {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .ai-signal.bullish { color: #10b981; }
    .ai-signal.bearish { color: #ef4444; }
    .ai-signal.neutral { color: #f59e0b; }

    .ai-confidence { font-size: 13px; font-weight: 500; color: var(--q-text-secondary); margin-top: -4px; }
    .ai-confidence span { color: var(--q-purple-400); font-weight: 700; }

    .confidence-bar {
      height: 4px;
      background: var(--q-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--q-grad-accent);
      transition: width 1s ease;
    }

    .ai-factors { display: flex; flex-direction: column; gap: 4px; }
    .ai-factor { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--q-text-secondary); }
    .ai-factor-dot { width: 5px; height: 5px; border-radius: 50%; background: #10b981; flex-shrink: 0; }

    .ai-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* ═══ MARKET REGIME ═══ */
    .regime-card {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: var(--q-radius);
      padding: 16px;
    }

    .regime-donut { display: flex; align-items: center; justify-content: center; margin: 8px 0; position: relative; }

    .regime-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .regime-name { font-size: 13px; font-weight: 700; }
    .regime-pct { font-size: 11px; color: var(--q-text-secondary); }

    .regime-legend { display: flex; flex-direction: column; gap: 5px; }
    .regime-item { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
    .regime-item-label { display: flex; align-items: center; gap: 6px; color: var(--q-text-secondary); }
    .regime-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .regime-item-pct { font-weight: 600; color: var(--q-text-primary); }

    /* ═══ OPTIMIZE CARD ═══ */
    .optimize-card {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      border-radius: var(--q-radius);
      padding: 16px;
    }

    .optimize-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 10px; font-weight: 500; color: var(--q-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }

    .form-select, .form-input {
      background: var(--q-bg-base);
      border: 1px solid var(--q-border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--q-text-primary);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      cursor: pointer;
    }

    .form-select:focus, .form-input:focus { border-color: var(--q-purple-500); }

    .slider-group { grid-column: 1 / -1; }

    .slider {
      width: 100%;
      margin-top: 6px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--q-border);
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--q-purple-500);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 0 6px rgba(139,92,246,0.5);
    }

    .slider-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--q-text-secondary); }

    /* ═══ PORTFOLIO CARD ═══ */
    .portfolio-card { grid-column: 1 / -1; }
    .portfolio-grid { display: grid; grid-template-columns: 1fr 240px; gap: 16px; }

    .portfolio-overview { display: flex; flex-direction: column; gap: 16px; }

    .portfolio-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid var(--q-border);
      border-bottom: 1px solid var(--q-border);
    }

    .meta-item {}
    .meta-label { font-size: 10px; color: var(--q-text-tertiary); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
    .meta-value { font-size: 18px; font-weight: 700; }
    .meta-value.positive { color: var(--q-text-success); }
    .meta-value.negative { color: var(--q-text-danger); }
    .meta-value.normal { color: var(--q-text-primary); }

    /* ═══ HOLDINGS & TRADES ═══ */
    .holdings-section {}
    .section-title { font-size: 12px; font-weight: 600; color: var(--q-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }

    .allocation-chart { display: flex; flex-direction: column; gap: 4px; }

    .alloc-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .alloc-bar-wrap { flex: 1; height: 4px; background: var(--q-border); border-radius: 2px; overflow: hidden; }
    .alloc-bar { height: 100%; border-radius: 2px; }
    .alloc-name { width: 60px; color: var(--q-text-secondary); }
    .alloc-pct { width: 32px; text-align: right; color: var(--q-text-primary); font-weight: 600; }

    .trades-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .trades-table th { text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--q-text-tertiary); padding: 6px 8px; border-bottom: 1px solid var(--q-border); }
    .trades-table td { padding: 8px 8px; border-bottom: 1px solid var(--q-border); color: var(--q-text-secondary); }
    .trades-table tbody tr:hover td { background: var(--q-bg-card-hover); color: var(--q-text-primary); }
    .trades-table td:first-child { color: var(--q-text-primary); font-weight: 500; }

    .pair-badge {
      display: inline-block;
      background: rgba(139,92,246,0.12);
      color: var(--q-purple-400);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .change-positive { color: var(--q-text-success); }
    .change-negative { color: var(--q-text-danger); }

    /* ═══ SYSTEM STATUS ═══ */
    .system-status-card { }

    .status-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--q-border); }
    .status-row:last-child { border-bottom: none; }
    .status-row-label { font-size: 12px; color: var(--q-text-secondary); }
    .status-pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .status-pill.ok { background: rgba(16,185,129,0.15); color: #34d399; }
    .status-pill.warn { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .status-pill.error { background: rgba(239,68,68,0.15); color: #fca5a5; }

    /* ═══ BOTTOM ROW ═══ */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 300px;
      gap: 14px;
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--q-grad-primary);
      color: white;
      box-shadow: 0 2px 12px rgba(139,92,246,0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 20px rgba(139,92,246,0.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--q-bg-card);
      border: 1px solid var(--q-border);
      color: var(--q-text-secondary);
    }

    .btn-ghost:hover {
      border-color: var(--q-border-glass);
      color: var(--q-text-primary);
    }

    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-full { width: 100%; justify-content: center; }

    /* ═══ CARD HEADERS ═══ */
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--q-text-primary); display: flex; align-items: center; gap: 6px; }
    .card-title-icon { font-size: 14px; }
    .card-actions { display: flex; gap: 6px; align-items: center; }

    .tab-group { display: flex; gap: 2px; background: var(--q-bg-base); border-radius: 6px; padding: 2px; }
    .tab-btn { padding: 4px 10px; border-radius: 5px; border: none; background: none; color: var(--q-text-tertiary); font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .tab-btn.active { background: var(--q-bg-card); color: var(--q-text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.2); }

    .select-sm {
      background: var(--q-bg-base);
      border: 1px solid var(--q-border);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--q-text-secondary);
      font-size: 11px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    /* ═══ RISK WARNING ═══ */
    .risk-warning {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: var(--q-radius-sm);
      padding: 8px 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11px;
      color: var(--q-text-warning);
      margin-top: 8px;
    }

    .risk-warning-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    /* ═══ STRATEGY LIST ═══ */
    .strategy-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .strategy-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: var(--q-bg-base); border-radius: 7px; border: 1px solid var(--q-border); font-size: 12px; transition: border-color 0.15s; }
    .strategy-row:hover { border-color: var(--q-border-glass); }
    .strategy-name { font-weight: 500; color: var(--q-text-primary); }
    .strategy-meta { font-size: 11px; color: var(--q-text-tertiary); font-family: 'JetBrains Mono', monospace; }
    .strategy-metrics { display: flex; gap: 10px; font-size: 11px; }

    /* ═══ LOADING ═══ */
    .skeleton {
      background: linear-gradient(90deg, var(--q-bg-card) 25%, var(--q-bg-card-hover) 50%, var(--q-bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ═══ MOBILE ═══ */
    @media (max-width: 1100px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .charts-grid { grid-template-columns: 1fr 280px; }
      .bottom-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      :root { --q-sidebar-w: 0px; }
      .app-layout { grid-template-columns: 1fr; grid-template-rows: var(--q-header-h) 1fr; }
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .portfolio-grid { grid-template-columns: 1fr; }
      .portfolio-meta { grid-template-columns: repeat(2, 1fr); }
      .bottom-grid { grid-template-columns: 1fr; }
      .header-search { display: none; }
    }

    /* ═══ TRANSITIONS ═══ */
    .fade-in { animation: fadeIn 0.3s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══ TOOLTIP ═══ */
    .recharts-tooltip-wrapper .recharts-default-tooltip {
      background: var(--q-bg-glass) !important;
      border: 1px solid var(--q-border) !important;
      border-radius: 8px !important;
      font-size: 12px !important;
      backdrop-filter: blur(12px) !important;
    }

    .recharts-cartesian-axis-tick-value { fill: var(--q-text-tertiary) !important; font-size: 10px !important; }

    /* Optimization chart 3D surface placeholder */
    .surface-chart {
      width: 100%;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #1a0a3f 0%, #0f1a4f 100%);
    }

    .surface-grid { position: absolute; inset: 0; opacity: 0.3; }

    /* ═══ MOBILE NAV BAR ═══ */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--q-bg-glass);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--q-border);
      padding: 8px 0 12px;
      z-index: 200;
    }

    .mobile-nav-items { display: flex; justify-content: space-around; align-items: center; }
    .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--q-text-tertiary); cursor: pointer; padding: 4px 12px; border-radius: 8px; }
    .mobile-nav-item.active { color: var(--q-purple-400); }
    .mobile-nav-item-icon { font-size: 18px; }

    @media (max-width: 768px) {
      .mobile-nav { display: block; }
      .main-content { padding-bottom: 80px; }
    }

    /* ═══ PROGRESS RING ═══ */
    .progress-ring-text { font-size: 11px; font-family: 'JetBrains Mono', monospace; }


/* ═══════════════════════════════════════════════
   AI TRADING ASSISTANT — Module Styles
═══════════════════════════════════════════════ */
.ai-page {
  display: grid;
  grid-template-columns: 1fr 300px;
  height: 100%;
  overflow: hidden;
  background: var(--q-bg-base);
}

/* ── Left: Chat column ── */
.chat-column {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  border-right: 1px solid var(--q-border);
}

/* ── Chat top bar ── */
.chat-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--q-border);
  flex-shrink: 0;
  background: var(--q-bg-glass);
  backdrop-filter: blur(16px);
}

.chat-topbar-left { display: flex; align-items: center; gap: 10px; }
.chat-topbar-title { font-size: 15px; font-weight: 700; color: var(--q-text-primary); }
.chat-topbar-sub { font-size: 11px; color: var(--q-text-secondary); margin-top: 1px; }

.ai-live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.2);
  border-radius: 20px; padding: 3px 8px;
  font-size: 10px; font-weight: 600; color: var(--q-green-500);
}

.ai-live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--q-green-500);
  animation: pulse 2s infinite;
}

.chat-actions { display: flex; align-items: center; gap: 6px; }

.chat-action-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--q-border);
  background: var(--q-bg-card);
  color: var(--q-text-secondary);
  font-size: 11px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: all var(--q-t);
  white-space: nowrap;
}

.chat-action-btn:hover { border-color: var(--q-border-glass); color: var(--q-text-primary); }
.chat-action-btn.danger:hover { border-color: rgba(239,68,68,.3); color: var(--q-text-danger); }

/* ── Keyboard shortcuts hint ── */
.kbd-hint {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--q-text-tertiary);
}

.kbd-tag {
  display: inline-flex; align-items: center;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 4px; padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--q-text-tertiary);
}

/* ── Messages area ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── Empty / Welcome state ── */
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 16px;
  padding: 40px 20px;
  text-align: center;
  animation: fadeUp .4s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

.welcome-orb {
  width: 68px; height: 68px;
  background: var(--q-grad-primary);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  box-shadow: 0 12px 32px rgba(139,92,246,.35), 0 0 60px rgba(139,92,246,.1);
  animation: orbFloat 3s ease-in-out infinite;
}

@keyframes orbFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.welcome-title { font-size: 20px; font-weight: 700; color: var(--q-text-primary); }
.welcome-sub { font-size: 13px; color: var(--q-text-secondary); max-width: 340px; line-height: 1.6; }

.welcome-caps {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; max-width: 420px;
}

.welcome-cap {
  display: flex; align-items: center; gap: 6px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 6px; padding: 5px 10px;
  font-size: 11px; font-weight: 500; color: var(--q-text-secondary);
}

.welcome-cap-dot { width: 5px; height: 5px; border-radius: 50%; }

/* ── Suggested prompts ── */
.suggested-prompts {
  display: flex; flex-direction: column; gap: 6px;
  width: 100%; max-width: 500px;
  margin-top: 4px;
}

.suggested-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--q-text-tertiary);
  text-align: left; margin-bottom: 2px;
}

.prompt-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px; color: var(--q-text-secondary);
  font-family: inherit; text-align: left;
  transition: all var(--q-t-md);
  animation: fadeUp .4s ease both;
  width: 100%;
}

.prompt-chip:hover {
  border-color: var(--q-border-active);
  color: var(--q-text-primary);
  background: rgba(139,92,246,.06);
  box-shadow: var(--q-shadow-glow);
  transform: translateX(3px);
}

.prompt-chip-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: rgba(139,92,246,.1);
  transition: background var(--q-t);
}

.prompt-chip:hover .prompt-chip-icon { background: rgba(139,92,246,.2); }

.prompt-chip-text { flex: 1; font-size: 13px; font-weight: 500; }
.prompt-chip-arrow { color: var(--q-text-tertiary); font-size: 14px; transition: transform var(--q-t); }
.prompt-chip:hover .prompt-chip-arrow { transform: translateX(3px); color: var(--q-purple-400); }

/* ── Message bubbles ── */
.message-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: msgIn .25s ease both;
  margin-bottom: 6px;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.message-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 0;
}

.message-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  margin-top: 2px;
}

.msg-avatar.ai {
  background: var(--q-grad-primary);
  color: white;
  box-shadow: 0 2px 8px rgba(139,92,246,.3);
}

.msg-avatar.user {
  background: rgba(139,92,246,.15);
  color: var(--q-purple-400);
  border: 1px solid var(--q-border-active);
}

.msg-body { max-width: 76%; display: flex; flex-direction: column; gap: 4px; }
.message-row.user .msg-body { align-items: flex-end; }

.msg-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--q-text-tertiary);
  padding: 0 4px;
}

.message-row.user .msg-meta { flex-direction: row-reverse; }

.msg-name { font-weight: 600; color: var(--q-text-secondary); font-size: 11px; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.65;
  position: relative;
  word-break: break-word;
}

.msg-bubble.ai {
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 14px 14px 14px 4px;
  color: var(--q-text-primary);
}

.msg-bubble.user {
  background: var(--q-grad-primary);
  color: white;
  border-radius: 14px 14px 4px 14px;
  box-shadow: 0 2px 12px rgba(139,92,246,.25);
}

/* ── Message actions (hover) ── */
.msg-actions {
  display: flex; align-items: center; gap: 3px;
  opacity: 0; transition: opacity var(--q-t);
  margin-top: 2px;
}

.message-group:hover .msg-actions { opacity: 1; }

.msg-action-btn {
  width: 26px; height: 26px;
  border-radius: 6px; border: 1px solid var(--q-border);
  background: var(--q-bg-card);
  color: var(--q-text-tertiary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all var(--q-t);
}

.msg-action-btn:hover { border-color: var(--q-border-glass); color: var(--q-text-primary); }
.msg-action-btn.copied { color: var(--q-green-500); border-color: rgba(16,185,129,.3); }

/* ── Markdown rendering ── */
.md-content h1 { font-size: 17px; font-weight: 700; margin: 12px 0 6px; color: var(--q-text-primary); }
.md-content h2 { font-size: 15px; font-weight: 700; margin: 10px 0 5px; color: var(--q-text-primary); }
.md-content h3 { font-size: 13px; font-weight: 600; margin: 8px 0 4px; color: var(--q-text-primary); }
.md-content p  { margin: 6px 0; }
.md-content ul, .md-content ol { padding-left: 18px; margin: 6px 0; }
.md-content li { margin: 3px 0; }
.md-content strong { font-weight: 700; color: var(--q-text-primary); }
.md-content em    { font-style: italic; }
.md-content hr    { border: none; border-top: 1px solid var(--q-border); margin: 12px 0; }

.md-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  background: rgba(139,92,246,.12);
  color: var(--q-purple-400);
  padding: 1px 5px;
  border-radius: 4px;
}

.msg-bubble.user .md-content code {
  background: rgba(255,255,255,.2);
  color: rgba(255,255,255,.95);
}

.md-codeblock {
  position: relative;
  margin: 10px 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--q-border);
}

.md-codeblock-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px;
  background: rgba(0,0,0,.3);
  border-bottom: 1px solid var(--q-border);
}

.md-codeblock-lang {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--q-text-tertiary);
  font-family: 'JetBrains Mono', monospace;
}

.md-codeblock-copy {
  font-size: 10px; font-weight: 600; color: var(--q-text-tertiary);
  background: none; border: none; cursor: pointer;
  font-family: inherit; transition: color var(--q-t);
  display: flex; align-items: center; gap: 4px;
}

.md-codeblock-copy:hover { color: var(--q-text-primary); }
.md-codeblock-copy.copied { color: var(--q-green-500); }

.md-codeblock pre {
  margin: 0;
  padding: 12px 14px;
  overflow-x: auto;
  background: rgba(0,0,0,.25);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #c9d1d9;
}

/* ── Typing indicator ── */
.typing-indicator {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 14px 14px 14px 4px;
  width: fit-content;
  animation: msgIn .2s ease both;
}

.typing-dots {
  display: flex; gap: 4px; align-items: center;
}

.typing-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--q-purple-400);
  animation: typeBounce 1.2s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }

@keyframes typeBounce {
  0%,80%,100% { transform: translateY(0); opacity: .4; }
  40%          { transform: translateY(-6px); opacity: 1; }
}

.typing-label {
  font-size: 11px; color: var(--q-text-tertiary);
  font-style: italic;
}

/* ── Streaming cursor ── */
.stream-cursor {
  display: inline-block;
  width: 2px; height: 14px;
  background: var(--q-purple-400);
  border-radius: 1px;
  vertical-align: middle;
  margin-left: 2px;
  animation: blink .8s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* ── Input area ── */
.chat-input-area {
  flex-shrink: 0;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--q-border);
  background: var(--q-bg-glass);
  backdrop-filter: blur(16px);
}

.chat-input-wrap {
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--q-bg-card);
  border: 1px solid var(--q-border);
  border-radius: 14px;
  padding: 10px 14px;
  transition: border-color var(--q-t-md), box-shadow var(--q-t-md);
}

.chat-input-wrap:focus-within {
  border-color: var(--q-border-active);
  box-shadow: 0 0 0 3px rgba(139,92,246,.08), var(--q-shadow-glow);
}

.chat-textarea {
  flex: 1;
  background: none; border: none; outline: none;
  color: var(--q-text-primary);
  font-size: 13px; line-height: 1.5;
  font-family: inherit;
  resize: none;
  min-height: 22px;
  max-height: 140px;
  overflow-y: auto;
}

.chat-textarea::placeholder { color: var(--q-text-tertiary); }

.insight-card:hover::before { opacity: 1; }

.insight-card.bearish::before  { background: var(--q-grad-danger); }

.insight-card.blue::before     { background: linear-gradient(90deg,#3b82f6,#06b6d4); }

.insight-label {

function getAIResponse(query) {
  const q = query.toLowerCase().trim();
  for (const [key, val] of Object.entries(AI_RESPONSES)) {
    if (key !== 'default' && q.includes(key)) return val;
  }
  // partial matches
  if (q.includes('eur') || q.includes('usd') || q.includes('forex')) return AI_RESPONSES['analyze eur/usd'];
  if (q.includes('setup') || q.includes('trade') && q.includes('today')) return AI_RESPONSES["find today's best setup"];
  if (q.includes('sentiment') || q.includes('market')) return AI_RESPONSES['explain market sentiment'];
  if (q.includes('strategy') || q.includes('strateg')) return AI_RESPONSES['which built-in strategy should i use'];
  if (q.includes('risk') || q.includes('position') || q.includes('calculat')) return AI_RESPONSES['calculate my trade risk'];
  return AI_RESPONSES.default;
}

/* ═══════════════════════════════════════════════════════════
   MARKDOWN RENDERER
   Handles: headers, bold, italic, code blocks, inline code,
            lists, tables, blockquotes, hr
═══════════════════════════════════════════════════════════ */
const MarkdownRenderer = ({ content, isStreaming = false }) => {
  const [copiedBlock, setCopiedBlock] = useState(null);

  const copyBlock = (code, idx) => {
    navigator.clipboard?.writeText(code).catch(() => {});
    setCopiedBlock(idx);
    setTimeout(() => setCopiedBlock(null), 2000);
  };

  const renderLine = (line, key) => {
    // Table row
    if (line.startsWith('|')) {
      return null; // handled in block
    }
    // HR
    if (/^---+$/.test(line.trim())) {
      return <hr key={key} style={{ border: 'none', borderTop: '1px solid var(--q-border)', margin: '10px 0' }} />;
    }
    // Headers
    const h3 = line.match(/^###\s+(.+)/);
    const h2 = line.match(/^##\s+(.+)/);
    const h1 = line.match(/^#\s+(.+)/);
    if (h1) return <h1 key={key}>{inlineFormat(h1[1])}</h1>;
    if (h2) return <h2 key={key}>{inlineFormat(h2[1])}</h2>;
    if (h3) return <h3 key={key}>{inlineFormat(h3[1])}</h3>;
    // Blockquote
    if (line.startsWith('> ')) {
      return (
        <blockquote key={key} style={{
          borderLeft: '3px solid var(--q-purple-400)',
          paddingLeft: 12, margin: '8px 0',
          color: 'var(--q-text-secondary)', fontStyle: 'italic'
        }}>{inlineFormat(line.slice(2))}</blockquote>
      );
    }
    // List items
    if (/^[-*]\s/.test(line)) {
      return <li key={key} style={{ marginLeft: 16 }}>{inlineFormat(line.replace(/^[-*]\s/, ''))}</li>;
    }
    if (/^\d+\.\s/.test(line)) {
      return <li key={key} style={{ marginLeft: 16 }}>{inlineFormat(line.replace(/^\d+\.\s/, ''))}</li>;
    }
    // Empty line
    if (!line.trim()) return <div key={key} style={{ height: 6 }} />;
    // Normal paragraph
    return <p key={key}>{inlineFormat(line)}</p>;
  };

  const inlineFormat = (text) => {
    // Split on inline code, bold, italic patterns
    const parts = [];
    let remaining = text;
    let i = 0;
    const patterns = [
      { re: /`([^`]+)`/,           render: (m) => <code key={i++}>{m[1]}</code> },
      { re: /\*\*([^*]+)\*\*/,      render: (m) => <strong key={i++}>{m[1]}</strong> },
      { re: /\*([^*]+)\*/,          render: (m) => <em key={i++}>{m[1]}</em> },
      { re: /✅|❌|⚠️|🔴|🟢|🏆|🥇|🥈|🥉|⚡|💡|📊|🤖|📈|📉|💼|🎯|⚙|🔔/u, render: (m) => <span key={i++}>{m[0]}</span> },
    ];
    // Simple sequential parse
    const tokens = [];
    let src = text;
    while (src.length > 0) {
      let matched = false;
      for (const { re, render } of patterns) {
        const m = src.match(re);
        if (m && m.index === 0) {
          tokens.push(render(m));
          src = src.slice(m[0].length);
          matched = true; break;
        } else if (m) {
          tokens.push(src.slice(0, m.index));
          tokens.push(render(m));
          src = src.slice(m.index + m[0].length);
          matched = true; break;
        }
      }
      if (!matched) { tokens.push(src); src = ''; }
    }
    return tokens.map((t, idx) => typeof t === 'string' ? <React.Fragment key={idx}>{t}</React.Fragment> : React.cloneElement(t, { key: idx }));
  };

  // Split into blocks: code blocks and table blocks vs line content
  const blocks = [];
  const lines = content.split('\n');
  let i = 0;
  let codeBlockIdx = 0;

  while (i < lines.length) {
    // Code block
    if (lines[i].startsWith('```')) {
      const lang = lines[i].slice(3).trim() || 'text';
      const start = i + 1;
      let end = start;
      while (end < lines.length && !lines[end].startsWith('```')) end++;
      const code = lines.slice(start, end).join('\n');
      const cbIdx = codeBlockIdx++;
      blocks.push(
        <div key={`cb-${i}`} className="md-codeblock">
          <div className="md-codeblock-header">
            <span className="md-codeblock-lang">{lang}</span>
            <button
              className={`md-codeblock-copy ${copiedBlock === cbIdx ? 'copied' : ''}`}
              onClick={() => copyBlock(code, cbIdx)}
            >
              {copiedBlock === cbIdx ? '✓ Copied' : '⎘ Copy'}
            </button>
          </div>
          <pre>{code}</pre>
        </div>
      );
      i = end + 1;
      continue;
    }
    // Table block
    if (lines[i].startsWith('|') && i + 1 < lines.length && lines[i+1].startsWith('|---')) {
      const headers = lines[i].split('|').filter(Boolean).map(h => h.trim());
      const tableRows = [];
      let j = i + 2;
      while (j < lines.length && lines[j].startsWith('|')) {
        tableRows.push(lines[j].split('|').filter(Boolean).map(c => c.trim()));
        j++;
      }
      blocks.push(
        <div key={`t-${i}`} style={{ overflowX: 'auto', margin: '8px 0' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
            <thead>
              <tr>{headers.map((h, hi) => (
                <th key={hi} style={{ padding: '6px 10px', background: 'rgba(139,92,246,.1)', borderBottom: '1px solid var(--q-border)', textAlign: 'left', fontWeight: 600, color: 'var(--q-text-primary)', fontSize: 11 }}>
                  {h}
                </th>
              ))}</tr>
            </thead>
            <tbody>
              {tableRows.map((row, ri) => (
                <tr key={ri}>
                  {row.map((cell, ci) => (
                    <td key={ci} style={{ padding: '6px 10px', borderBottom: '1px solid var(--q-border)', color: 'var(--q-text-secondary)' }}>
                      {inlineFormat(cell)}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
      i = j;
      continue;
    }
    // Normal line
    blocks.push(renderLine(lines[i], `l-${i}`));
    i++;
  }

  return (
    <div className="md-content">
      {blocks}
      {isStreaming && <span className="stream-cursor" />}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════
   CONFIDENCE RING
═══════════════════════════════════════════════════════════ */
const ConfidenceRing = ({ value, color = '#8b5cf6' }) => {
  const r = 20; const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return (
    <div className="conf-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle className="conf-ring-bg" cx="26" cy="26" r={r} />
        <circle className="conf-ring-fill"
          cx="26" cy="26" r={r}
          stroke={color}
          strokeDasharray={circ}
          strokeDashoffset={offset}
        />
      </svg>
      <div className="conf-ring-text" style={{ color }}>{value}%</div>
    </div>
  );
};

            <div style={{ width: 34, height: 34, background: T.gradPrimary, borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 17, boxShadow: '0 2px 10px rgba(139,92,246,.35)' }}>✦</div>

              <div className="chat-topbar-title">AI Trading Assistant</div>
              <div className="chat-topbar-sub">Powered by Quantoryx Intelligence Engine</div>
            </div>
            <div className="ai-live-badge">
              <div className="ai-live-dot" />
              Live
            </div>
          </div>

          <div className="chat-actions">
            <div className="kbd-hint" style={{ marginRight: 6 }}>
              <kbd className="kbd-tag">⌘K</kbd>
              <span style={{ fontSize: 10, color: 'var(--q-text-tertiary)' }}>focus</span>
              <kbd className="kbd-tag" style={{ marginLeft: 6 }}>Shift↵</kbd>
              <span style={{ fontSize: 10, color: 'var(--q-text-tertiary)' }}>newline</span>
              <kbd className="kbd-tag" style={{ marginLeft: 6 }}>Esc</kbd>
              <span style={{ fontSize: 10, color: 'var(--q-text-tertiary)' }}>stop</span>
            </div>
            <button className="chat-action-btn" onClick={exportConversation} disabled={messages.length === 0} title="Export conversation">
              <span>⬇</span><span className="label">Export</span>
            </button>
            <button className="chat-action-btn danger" onClick={clearChat} disabled={messages.length === 0} title="Clear chat">
              <span>🗑</span><span className="label">Clear</span>
            </button>
            {/* Mobile: toggle panel */}
            <button
              className="chat-action-btn"
              style={{ display: 'none' }}
              id="panel-toggle"
              onClick={() => setShowPanel(p => !p)}
            >
              <span>📊</span>
            </button>
          </div>
        </div>

        {/* Messages */}
        <div className="chat-messages" id="chat-scroll">
          {messages.length === 0 ? (
            <div className="chat-welcome">
              <div className="welcome-orb">✦</div>
              <div>
                <div className="welcome-title">Quantoryx AI Trading Assistant</div>
                <div className="welcome-sub">
                  Ask me anything about your strategies, market analysis, risk management, or trading setups. I analyze your portfolio and current market conditions in real time.
                </div>
              </div>

              <div className="welcome-caps">
                {[
                  { dot: '#10b981', text: 'Real-time market analysis' },
                  { dot: '#a78bfa', text: 'Strategy recommendations' },
                  { dot: '#60a5fa', text: 'Risk calculations' },
                  { dot: '#fbbf24', text: 'Portfolio insights' },
                ].map(c => (
                  <div key={c.text} className="welcome-cap">
                    <div className="welcome-cap-dot" style={{ background: c.dot }} />
                    {c.text}

              <div className="suggested-prompts">
                <div className="suggested-label">Suggested Prompts</div>

                  <button
                    key={i}
                    className="prompt-chip"
                    style={{ animationDelay: `${i * 60}ms` }}
                    onClick={() => sendMessage(p.text)}
                  >
                    <div className="prompt-chip-icon">{p.icon}</div>
                    <div style={{ flex: 1 }}>
                      <div className="prompt-chip-text">{p.text}</div>
                      <div style={{ fontSize: 11, color: 'var(--q-text-tertiary)', marginTop: 1 }}>{p.sub}</div>
                    </div>
                    <span className="prompt-chip-arrow">›</span>
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <>
              {messages.map(msg => <Message key={msg.id} msg={msg} />)}

              {/* Typing indicator */}
              {showTyping && (
                <div className="message-row" style={{ marginBottom: 6 }}>
                  <div className="msg-avatar ai">✦</div>
                  <div className="typing-indicator">
                    <div className="typing-dots">
                      <div className="typing-dot" />
                      <div className="typing-dot" />
                      <div className="typing-dot" />
                    </div>
                    <span className="typing-label">Analyzing market data…</span>
                  </div>
                </div>
              )}

              <div ref={messagesEndRef} />
            </>
          )}
        </div>

        {/* Input */}
        <div className="chat-input-area">
          {/* Quick prompt chips (compact, inline, visible during chat) */}
          {messages.length > 0 && (
            <div style={{ display: 'flex', gap: 6, marginBottom: 10, overflowX: 'auto', paddingBottom: 2 }}>
              {PROMPTS.map((p, i) => (
                <button
                  key={i}
                  onClick={() => sendMessage(p.text)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 5,
                    padding: '4px 10px', borderRadius: 20,
                    border: '1px solid var(--q-border)',
                    background: 'var(--q-bg-card)',
                    color: 'var(--q-text-secondary)',
                    fontSize: 11, fontWeight: 500,
                    cursor: 'pointer', whiteSpace: 'nowrap',
                    font: '500 11px/1 Inter,sans-serif',
                    transition: 'all .15s ease', flexShrink: 0,
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--q-border-active)'; e.currentTarget.style.color = 'var(--q-text-primary)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--q-border)'; e.currentTarget.style.color = 'var(--q-text-secondary)'; }}
                  disabled={isStreaming}
                >
                  {p.icon} {p.text}
                </button>
              ))}
            </div>
          )}

          <div className="chat-input-wrap">
            <textarea
              ref={textareaRef}
              className="chat-textarea"
              placeholder="Ask anything — market analysis, risk, strategies…"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              rows={1}
              maxLength={maxChars}
              disabled={false}
              aria-label="Chat input"
            />
            <div className="chat-input-actions">
              <button className="attach-btn" title="Attach file" aria-label="Attach file">📎</button>
              {isStreaming ? (
                <button className="send-btn stop" onClick={stopStream} title="Stop generating" aria-label="Stop">■</button>
              ) : (
                <button
                  className="send-btn"
                  onClick={() => sendMessage()}
                  disabled={!input.trim()}
                  title="Send (Enter)"
                  aria-label="Send"
                >
                  ↑
                </button>
              )}
            </div>
          </div>

          <div className="chat-input-footer">
            <span style={{ color: 'var(--q-text-tertiary)', fontSize: 10 }}>
              {isStreaming ? (
                <span style={{ color: 'var(--q-purple-400)', fontWeight: 500 }}>● Generating response…</span>
              ) : (
                'Enter to send · Shift+Enter for new line · Esc to stop'
              )}
            </span>
            <span className={`char-count ${charCount > maxChars * 0.85 ? 'warn' : ''}`}>
              {charCount} / {maxChars}
            </span>
          </div>
        </div>
      </div>

      {/* ── RIGHT: Insights + History ── */}
      <div className="right-panel">
        <div className="right-panel-tabs">
          <button className={`rpanel-tab ${activeTab === 'insights' ? 'active' : ''}`} onClick={() => setActiveTab('insights')}>📊 AI Insights</button>
          <button className={`rpanel-tab ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>🕐 History</button>
        </div>
        <div className="right-panel-content">
          {activeTab === 'insights' ? (
            <InsightCards analysisState={analysisState} />
          ) : (
            <HistoryPanel
              sessions={sessions}
              activeId={activeSession}
              onSelect={id => { setActiveSession(id); clearChat(); }}
              onNew={newSession}
            />
          )}
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div className="toast">
          <span className="toast-icon">{toast.icon}</span>
          <span>{toast.message}</span>
        </div>
      )}
    </div>
  );
};

// ── Page transitions ──────────────────────────────────────
const PageTransition = ({ children, pageKey }) => {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    setVisible(false);
    const t = requestAnimationFrame(() => {
      requestAnimationFrame(() => setVisible(true));
    });
    return () => cancelAnimationFrame(t);
  }, [pageKey]);
  return (
    <div style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'none' : 'translateY(6px)',
      transition: 'opacity 0.22s ease, transform 0.22s ease',
      height: '100%', overflow: 'auto',
      background: 'var(--q-bg-base)',
      display: 'flex', flexDirection: 'column',
    }}>
      {children}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════
// ROOT APPLICATION
// ═══════════════════════════════════════════════════════════
const App = () => {
  const [isDark, setIsDark]         = useState(true);
  const [activePage, setActivePage] = useState('dashboard');
  const [prevPage, setPrevPage]     = useState('dashboard');
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [user, setUser]             = useState(null);

  const toggleTheme = () => {
    setIsDark(d => !d);
    document.body.classList.toggle('light-mode');
  };

  const handleLogin = userData => {
    setUser(userData);
    setIsLoggedIn(true);
  };

  const navigateTo = page => {
    setPrevPage(activePage);
    setActivePage(page);
  };

  if (!isLoggedIn) return <LoginPage onLogin={handleLogin} />;

  const renderPage = () => {
    const goAI = () => navigateTo('ai');
    switch(activePage) {
      case 'dashboard':  return <DashboardPage />;
      case 'ai':         return <AIAssistantPage />;
      case 'strategies': return <PlaceholderPage title="Strategies"    icon="📋" onGoAI={goAI} />;
      case 'backtest':   return <PlaceholderPage title="Backtest"       icon="▶"  onGoAI={goAI} />;
      case 'optimize':   return <PlaceholderPage title="Optimize"       icon="⚙"  onGoAI={goAI} />;
      case 'portfolio':  return <PlaceholderPage title="Portfolio"      icon="💼" onGoAI={goAI} />;
      case 'reports':    return <PlaceholderPage title="Reports"        icon="📊" onGoAI={goAI} />;
      case 'regime':     return <PlaceholderPage title="Market Regime"  icon="📡" onGoAI={goAI} />;
      case 'settings':   return <PlaceholderPage title="Settings"       icon="⚙"  onGoAI={goAI} />;
      default:           return <DashboardPage />;
    }
  };

  return (
    <div className={`app-layout ${isDark ? '' : 'light-mode'}`}>
      <Header isDark={isDark} onToggleTheme={toggleTheme} onPageChange={navigateTo} />
      <Sidebar activePage={activePage} onPageChange={navigateTo} />
      <PageTransition pageKey={activePage}>
        {renderPage()}
      </PageTransition>
      <MobileNav activePage={activePage} onPageChange={navigateTo} />
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
