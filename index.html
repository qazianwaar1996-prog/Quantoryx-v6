<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quantoryx v8 — AI-Powered Trading Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   QUANTORYX v8 — PIXEL-PERFECT DESIGN SYSTEM
   Dark/Light · Desktop/Mobile · All pages
═══════════════════════════════════════════════ */
:root{
  --bg0:#080a14;--bg1:#0d0f1f;--bg2:#111328;
  --card:rgba(255,255,255,.04);--cardh:rgba(255,255,255,.07);
  --sb:#090b1a;--glass:rgba(8,10,20,.93);--inp:rgba(255,255,255,.05);
  --ai-bg:linear-gradient(145deg,#0c0928 0%,#100838 100%);
  --brand:linear-gradient(135deg,#7c3aed,#4f46e5,#2563eb);
  --acc:linear-gradient(135deg,#8b5cf6,#6366f1);
  --ok-g:linear-gradient(135deg,#059669,#10b981);
  --err-g:linear-gradient(135deg,#dc2626,#ef4444);
  --t1:#eef0ff;--t2:#8b8fa8;--t3:#4e5270;
  --ok:#10b981;--err:#f87171;--wrn:#fbbf24;--acc-t:#a78bfa;
  --bd:rgba(255,255,255,.07);--bdh:rgba(255,255,255,.13);
  --bd-pu:rgba(139,92,246,.28);--bd-act:rgba(139,92,246,.5);
  --pu4:#a78bfa;--pu5:#8b5cf6;--pu6:#7c3aed;
  --bl4:#60a5fa;--gr4:#34d399;--re4:#f87171;--ye4:#fbbf24;--cy4:#67e8f9;
  --sh:0 4px 24px rgba(0,0,0,.35);--shg:0 0 32px rgba(139,92,246,.16);
  --she:0 8px 40px rgba(0,0,0,.5);--shb:0 2px 14px rgba(139,92,246,.38);
  --sbw:188px;--hdh:52px;--r:12px;--rsm:8px;--rlg:16px;
  --tr:.14s ease;--trm:.22s ease;
}
.lm,.lm *{color-scheme:light}
.lm{
  --bg0:#f0f2f9;--bg1:#fff;--bg2:#e8eaf4;
  --card:rgba(255,255,255,.92);--cardh:#fff;--sb:#fff;
  --glass:rgba(255,255,255,.95);--inp:rgba(0,0,0,.04);
  --ai-bg:linear-gradient(145deg,#f5f3ff,#ede8ff);
  --t1:#0d0f24;--t2:#4b5563;--t3:#9ca3af;
  --ok:#059669;--err:#dc2626;--wrn:#d97706;--acc-t:#7c3aed;
  --bd:rgba(0,0,0,.085);--bdh:rgba(0,0,0,.14);
  --bd-pu:rgba(139,92,246,.22);--bd-act:rgba(139,92,246,.38);
  --sh:0 2px 16px rgba(0,0,0,.08);--shg:0 0 24px rgba(139,92,246,.1);
  --she:0 8px 32px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow-x:hidden;font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{background:var(--bg0);color:var(--t1);transition:background .25s,color .25s}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.22);border-radius:2px}
::selection{background:rgba(139,92,246,.22)}
select option{background:var(--bg1);color:var(--t1)}

/* ── SHELL ── */
.shell{display:grid;grid-template-columns:var(--sbw) 1fr;grid-template-rows:var(--hdh) 1fr;height:100vh;overflow:hidden}

/* ── HEADER ── */
.hd{grid-column:1/-1;background:var(--glass);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:200;position:relative}
.hd-logo{display:flex;align-items:center;gap:8px;width:var(--sbw);flex-shrink:0;cursor:pointer;text-decoration:none}
.hd-Q{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 2px 10px rgba(124,58,237,.4)}
.hd-brand{display:flex;flex-direction:column;line-height:1.2}
.hd-name{font-size:12.5px;font-weight:800;letter-spacing:.5px;color:var(--t1)}
.hd-tag{font-size:9px;color:var(--t3);font-weight:400}
.hd-search{display:flex;align-items:center;gap:8px;flex:1;max-width:400px;min-width:0;background:var(--inp);border:1px solid var(--bd);border-radius:var(--rsm);padding:0 10px;height:33px;cursor:text;transition:border-color var(--tr)}
.hd-search:hover{border-color:var(--bdh)}
.hd-sq{font-size:12px;color:var(--t3)}
.hd-sph{font-size:12.5px;color:var(--t3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-kbd{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--t3);flex-shrink:0}
.hd-gap{flex:1}
.hd-mkt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap}
.hd-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hd-acts{display:flex;align-items:center;gap:2px}
.hd-ico{width:32px;height:32px;border-radius:var(--rsm);border:none;background:transparent;color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all var(--tr);position:relative}
.hd-ico:hover{background:var(--card);color:var(--t1)}
.hd-badge{position:absolute;top:-1px;right:-1px;width:14px;height:14px;background:#ef4444;border-radius:50%;font-size:8px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg0)}
.hd-av{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;border:2px solid var(--bd-act);cursor:pointer;transition:box-shadow var(--tr)}
.hd-av:hover{box-shadow:0 0 0 3px rgba(139,92,246,.22)}

/* ── SIDEBAR ── */
.sb{background:var(--sb);border-right:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column;padding:8px 7px;gap:1px}
.sb-it{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--rsm);color:var(--t2);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all var(--tr);position:relative;white-space:nowrap}
.sb-it:hover{background:var(--card);color:var(--t1)}
.sb-it.on{background:rgba(139,92,246,.13);color:var(--pu4)}
.sb-it.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--acc);border-radius:0 2px 2px 0}
.sb-ic{font-size:14px;width:17px;text-align:center;flex-shrink:0}
.sb-lb{flex:1}
.sb-bx{background:var(--acc);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:auto}
.sb-dt{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 5px var(--ok);margin-left:auto}
.sb-sp{flex:1;min-height:8px}
.sb-ai{margin:6px 3px 4px;padding:14px;background:linear-gradient(145deg,#180a45,#231060 60%,#16145a);border-radius:var(--r);border:1px solid rgba(139,92,246,.3);position:relative;overflow:hidden}
.sb-ai::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(139,92,246,.18);border-radius:50%;filter:blur(20px);pointer-events:none}
.sb-ai-br{font-size:22px;margin-bottom:4px;position:relative;z-index:1}
.sb-ai-t{font-size:13px;font-weight:700;color:#fff;position:relative;z-index:1}
.sb-ai-s{font-size:11px;color:rgba(255,255,255,.6);margin:2px 0 11px;position:relative;z-index:1;line-height:1.4}
.sb-ai-b{width:100%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:7px;color:#fff;font-size:11.5px;font-weight:600;padding:7px 12px;display:flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;position:relative;z-index:1;transition:background var(--tr)}
.sb-ai-b:hover{background:rgba(255,255,255,.25)}
.sb-ft{padding-top:4px;border-top:1px solid var(--bd)}

/* ── PAGE ── */
.pa{overflow-y:auto;overflow-x:hidden;background:var(--bg0);height:100%;width:100%}
.pg{padding:17px;display:flex;flex-direction:column;gap:14px;max-width:1600px}

/* ── PG HEADER ── */
.pgh{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.pgt{font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--t1)}
.pgs{font-size:12px;color:var(--t2);margin-top:2px}
.pga{display:flex;gap:7px;align-items:center}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-weight:600;cursor:pointer;transition:all var(--tr);white-space:nowrap}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-p{background:var(--brand);color:#fff;box-shadow:var(--shb)}
.btn-p:hover{box-shadow:0 4px 22px rgba(139,92,246,.55);transform:translateY(-1px)}
.btn-g{background:var(--card);border:1px solid var(--bd);color:var(--t2)}
.btn-g:hover{border-color:var(--bdh);color:var(--t1)}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px}
.btn-md{padding:7px 14px;font-size:12px}
.btn-lg{padding:9px 18px;font-size:13px}
.btn-fl{width:100%;justify-content:center}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(10px);transition:border-color var(--tr),box-shadow var(--tr);min-width:0}
.card:hover{border-color:var(--bdh);box-shadow:var(--sh)}
.cp{padding:15px}

/* ── STAT CARDS ── */
.sr{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-width:0}.sr-4{grid-template-columns:repeat(4,1fr)}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 13px;cursor:pointer;transition:all var(--trm);position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity var(--tr);border-radius:var(--r) var(--r) 0 0}
.sc:hover{border-color:var(--bd-act);box-shadow:var(--shg)}
.sc:hover::after{opacity:1}
.sc-pu::after{background:var(--acc)}
.sc-bl::after{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
.sc-gr::after{background:var(--ok-g)}
.sc-rd::after{background:var(--err-g)}
.sc-or::after{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.sc-cy::after{background:linear-gradient(90deg,#06b6d4,#3b82f6)}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.sc-lbl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.sc-ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ic-pu{background:rgba(139,92,246,.14);color:var(--pu4)}
.ic-bl{background:rgba(59,130,246,.14);color:var(--bl4)}
.ic-gr{background:rgba(16,185,129,.14);color:var(--gr4)}
.ic-rd{background:rgba(239,68,68,.14);color:var(--re4)}
.ic-or{background:rgba(245,158,11,.14);color:var(--ye4)}
.ic-cy{background:rgba(6,182,212,.14);color:var(--cy4)}
.sc-val{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px;line-height:1.1}
.sc-sub{font-size:10px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--err)}.neu{color:var(--t2)}

/* ── CHARTS GRID ── */
.cg{display:grid;grid-template-columns:1fr 284px 234px;gap:12px;min-width:0}

/* Perf card */
.perf-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px}
.perf-tt{font-size:13px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:7px}
.perf-ct{display:flex;gap:6px}
.sel{background:var(--inp);border:1px solid var(--bd);border-radius:6px;padding:4px 7px;color:var(--t2);font-size:11px;outline:none;cursor:pointer}
.sel:focus{border-color:var(--pu5)}
.leg{display:flex;gap:12px;margin-bottom:7px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.leg-l{width:20px;height:2px;border-radius:1px;flex-shrink:0}
.leg-d{border-top:2px dashed rgba(255,255,255,.2);background:none!important}
.pm-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--bd)}
.pm-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.pm-v{font-size:14px;font-weight:700}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-n{color:var(--t1)}

/* AI card */
.ai-card{background:var(--ai-bg);border:1px solid var(--bd-pu);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;background:radial-gradient(circle,rgba(139,92,246,.16) 0%,transparent 70%);pointer-events:none}
.ai-hd{display:flex;align-items:center;justify-content:space-between}
.ai-hl{font-size:11px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:5px}
.ai-bq{background:var(--acc);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.ai-sig{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--ok)}
.ai-cr{font-size:12.5px;color:var(--t2);font-weight:500}
.ai-cr span{color:var(--pu4);font-weight:700}
.conf-b{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:2px}
.conf-f{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--pu5),#3b82f6);transition:width 1s ease}
.ai-desc{font-size:11.5px;color:var(--t2);line-height:1.55}
.ai-fl{font-size:11px;font-weight:600;color:var(--t1);margin-bottom:1px}
.ai-fac{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);margin-bottom:1px}
.ai-ck{color:var(--ok);font-size:10px;flex-shrink:0}
.ai-acts{display:flex;gap:7px;margin-top:2px}

/* Regime card */
.reg-card{padding:14px;display:flex;flex-direction:column}
.reg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.reg-hdt{font-size:13px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:7px}
.reg-dw{display:flex;justify-content:center;position:relative}
.reg-ctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.reg-cn{font-size:13px;font-weight:700;color:var(--t1)}
.reg-cp{font-size:11px;color:var(--t2)}
.reg-leg{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.reg-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.reg-lft{color:var(--t2);display:flex;align-items:center;gap:7px}
.reg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.reg-pv{font-weight:600;color:var(--t1)}

/* ── MID GRID ── */
.mg{display:grid;grid-template-columns:1fr 1fr 238px;gap:12px;min-width:0}

/* Optimize */
.opt-tt{font-size:13px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:7px}
.opt-st{font-size:11px;color:var(--t3);margin-top:2px;margin-bottom:10px}
.opt-ctrl{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:11px}
.fg{display:flex;flex-direction:column;gap:3px}
.fl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.fs{background:var(--inp);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--t1);font-size:11.5px;outline:none;width:100%;cursor:pointer;transition:border-color var(--tr)}
.fs:focus{border-color:var(--pu5)}
.fi{background:var(--inp);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--t1);font-size:12px;outline:none;width:100%;transition:border-color var(--tr)}
.fi:focus{border-color:var(--pu5)}
.opt-body{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:2px}
.opt-pg-grid{display:grid;grid-template-columns:300px 1fr;gap:13px}
.pr-lbl{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:7px}
.sl-row{margin-bottom:7px}
.sl-hd{display:flex;justify-content:space-between;margin-bottom:3px}
.sl-l{font-size:11px;color:var(--t2)}
.sl-v{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.sl-m{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.slider{width:100%;height:4px;-webkit-appearance:none;background:rgba(139,92,246,.2);border-radius:2px;outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--pu5);border:2px solid var(--bg0);box-shadow:0 0 6px rgba(139,92,246,.5)}
.surf-tt{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:7px}
.surf-c{background:linear-gradient(135deg,#130a3e,#0d1a50);border-radius:8px;padding:8px;flex:1;min-height:145px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.surf-tip{position:absolute;top:8px;right:8px;background:rgba(8,4,36,.92);border:1px solid var(--bd-pu);border-radius:6px;padding:4px 7px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.surf-ax{position:absolute;font-size:8px;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace}
.surf-axb{bottom:5px;left:50%;transform:translateX(-50%)}
.surf-axl{left:4px;top:50%;transform:translateY(-50%) rotate(-90deg)}
.bp-lbl{font-size:11px;font-weight:700;color:var(--t1);margin:7px 0 5px}
.bp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bp-box{text-align:center;background:var(--bg1);border:1px solid var(--bd);border-radius:6px;padding:5px 3px}
.bp-k{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:1px;line-height:1.3}
.bp-v{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--t1)}

/* Portfolio widget */
.pw-m{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:12px}
.mw-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.mw-v{font-size:18px;font-weight:800;letter-spacing:-.3px}
.mw-c{font-size:10.5px;font-weight:500;display:flex;align-items:center;gap:3px;margin-top:1px}
.pw-b{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.al-t{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:8px}
.al-dn{display:flex;align-items:center;gap:11px}
.al-lg{display:flex;flex-direction:column;gap:3px;flex:1}
.al-r{display:flex;align-items:center;gap:6px;font-size:11px}
.al-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.al-n{color:var(--t2);flex:1}
.al-p{font-weight:600;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:10.5px}
.hl-t{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.tbl th{text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:3px 5px;border-bottom:1px solid var(--bd)}
.tbl td{padding:5px 5px;border-bottom:1px solid var(--bd);color:var(--t2)}
.tbl td:first-child{color:var(--t1);font-weight:600}
.tbl tbody tr:last-child td{border-bottom:none}

/* ══════════ APP ══════════ */
const App=()=>{
  const[page,setPage]=useState('dashboard');
  const[dark,setDark]=useState(true);
  const go=useCallback(p=>setPage(p),[]);
  const toggle=()=>setDark(d=>!d);
  useEffect(()=>{document.body.classList.toggle('lm',!dark);document.querySelector('.shell').classList.toggle('lm',!dark)},[dark]);
  const render=()=>{
    switch(page){
      case 'dashboard': return R.createElement(Dashboard,{go});
      case 'strategies': return R.createElement(StrategiesPage,{go});
      case 'backtest': return R.createElement(BacktestPage,null);
      case 'optimize': return R.createElement(OptimizePage,null);
      case 'ai': return R.createElement(AIPage,null);
      case 'portfolio': return R.createElement(PortfolioPage,null);
      case 'reports': return R.createElement(ReportsPage,null);
      case 'regime': return R.createElement(RegimePage,null);
      case 'settings': return R.createElement(SettingsPage,{dark,toggle});
      case 'help': return R.createElement(HelpPage,null);
      default: return R.createElement(Dashboard,{go});
    }
  };
  return R.createElement('div',{className:cx('shell',!dark&&'lm')},
    R.createElement(Header,{dark,toggle,go}),
    R.createElement(Sidebar,{page,go,logout:()=>toast.info('Signing out','See you next session.')}),
    R.createElement('div',{className:'pa',key:page},render()),
    R.createElement(MobNav,{page,go}),
    R.createElement(ToastHost,null)
  )
};
ReactDOM.render(R.createElement(App,null),document.getElementById('root'));
