<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quantoryx v7 — AI-Powered Trading Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-base:     #080a14;
  --bg-elevated: #0d0f20;
  --bg-card:     rgba(255,255,255,0.038);
  --bg-card-h:   rgba(255,255,255,0.068);
  --bg-sidebar:  #090b1a;
  --bg-glass:    rgba(8,10,20,0.92);
  --bg-input:    rgba(255,255,255,0.05);
  --bg-ai:       linear-gradient(145deg,#0c0928 0%,#100838 50%,#090d2a 100%);
  --grad-brand:  linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#2563eb 100%);
  --grad-accent: linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);
  --grad-ok:     linear-gradient(135deg,#059669 0%,#10b981 100%);
  --grad-err:    linear-gradient(135deg,#dc2626 0%,#ef4444 100%);
  --grad-warn:   linear-gradient(135deg,#d97706 0%,#f59e0b 100%);
  --tx-1:  #eef0ff;
  --tx-2:  #8b8fa8;
  --tx-3:  #4e5270;
  --tx-ok: #10b981;
  --tx-err:#f87171;
  --tx-wrn:#fbbf24;
  --tx-acc:#a78bfa;
  --bd:    rgba(255,255,255,0.068);
  --bd-h:  rgba(255,255,255,0.13);
  --bd-pu: rgba(139,92,246,0.28);
  --bd-act:rgba(139,92,246,0.48);
  --pu-300:#c4b5fd;
  --pu-400:#a78bfa;
  --pu-500:#8b5cf6;
  --pu-600:#7c3aed;
  --bl-400:#60a5fa;
  --bl-500:#3b82f6;
  --gr-400:#34d399;
  --gr-500:#10b981;
  --re-400:#f87171;
  --re-500:#ef4444;
  --ye-400:#fbbf24;
  --cy-400:#67e8f9;
  --sh-card: 0 4px 24px rgba(0,0,0,.35);
  --sh-glow: 0 0 32px rgba(139,92,246,.16);
  --sh-elev: 0 8px 40px rgba(0,0,0,.5);
  --sh-btn:  0 2px 14px rgba(139,92,246,.36);
  --sb-w: 188px;
  --hd-h: 52px;
  --r:    12px;
  --r-sm: 8px;
  --r-lg: 16px;
  --t:    0.14s ease;
  --t-md: 0.24s ease;
}
.lm {
  --bg-base:    #f0f2f9;
  --bg-elevated:#ffffff;
  --bg-card:    rgba(255,255,255,0.9);
  --bg-card-h:  #ffffff;
  --bg-sidebar: #ffffff;
  --bg-glass:   rgba(255,255,255,0.94);
  --bg-input:   rgba(0,0,0,0.04);
  --bg-ai:      linear-gradient(145deg,#f5f3ff 0%,#ede8ff 100%);
  --tx-1: #0d0f24; --tx-2: #4b5563; --tx-3: #9ca3af;
  --tx-acc:#7c3aed; --tx-ok:#059669; --tx-err:#dc2626; --tx-wrn:#d97706;
  --bd: rgba(0,0,0,0.085); --bd-h: rgba(0,0,0,0.14);
  --bd-pu:rgba(139,92,246,0.22); --bd-act:rgba(139,92,246,0.36);
  --sh-card:0 2px 16px rgba(0,0,0,0.08);
  --sh-glow:0 0 24px rgba(139,92,246,0.1);
  --sh-elev:0 8px 32px rgba(0,0,0,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
body{background:var(--bg-base);color:var(--tx-1);transition:background .3s,color .3s;}
input,button,select,textarea{font-family:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.25);border-radius:2px;}
::selection{background:rgba(139,92,246,.2);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
select option{background:var(--bg-elevated);color:var(--tx-1);}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:var(--sb-w) 1fr;grid-template-rows:var(--hd-h) 1fr;height:100vh;overflow:hidden;}

/* ── Header ── */
.hd{
  grid-column:1/-1;background:var(--bg-glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 18px;gap:12px;position:relative;z-index:100;
}
.hd-logo{display:flex;align-items:center;gap:9px;width:var(--sb-w);flex-shrink:0;padding-left:2px;cursor:pointer;}
.hd-logo-icon{
  width:30px;height:30px;background:var(--grad-brand);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#fff;flex-shrink:0;
  box-shadow:0 2px 10px rgba(124,58,237,.4);
}
.hd-logo-name{font-size:13px;font-weight:800;color:var(--tx-1);letter-spacing:.5px;}
.hd-logo-tag{font-size:9px;color:var(--tx-3);margin-top:1px;}
.hd-search{
  display:flex;align-items:center;gap:8px;flex:1;max-width:400px;
  background:var(--bg-input);border:1px solid var(--bd);border-radius:var(--r-sm);
  padding:0 11px;height:34px;cursor:text;text-align:left;border:none;
  transition:border-color var(--t);
}
.hd-search{border:1px solid var(--bd);}
.hd-search:hover{border-color:var(--bd-h);}
.hd-search-q{font-size:13px;color:var(--tx-3);flex:1;}
.hd-kbd{
  background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:4px;
  padding:1px 5px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--tx-3);
}
.hd-gap{flex:1;}
.hd-mkt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--tx-2);white-space:nowrap;}
.hd-dot{width:7px;height:7px;border-radius:50%;background:var(--gr-500);box-shadow:0 0 6px var(--gr-500);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hd-actions{display:flex;align-items:center;gap:2px;}
.hd-btn{
  width:32px;height:32px;border-radius:var(--r-sm);border:none;
  background:transparent;color:var(--tx-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;transition:all var(--t);
}
.hd-btn:hover{background:var(--bg-card);color:var(--tx-1);}
.hd-notif{position:relative;}
.hd-notif-badge{
  position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;
  background:var(--re-500);border-radius:7px;font-size:8px;font-weight:700;
  color:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg-base);padding:0 2px;
}
.hd-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:12px;
  border:2px solid var(--bd-act);cursor:pointer;overflow:hidden;
  transition:box-shadow var(--t);
}
.hd-avatar:hover{box-shadow:0 0 0 3px rgba(139,92,246,.22);}

/* ── Sidebar ── */
.sb{
  background:var(--bg-sidebar);border-right:1px solid var(--bd);
  overflow-y:auto;display:flex;flex-direction:column;padding:8px 7px;gap:1px;
}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:7.5px 10px;
  border-radius:var(--r-sm);color:var(--tx-2);font-size:13px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
  transition:all var(--t);position:relative;cursor:pointer;
}
.sb-item:hover{background:var(--bg-card);color:var(--tx-1);}
.sb-item.on{background:rgba(139,92,246,.13);color:var(--pu-400);}
.sb-item.on::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:18px;background:var(--grad-accent);border-radius:0 2px 2px 0;
}
.sb-ico{font-size:14px;width:16px;text-align:center;flex-shrink:0;}
.sb-lbl{flex:1;}
.sb-badge{background:var(--grad-accent);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--gr-500);box-shadow:0 0 5px var(--gr-500);}
.sb-spacer{flex:1;min-height:10px;}
.sb-ai{
  margin:8px 3px 4px;padding:14px;
  background:linear-gradient(145deg,#180a45 0%,#231060 60%,#16145a 100%);
  border-radius:var(--r);position:relative;overflow:hidden;
  border:1px solid rgba(139,92,246,.3);
}
.sb-ai::after{
  content:'';position:absolute;top:-20px;right:-20px;
  width:80px;height:80px;background:rgba(139,92,246,.18);
  border-radius:50%;filter:blur(20px);pointer-events:none;
}
.sb-ai-brain{font-size:22px;margin-bottom:4px;position:relative;z-index:1;}
.sb-ai-title{font-size:13px;font-weight:700;color:#fff;position:relative;z-index:1;}
.sb-ai-sub{font-size:11px;color:rgba(255,255,255,.6);margin:2px 0 11px;position:relative;z-index:1;line-height:1.4;}
.sb-ai-btn{
  width:100%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);
  border-radius:7px;color:#fff;font-size:11.5px;font-weight:600;padding:7px 12px;
  transition:background var(--t);position:relative;z-index:1;
  display:flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;
}
.sb-ai-btn:hover{background:rgba(255,255,255,.26);}
.sb-footer{padding-top:4px;border-top:1px solid var(--bd);}

/* ── Page ── */
.page-area{overflow-y:auto;background:var(--bg-base);height:100%;}
.page{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:100%;}

/* ── Page header ── */
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.pg-title{font-size:19px;font-weight:800;color:var(--tx-1);letter-spacing:-.3px;}
.pg-sub{font-size:12px;color:var(--tx-2);margin-top:2px;}
.pg-acts{display:flex;gap:7px;align-items:center;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-weight:600;transition:all var(--t);white-space:nowrap;cursor:pointer;}
.btn:disabled{opacity:.5;pointer-events:none;}
.btn-p{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-btn);}
.btn-p:hover{box-shadow:0 4px 20px rgba(139,92,246,.52);transform:translateY(-1px);}
.btn-g{background:var(--bg-card);border:1px solid var(--bd);color:var(--tx-2);}
.btn-g:hover{border-color:var(--bd-h);color:var(--tx-1);}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px;}
.btn-md{padding:7px 14px;font-size:12px;}
.btn-lg{padding:9px 18px;font-size:13px;}
.btn-full{width:100%;justify-content:center;}

/* ── Cards ── */
.card{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  backdrop-filter:blur(12px);transition:border-color var(--t),box-shadow var(--t);
}
.card:hover{border-color:var(--bd-h);box-shadow:var(--sh-card);}
.cp{padding:16px;}

/* ── Stat Cards ── */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;}
.stat{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;transition:all var(--t-md);position:relative;overflow:hidden;
}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  opacity:0;transition:opacity var(--t);border-radius:var(--r) var(--r) 0 0;
}
.stat:hover{border-color:var(--bd-act);box-shadow:var(--sh-glow);}
.stat:hover::after{opacity:1;}
.s-pu::after{background:var(--grad-accent);}
.s-bl::after{background:linear-gradient(90deg,var(--bl-500),#06b6d4);}
.s-gr::after{background:var(--grad-ok);}
.s-rd::after{background:var(--grad-err);}
.s-or::after{background:var(--grad-warn);}
.s-cy::after{background:linear-gradient(90deg,#06b6d4,var(--bl-500));}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.stat-lbl{font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.5px;}
.stat-ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.ico-pu{background:rgba(139,92,246,.14);color:var(--pu-400);}
.ico-bl{background:rgba(59,130,246,.14);color:var(--bl-400);}
.ico-gr{background:rgba(16,185,129,.14);color:var(--gr-400);}
.ico-rd{background:rgba(239,68,68,.14);color:var(--re-400);}
.ico-or{background:rgba(245,158,11,.14);color:var(--ye-400);}
.ico-cy{background:rgba(6,182,212,.14);color:var(--cy-400);}
.stat-val{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px;line-height:1.1;}
.stat-chg{font-size:10.5px;font-weight:500;display:flex;align-items:center;gap:3px;margin-bottom:4px;}
.up{color:var(--tx-ok);}  .down{color:var(--tx-err);}  .neu{color:var(--tx-2);}

/* ── Charts grid (3 cols) ── */
.charts-grid{display:grid;grid-template-columns:1fr 288px 238px;gap:12px;}

/* Perf card */
.perf-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.perf-title{font-size:13px;font-weight:700;color:var(--tx-1);display:flex;align-items:center;gap:7px;}
.perf-controls{display:flex;align-items:center;gap:7px;}
.sel-sm{background:var(--bg-input);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;color:var(--tx-2);font-size:11px;outline:none;cursor:pointer;}
.sel-sm:focus{border-color:var(--pu-500);}
.leg{display:flex;gap:12px;margin-bottom:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx-2);}
.leg-line{width:20px;height:2px;border-radius:1px;flex-shrink:0;}
.leg-dash{border-top:2px dashed rgba(255,255,255,.2);background:none!important;}
.perf-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--bd);}
.pm-lbl{font-size:10px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.pm-val{font-size:14px;font-weight:700;}
.pm-ok{color:var(--tx-ok);} .pm-err{color:var(--tx-err);} .pm-neu{color:var(--tx-1);}

/* AI insight card */
.ai-card{
  background:var(--bg-ai);border:1px solid var(--bd-pu);border-radius:var(--r);
  padding:15px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
}
.ai-card::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:130px;height:130px;
  background:radial-gradient(circle,rgba(139,92,246,.16) 0%,transparent 70%);
  pointer-events:none;
}
.ai-hd{display:flex;align-items:center;justify-content:space-between;}
.ai-hd-lbl{font-size:11px;font-weight:600;color:var(--tx-2);display:flex;align-items:center;gap:5px;}
.ai-badge-q{background:var(--grad-accent);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.ai-signal{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.sig-bull{color:var(--gr-500);}
.ai-conf-row{font-size:12.5px;font-weight:500;color:var(--tx-2);}
.ai-conf-row span{color:var(--pu-400);font-weight:700;}
.conf-bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:2px;}
.conf-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--pu-500),var(--bl-500));transition:width 1s ease;}
.ai-desc{font-size:11.5px;color:var(--tx-2);line-height:1.55;}
.ai-factors-lbl{font-size:11px;font-weight:600;color:var(--tx-1);}
.ai-fac{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-2);margin-bottom:2px;}
.fac-ck{color:var(--tx-ok);font-size:10px;}
.ai-acts{display:flex;gap:7px;margin-top:2px;}

/* Market Regime card */
.regime-card{padding:15px;display:flex;flex-direction:column;}
.regime-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.regime-donut-wrap{display:flex;justify-content:center;position:relative;}
.regime-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.reg-name{font-size:13px;font-weight:700;color:var(--tx-1);}
.reg-pct-txt{font-size:11px;color:var(--tx-2);}
.reg-legend{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.reg-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:1px 0;}
.reg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.reg-lbl-txt{color:var(--tx-2);display:flex;align-items:center;gap:7px;}
.reg-pct-val{font-weight:600;color:var(--tx-1);}

/* ── Mid Grid (3 cols) ── */
.mid-grid{display:grid;grid-template-columns:1fr 1fr 240px;gap:12px;}

/* Optimize */
.opt-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;}
.opt-title{font-size:13px;font-weight:700;color:var(--tx-1);display:flex;align-items:center;gap:7px;}
.opt-sub{font-size:11px;color:var(--tx-3);margin-top:2px;}
.opt-controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:end;margin-top:10px;}
.form-grp{display:flex;flex-direction:column;gap:3px;}
.form-lbl{font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;}
.form-sel{
  background:var(--bg-input);border:1px solid var(--bd);border-radius:6px;
  padding:6px 8px;color:var(--tx-1);font-size:11.5px;outline:none;width:100%;
  transition:border-color var(--t);cursor:pointer;
}
.form-sel:focus{border-color:var(--pu-500);}
.form-inp{
  background:var(--bg-input);border:1px solid var(--bd);border-radius:6px;
  padding:7px 10px;color:var(--tx-1);font-size:12px;outline:none;width:100%;
  transition:border-color var(--t);
}
.form-inp:focus{border-color:var(--pu-500);}
.opt-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;}
.param-ranges-lbl{font-size:11px;font-weight:700;color:var(--tx-1);margin-bottom:7px;}
.sl-row{margin-bottom:8px;}
.sl-hd{display:flex;justify-content:space-between;margin-bottom:3px;}
.sl-lbl{font-size:11px;color:var(--tx-2);}
.sl-val{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--tx-1);}
.sl-max{font-size:9px;color:var(--tx-3);font-family:'JetBrains Mono',monospace;}
.slider{
  width:100%;height:4px;-webkit-appearance:none;appearance:none;
  background:rgba(139,92,246,.2);border-radius:2px;outline:none;cursor:pointer;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--pu-500);cursor:pointer;
  border:2px solid var(--bg-base);box-shadow:0 0 6px rgba(139,92,246,.5);
}
.surf-wrap{display:flex;flex-direction:column;}
.surf-title{font-size:11px;font-weight:700;color:var(--tx-1);margin-bottom:7px;}
.surf-canvas{
  background:linear-gradient(135deg,#130a3e 0%,#0d1a50 100%);
  border-radius:8px;padding:8px;flex:1;min-height:145px;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.surf-axis-x{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;}
.surf-axis-y{position:absolute;left:4px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:8px;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;}
.surf-tooltip{
  position:absolute;top:8px;right:8px;
  background:rgba(8,4,36,.92);border:1px solid var(--bd-pu);border-radius:6px;
  padding:5px 8px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--tx-1);
}
.best-params{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px;}

<script type="text/javascript">
const {useState,useEffect,useCallback,useRef} = React;

/* ── Pure SVG Chart System (no Recharts) ── */
const useSize = (ref) => {

// Shared SVG chart helpers
const getMinMax = (data, keys) => {
  let min = Infinity, max = -Infinity;

const AreaChart = ({data=[], children, margin={top:4,right:8,bottom:20,left:36}, _w=600, _h=220}) => {

  const childArr = React.Children.toArray(children);
  const areas = childArr.filter(c=>c.type===Area);
  const xAxisC = childArr.find(c=>c.type===XAxis);
  const yAxisC = childArr.find(c=>c.type===YAxis);
  const gridC = childArr.find(c=>c.type===CartesianGrid);
  const keys = areas.map(a=>a.props.dataKey);
  const {min, max} = getMinMax(data, keys);
  const range = max - min || 1;
  const xScale = (i) => (i / (data.length-1)) * cw;
  const yScale = (v) => ch - ((v-min)/range)*ch;
  const xLabels = xAxisC ? [...new Set(data.map(d=>d[xAxisC.props.dataKey||'w']))] : [];
  const yTicks = yAxisC?.props?.hide ? [] : [0,0.25,0.5,0.75,1].map(t=>min+t*range);
  return React.createElement('svg', {width:W, height:H, style:{overflow:'visible'}},
    React.createElement('defs', null,
      areas.map(a => {
        const id = 'grad_'+a.props.dataKey;

        return React.createElement('linearGradient',{key:id,id,x1:'0',y1:'0',x2:'0',y2:'1'},

        React.createElement('line',{key:t,x1:0,y1:ch*t,x2:cw,y2:ch*t,stroke:'rgba(255,255,255,.04)',strokeWidth:1})
      ),

        React.createElement('text',{key:i,x:-4,y:yScale(v)+4,textAnchor:'end',fill:'var(--tx-3)',fontSize:10},
          yAxisC.props.tickFormatter ? yAxisC.props.tickFormatter(v) : Math.round(v)

        const idx = data.findIndex(d=>d[xAxisC.props.dataKey||'w']===lbl);
        return React.createElement('text',{key:lbl,x:xScale(idx),y:ch+14,textAnchor:'middle',fill:'var(--tx-3)',fontSize:10},lbl);
      }),

        const key = a.props.dataKey;
        const color = a.props.stroke||'#8b5cf6';
        const pts = data.map((d,i)=>`${xScale(i)},${yScale(d[key]||0)}`).join(' ');

const Area = (props) => null;
const XAxis = (props) => null;
const YAxis = (props) => null;
const CartesianGrid = (props) => null;
const Tooltip = (props) => null;
const ReferenceLine = (props) => null;

const Line = Area;

const BarChart = ({data=[], children, margin={top:4,right:8,bottom:20,left:36}, _w=600, _h=220}) => {
  const W = _w, H = _h;
  const ml=margin.left||36, mr=margin.right||8, mt=margin.top||4, mb=margin.bottom||20;

  const stackIds = [...new Set(bars.map(b=>b.props.stackId).filter(Boolean))];

    const stacks = {};

const SparkLine=({data=[],color='#8b5cf6',height=36})=>{
  if(data.length<2)return React.createElement('div',{style:{height}});
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const W=100,H=height;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*W},${H-((v-min)/range)*(H-2)+1}`).join(' ');
  const id=`sg${color.replace(/[^a-z0-9]/gi,'')}`;
  return React.createElement('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none',style:{display:'block'}},
    React.createElement('defs',null,
      React.createElement('linearGradient',{id,x1:'0',y1:'0',x2:'0',y2:'1'},

        React.createElement('stop',{offset:'100%',stopColor:color,stopOpacity:0})
      )

};

/* ── Donut ── */
const Donut=({data,size=120,iR=38,oR=56})=>{
  const total=data.reduce((s,d)=>s+d.value,0);
  let angle=-90;
  const paths=data.map(d=>{
    const pct=d.value/total;
    const a1=angle*Math.PI/180;
    const a2=(angle+pct*360-0.5)*Math.PI/180;
    const cx=size/2,cy=size/2;
    const x1=cx+oR*Math.cos(a1),y1=cy+oR*Math.sin(a1);
    const x2=cx+oR*Math.cos(a2),y2=cy+oR*Math.sin(a2);
    const x3=cx+iR*Math.cos(a2),y3=cy+iR*Math.sin(a2);
    const x4=cx+iR*Math.cos(a1),y4=cy+iR*Math.sin(a1);
    const lg=pct>0.5?1:0;
    const path=`M${x1} ${y1} A${oR} ${oR} 0 ${lg} 1 ${x2} ${y2} L${x3} ${y3} A${iR} ${iR} 0 ${lg} 0 ${x4} ${y4} Z`;
    angle+=pct*360;
    return{path,color:d.color};
  });
  return React.createElement('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`},
    paths.map((p,i)=>React.createElement('path',{key:i,d:p.path,fill:p.color,stroke:'rgba(0,0,0,.35)',strokeWidth:.5}))
  );
};

/* ── Surface Chart ── */
const SurfaceChart=()=>{
  const rows=12,cols=12;
  const quads=[];
  for(let r=0;r<rows-1;r++){
    for(let c=0;c<cols-1;c++){
      const pts=(ri,ci)=>{
        const x=(ci/(cols-1))*84+8;
        const z=ri/(rows-1);
        const cx2=ci/(cols-1);
        const peak=1-Math.pow(cx2-0.5,2)*4-Math.pow(z-0.4,2)*3;
        const y=62-peak*48+z*12;
        return{x,y,shade:Math.max(0,Math.min(1,peak))};
      };
      const a=pts(r,c),b=pts(r,c+1),cc=pts(r+1,c),d=pts(r+1,c+1);
      const sh=(a.shade+b.shade+cc.shade+d.shade)/4;
      const hue=Math.round(sh*300);
      const light=30+sh*35;
      quads.push({
        path:`M${a.x} ${a.y} L${b.x} ${b.y} L${d.x} ${d.y} L${cc.x} ${cc.y} Z`,
        color:`hsl(${hue},90%,${light}%)`,z:sh
      });
    }
  }
  quads.sort((a,b)=>a.z-b.z);
  return React.createElement('svg',{width:'100%',height:'100%',viewBox:'0 0 100 80',preserveAspectRatio:'xMidYMid meet'},
    quads.map((q,i)=>React.createElement('path',{key:i,d:q.path,fill:q.color,stroke:'rgba(0,0,0,.3)',strokeWidth:.15}))
  );
};

  const toggleTheme=()=>setDark(d=>!d);

  const renderPage=()=>{

      case 'strategies': return React.createElement(StrategiesPage,{go});
      case 'backtest': return React.createElement(BacktestPage,{go});
      case 'optimize': return React.createElement(OptimizePage,null);
      case 'ai': return React.createElement(AIPage,null);
      case 'portfolio': return React.createElement(PortfolioPage,{go});
      case 'reports': return React.createElement(ReportsPage,null);
      case 'regime': return React.createElement(RegimePage,null);
      case 'settings': return React.createElement(SettingsPage,{dark,toggleTheme});

  return React.createElement('div',{className:cx('shell',!dark&&'lm')},
    React.createElement(Header,{dark,toggleTheme,go}),
    React.createElement(Sidebar,{page,go,onLogout:()=>toast.info('Signing out','See you next session.')}),

};
