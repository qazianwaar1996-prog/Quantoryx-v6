# ══════════════════════════════════════════════
#  QUANTORYX v6 — production nginx
#  Serves the SPA and reverse-proxies /api (HTTP + WebSocket)
#  to the FastAPI backend, so the app runs same-origin
#  (no CORS, no absolute URLs, cookies/headers preserved).
# ══════════════════════════════════════════════

upstream quantoryx_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # Redirect everything to TLS in production:
    # return 301 https://$host$request_uri;

    root /var/www/quantoryx;
    index Quantoryx-v6-Production.html;

    # ── Security headers ──
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # HSTS — enable once TLS is terminated here:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: the app loads React/Recharts/PropTypes from cdnjs and fonts from Google.
    # 'unsafe-inline' is required for the inline bundle + styled attributes.
    # Tighten by self-hosting the vendor bundles and dropping the CDN sources.
    add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; \
connect-src 'self' ws: wss:; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── SPA shell: never cache, so deploys take effect immediately ──
    location = / {
        try_files /Quantoryx-v6-Production.html =404;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* \.(png|jpg|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── REST API ──
    location /api/ {
        proxy_pass         http://quantoryx_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 180s;   # backtests and AI analysis are slow
        proxy_send_timeout 180s;
    }

    # ── WebSocket channel ──
    location /api/ws/ {
        proxy_pass         http://quantoryx_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # long-lived; client pings every 25 s
        proxy_send_timeout 3600s;
    }

    location / { try_files $uri /Quantoryx-v6-Production.html; }
}
