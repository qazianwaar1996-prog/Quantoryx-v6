  ]);
  const [sel,setSel]=useState(null);
  const [dragOver,setDragOver]=useState(false);
  const [tab,setTab]=useState('canvas');
  const [meta,setMeta]=useState({name:'Untitled Strategy',symbol:'EUR/USD',tf:'H1'});
  const [saveModal,setSaveModal]=useState(false);
  const [saving,setSaving]=useState(false);

  const addNode=b=>{
    setNodes(p=>[...p,{...b,uid:uid()}]);
    toast.info('Block added',`${b.name} appended to the strategy.`);
  };
  const removeNode=u=>{
    setNodes(p=>p.filter(n=>n.uid!==u));
    if(sel===u) setSel(null);
  };

  const onDrop=e=>{
    e.preventDefault(); setDragOver(false);
    try{
      const b=JSON.parse(e.dataTransfer.getData('application/json'));
      addNode(b);
    }catch{}
  };

  const code=useMemo(()=>{
    const ind=nodes.filter(n=>n.cat==='Indicators');
    const con=nodes.filter(n=>n.cat==='Conditions');
    const act=nodes.filter(n=>n.cat==='Actions');
    const rsk=nodes.filter(n=>n.cat==='Risk');
    return [
      `# ${meta.name}`,
      `# ${meta.symbol} · ${meta.tf} · generated by Quantoryx Builder`,
      ``,
      `class Strategy:`,
      `    symbol    = "${meta.symbol}"`,
      `    timeframe = "${meta.tf}"`,
      ``,
      `    def indicators(self, data):`,
      ...(ind.length?ind.map(n=>`        self.${n.id} = ta.${n.id.toUpperCase()}(data, ${n.params.replace(/[a-z ]+:\s*/i,'')})`):['        pass']),
      ``,
      `    def entry(self, ctx):`,
      ...(con.length?con.map(n=>`        if ctx.${n.id}(${JSON.stringify(n.params)}):`):['        if True:']),
      ...(act.length?act.map(n=>`            ctx.${n.id}(size=self.position_size)`):['            pass']),
      ``,
      `    def risk(self, ctx):`,
      ...(rsk.length?rsk.map(n=>`        ctx.set_${n.id}(${JSON.stringify(n.params)})`):['        pass']),
    ].join('\n');
  },[nodes,meta]);

  const save=async()=>{
    setSaving(true);
    await api.builder.save({...meta,nodes});
    setSaving(false); setSaveModal(false);
    toast.success('Strategy saved',`“${meta.name}” added to your library.`);
  };

  const highlightCode=line=>{
    if(line.trim().startsWith('#')) return <span className="code-cm">{line}</span>;
    const parts=line.split(/("(?:[^"\\]|\\.)*")/g);
    return parts.map((p,i)=>{
      if(p.startsWith('"')) return <span key={i} className="code-str">{p}</span>;
      return <span key={i}>{p.split(/\b(class|def|if|self|return|pass|True)\b/g).map((t,j)=>
        ['class','def','if','self','return','pass','True'].includes(t)
          ?<span key={j} className="code-kw">{t}</span>
          :<span key={j}>{t.split(/(\b\d+\.?\d*\b)/g).map((n,k)=>/^\d/.test(n)?<span key={k} className="code-num">{n}</span>:<span key={k}>{n}</span>)}</span>
      )}</span>;
    });
  };

  const selNode=nodes.find(n=>n.uid===sel);

  return(
    <div className="page fade-page">
      <PageHd title="Strategy Builder" sub="Compose indicators, conditions, and risk rules — no code required">
        <div className="tabs">
          {['canvas','code'].map(t=>(
            <button key={t} className={cx('tab',tab===t&&'on')} onClick={()=>setTab(t)}>
              {t==='canvas'?'🧱 Canvas':'⌨ Code'}
            </button>
          ))}
        </div>
        <button className="btn btn-g btn-sm" onClick={()=>go('backtest')}>▶ Backtest</button>
        <button className="btn btn-p btn-sm" onClick={()=>setSaveModal(true)} disabled={!nodes.length}>💾 Save Strategy</button>
      </PageHd>

      <div className="sbd-grid">
        {/* ── Block library ── */}
        <div className="card card-p">
          <div className="card-hd"><div className="card-title">🧰 Blocks</div></div>
          {loading&&<SkelText lines={7}/>}
          {!loading&&(
            <div className="blk-lib">
              {blocks.map(g=>(
                <React.Fragment key={g.cat}>
                  <div className="blk-cat">{g.cat}</div>
                  {g.items.map(b=>(
                    <button key={b.id} className="blk-chip" draggable
                      onDragStart={e=>e.dataTransfer.setData('application/json',JSON.stringify({...b,cat:g.cat}))}
                      onClick={()=>addNode({...b,cat:g.cat})}>
                      <span className="blk-chip-ico">{b.icon}</span>
                      <span style={{flex:1,minWidth:0}}>
                        <span style={{display:'block',fontWeight:600,color:'var(--tx-1)',fontSize:11.5}}>{b.name}</span>
                        <span style={{display:'block',fontSize:9.5,color:'var(--tx-3)',fontFamily:'JetBrains Mono,monospace'}}>{b.params}</span>
                      </span>
                      <span style={{color:'var(--tx-3)',fontSize:12}}>+</span>
                    </button>
                  ))}
                </React.Fragment>
              ))}
            </div>
          )}
        </div>

        {/* ── Canvas / Code ── */}
        <div className="card card-p">
          <div className="card-hd">
            <div>
              <div className="card-title">{tab==='canvas'?'🧱 Strategy Flow':'⌨ Generated Code'}</div>
              <div className="card-sub">{nodes.length} block{nodes.length===1?'':'s'} · {meta.symbol} · {meta.tf}</div>
            </div>
            <div className="card-acts">
              {tab==='code'&&<CopyBtn text={code} label="Copy code"/>}
              {tab==='canvas'&&nodes.length>0&&
                <button className="btn btn-g btn-sm" onClick={()=>{ setNodes([]); setSel(null); toast.warn('Canvas cleared','All blocks removed.'); }}>Clear</button>}
            </div>
          </div>

          {tab==='canvas'?(
            <div className={cx('canvas',dragOver&&'drag')}
              onDragOver={e=>{ e.preventDefault(); setDragOver(true); }}
              onDragLeave={()=>setDragOver(false)}
              onDrop={onDrop}>
              {nodes.length===0&&(
                <Empty icon="🧱" title="Drag blocks here"
                  sub="Pick indicators, conditions, actions, and risk rules from the library on the left to compose your strategy."/>
              )}
              {nodes.map((n,i)=>(
                <React.Fragment key={n.uid}>
                  {i>0&&<div className="node-link">{n.cat==='Actions'?'THEN':n.cat==='Risk'?'WITH':'AND'}</div>}
                  <div className={cx('node',sel===n.uid&&'on')} onClick={()=>setSel(n.uid)}>
                    <span className="node-ico">{n.icon}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="node-nm">{n.name}</div>
                      <div className="node-sub">{n.params}</div>
                    </div>
                    <span className="status-pill" style={{background:'var(--bg-base)',color:'var(--tx-3)'}}>{n.cat}</span>
                    <button className="node-x" onClick={e=>{ e.stopPropagation(); removeNode(n.uid); }} aria-label="Remove block">✕</button>
                  </div>
                </React.Fragment>
              ))}
            </div>
          ):(
            <div className="code-prev">
              {code.split('\n').map((l,i)=><div key={i}>{highlightCode(l)||'\u00A0'}</div>)}
            </div>
          )}
        </div>

        {/* ── Inspector ── */}
        <div className="card card-p">
          <div className="card-hd"><div className="card-title">⚙ Inspector</div></div>

          <div className="form-grp">
            <label className="form-lbl">Strategy Name</label>
            <input className="form-inp" aria-label="Strategy name" value={meta.name} onChange={e=>setMeta(m=>({...m,name:e.target.value}))}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:10}}>
            <div className="form-grp">
              <label className="form-lbl">Symbol</label>
              <select className="form-sel" value={meta.symbol} onChange={e=>setMeta(m=>({...m,symbol:e.target.value}))}>
                {['EUR/USD','GBP/USD','USD/JPY','XAU/USD','BTC/USD','NASDAQ'].map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
            <div className="form-grp">
              <label className="form-lbl">Timeframe</label>
              <select className="form-sel" value={meta.tf} onChange={e=>setMeta(m=>({...m,tf:e.target.value}))}>
                {['M15','M30','H1','H4','D1'].map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          </div>

          <div className="dd-sep" style={{margin:'14px 0'}}/>

          {selNode?(
            <>
              <div className="section-lbl">Selected Block</div>
              <div className="row" style={{gap:9,marginBottom:12}}>
                <span className="node-ico">{selNode.icon}</span>
                <div>
                  <div className="node-nm">{selNode.name}</div>
                  <div className="node-sub">{selNode.cat}</div>
                </div>
              </div>
              <div className="form-grp">
                <label className="form-lbl">Parameters</label>
                <input className="form-inp" aria-label="Block parameters" value={selNode.params}
                  onChange={e=>setNodes(p=>p.map(n=>n.uid===sel?{...n,params:e.target.value}:n))}/>
              </div>
              <button className="btn btn-g btn-sm btn-full" style={{marginTop:10}} onClick={()=>removeNode(sel)}>
                🗑 Remove block
              </button>
            </>
          ):(
            <Empty icon="👆" title="No block selected" sub="Click a block on the canvas to edit its parameters."/>
          )}

          <div className="dd-sep" style={{margin:'14px 0'}}/>
          <div className="section-lbl">Validation</div>
          {[
            ['Has an entry condition',nodes.some(n=>n.cat==='Conditions')],
            ['Has an action',nodes.some(n=>n.cat==='Actions')],
            ['Has a stop loss',nodes.some(n=>n.id==='sl')],
            ['Has position sizing',nodes.some(n=>n.id==='size')],
          ].map(([l,ok])=>(
            <div key={l} className="row" style={{gap:7,padding:'5px 0',fontSize:11.5,color:ok?'var(--tx-2)':'var(--tx-3)'}}>
              <span style={{color:ok?'var(--tx-ok)':'var(--tx-wrn)'}}>{ok?'✓':'⚠'}</span>{l}
            </div>
          ))}
        </div>
      </div>

      <Modal open={saveModal} onClose={()=>setSaveModal(false)} icon="💾"
        title="Save Strategy" sub="Add this strategy to your library and make it available for backtesting."
        footer={
          <>
            <button className="btn btn-g btn-md" onClick={()=>setSaveModal(false)} disabled={saving}>Cancel</button>
            <button className="btn btn-p btn-md" onClick={save} disabled={saving}>
              {saving?<><Spinner/> Saving…</>:'💾 Save Strategy'}
            </button>
          </>
        }>
        <div className="form-grp">
          <label className="form-lbl">Name</label>
          <input className="form-inp" aria-label="Strategy name" value={meta.name} onChange={e=>setMeta(m=>({...m,name:e.target.value}))}/>
        </div>
        <div style={{background:'rgba(139,92,246,.07)',border:'1px solid var(--bd-pu)',borderRadius:8,padding:'10px 13px',fontSize:11.5,color:'var(--tx-2)',lineHeight:1.7}}>
          <strong style={{color:'var(--tx-1)'}}>{nodes.length} blocks</strong> · {meta.symbol} · {meta.tf}<br/>
          The strategy will be saved as <em>Testing</em> status until its first backtest completes.
        </div>
      </Modal>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/pages/JournalPage.js                  ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — TRADE JOURNAL
   Reuses: PageHd, Empty, Modal, Confirm, toast, MiniLine,
           .card / .btn / .filter-chip / .tbl / .stat (v5)
══════════════════════════════════════════════ */

const JournalPage=({go})=>{
  const {data,loading,setData}=useAsync(()=>api.journal.list(),[]);
  const {data:strats}=useAsync(()=>api.strategies.list().catch(()=>[]),[]);
  const [filter,setFilter]=useState('All');
  const [q,setQ]=useState('');
  const dq=useDebounced(q);
  const [modal,setModal]=useState(false);
  const [detail,setDetail]=useState(null);
  const [del,setDel]=useState(null);
  const [saving,setSaving]=useState(false);
  const [form,setForm]=useState({pair:'EUR/USD',dir:'Long',pnl:'',rating:4,tags:'',note:'',strategy:'Momentum Breakout'});
  const [errs,setErrs]=useState({});

  const entries=data||[];
  const filters=['All','Wins','Losses','A+ setups'];

  const shown=entries.filter(e=>{
    const passF=filter==='All'?true
      :filter==='Wins'?e.pnl>0
      :filter==='Losses'?e.pnl<0
      :e.tags.includes('A+ setup');
    const passQ=!dq||fuzzy(dq,e.pair)||fuzzy(dq,e.note)||fuzzy(dq,e.strategy)||e.tags.some(t=>fuzzy(dq,t));
    return passF&&passQ;
  });

  const wins=entries.filter(e=>e.pnl>0);
  const losses=entries.filter(e=>e.pnl<0);
  const totalPnl=entries.reduce((s,e)=>s+e.pnl,0);
  const winRate=entries.length?(wins.length/entries.length*100).toFixed(1):'0.0';
  const avgWin=wins.length?wins.reduce((s,e)=>s+e.pnl,0)/wins.length:0;
  const avgLoss=losses.length?Math.abs(losses.reduce((s,e)=>s+e.pnl,0)/losses.length):0;
  const expectancy=entries.length?(totalPnl/entries.length):0;
  const avgRating=entries.length?(entries.reduce((s,e)=>s+e.rating,0)/entries.length).toFixed(1):'—';

  /* Cumulative P&L curve reusing the v5 MiniLine component */
  const curve=useMemo(()=>{
    let run=0;
    return [...entries].sort((a,b)=>a.date-b.date).map((e,i)=>{ run+=e.pnl; return {w:`T${i+1}`,equity:run}; });
  },[entries]);

  const save=async()=>{
    const e={};
    if(!String(form.pnl).trim()||isNaN(+form.pnl)) e.pnl='Enter the realised P&L as a number.';
    if(!form.note.trim()) e.note='Write at least a short reflection.';
    setErrs(e);
    if(Object.keys(e).length) return;
    setSaving(true);
    const created=await api.journal.create({
      ...form,pnl:+form.pnl,date:Date.now(),
      tags:form.tags.split(',').map(t=>t.trim()).filter(Boolean),
    });
    setData(p=>[created,...p]);
    setSaving(false); setModal(false);
    setForm({pair:'EUR/USD',dir:'Long',pnl:'',rating:4,tags:'',note:'',strategy:'Momentum Breakout'});
    toast.success('Entry logged','Your trade has been added to the journal.');
  };

  const confirmDelete=async()=>{
    setSaving(true);
    await api.journal.remove(del.id);
    setData(p=>p.filter(e=>e.id!==del.id));
    setSaving(false); setDel(null); setDetail(null);
    toast.success('Entry deleted','The journal entry has been removed.');
  };

  const exportCsv=()=>{
    const rows=[['Date','Pair','Direction','Strategy','P&L','Rating','Tags','Note'],
      ...entries.map(e=>[fmtDate(e.date),e.pair,e.dir,e.strategy,e.pnl,e.rating,e.tags.join(' | '),`"${e.note.replace(/"/g,'""')}"`])];
    const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='quantoryx-journal.csv'; a.click();
    URL.revokeObjectURL(a.href);
    toast.success('Journal exported',`${entries.length} entries written to CSV.`);
  };

  const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

  return(
    <div className="page fade-page">
      <PageHd title="Trade Journal" sub="Log every trade, tag the setup, and review your own decision quality">
        <button className="btn btn-g btn-sm" onClick={exportCsv} disabled={!entries.length} aria-label="Export journal as CSV" title="Export CSV">⬇ Export CSV</button>
        <button className="btn btn-p btn-sm" onClick={()=>setModal(true)}>+ New Entry</button>
      </PageHd>

      <div className="stats-row">
        {[
          {l:'Net P&L',v:fmtMoney(totalPnl,0),c:'stat-pu',i:'💰',cls:dirClass(totalPnl)},
          {l:'Win Rate',v:`${winRate}%`,c:'stat-gr',i:'🎯'},
          {l:'Entries',v:entries.length,c:'stat-bl',i:'📓'},
          {l:'Avg Win',v:fmtMoney(avgWin,0),c:'stat-cy',i:'📈',cls:'up'},
          {l:'Avg Loss',v:fmtMoney(-avgLoss,0),c:'stat-rd',i:'📉',cls:'down'},
          {l:'Avg Grade',v:avgRating,c:'stat-or',i:'⭐'},
        ].map(s=>(
          <div key={s.l} className={cx('stat',s.c)}>
            <div className="stat-hd"><span className="stat-lbl">{s.l}</span><span className="stat-ico">{s.i}</span></div>
            <div className={cx('stat-val',s.cls)}>{loading?'—':s.v}</div>
          </div>
        ))}
      </div>

      <div className="card card-p">
        <div className="card-hd">
          <div>
            <div className="card-title">📈 Cumulative P&L</div>
            <div className="card-sub">Expectancy {fmtMoney(expectancy,2)} per trade across {entries.length} logged trades</div>
          </div>
        </div>
        {loading?<Skel h={60}/>:curve.length?<MiniLine data={curve} color="#8b5cf6" height={90}/>:
          <Empty icon="📈" title="No data yet" sub="Log your first trade to start building the equity curve."/>}
      </div>

      <div className="tbl-filters">
        <div className="strat-filters" style={{flex:1}}>
          {filters.map(f=><button key={f} className={cx('filter-chip',filter===f&&'on')} onClick={()=>setFilter(f)}>{f}</button>)}
        </div>
        <div className="tbl-search">
          <span style={{color:'var(--tx-3)',fontSize:12}}>🔍</span>
          <input placeholder="Search notes, pairs, tags…" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
      </div>

      {loading&&<div className="jr-grid">{Array.from({length:4},(_,i)=><SkelCard key={i} rows={2}/>)}</div>}

      {!loading&&shown.length===0&&(
        <div className="card card-p">
          <Empty icon="📓" title={q?`No entries match “${q}”`:'Your journal is empty'}
            sub="Consistent journaling is the fastest way to find the leaks in your process. Log a trade to begin."/>
          <div style={{textAlign:'center'}}>
            <button className="btn btn-p btn-sm" onClick={()=>setModal(true)}>+ Log your first trade</button>
          </div>
        </div>
      )}

      {!loading&&shown.length>0&&(
        <div className="jr-grid">
          {shown.map(e=>(
            <div key={e.id} className="jr-entry" onClick={()=>setDetail(e)}>
              <div className="jr-top">
                <span className="jr-pair">{e.pair}</span>
                <span className={cx('trade-dir',e.dir==='Long'?'dir-long':'dir-short')}>{e.dir}</span>
                <span className={cx('jr-pnl',dirClass(e.pnl))}>{fmtMoney(e.pnl,0)}</span>
              </div>
              <div className="jr-rating" style={{color:'var(--ye-400)'}}>{stars(e.rating)}</div>
              <div className="jr-note">{e.note}</div>
              <div className="jr-tags">
                {e.tags.slice(0,3).map(t=><span key={t} className="jr-tag">{t}</span>)}
              </div>
              <div className="jr-foot">
                <span style={{fontSize:10,color:'var(--tx-3)'}}>{relTime(e.date)}</span>
                <span style={{fontSize:10,color:'var(--tx-3)'}}>{e.strategy}</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── New entry modal ── */}
      <Modal open={modal} onClose={()=>setModal(false)} icon="📓" size="lg"
        title="New Journal Entry" sub="Record the trade and — more importantly — why you took it."
        footer={
          <>
            <span className="mdl-ft-l">Honest notes beat flattering ones.</span>
            <button className="btn btn-g btn-md" onClick={()=>setModal(false)} disabled={saving}>Cancel</button>
            <button className="btn btn-p btn-md" onClick={save} disabled={saving}>
              {saving?<><Spinner/> Saving…</>:'Save Entry'}
            </button>
          </>
        }>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          <div className="form-grp">
            <label className="form-lbl">Instrument</label>
            <select className="form-sel" value={form.pair} onChange={e=>setForm(f=>({...f,pair:e.target.value}))}>
              {['EUR/USD','GBP/USD','USD/JPY','XAU/USD','BTC/USD','ETH/USD','NASDAQ','SPX500'].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Direction</label>
            <select className="form-sel" value={form.dir} onChange={e=>setForm(f=>({...f,dir:e.target.value}))}>
              <option>Long</option><option>Short</option>
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Realised P&L ($)</label>
            <input className={cx('form-inp',errs.pnl&&'inp-err')} placeholder="e.g. 620 or -310"
              value={form.pnl} onChange={e=>setForm(f=>({...f,pnl:e.target.value}))}/>
            <FieldError>{errs.pnl}</FieldError>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div className="form-grp">
            <label className="form-lbl">Strategy</label>
            <select className="form-sel" value={form.strategy} onChange={e=>setForm(f=>({...f,strategy:e.target.value}))}>
              <option>Manual</option>
              {(strats||[]).map(s=><option key={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Execution Grade</label>
            <div className="row" style={{gap:4,height:34}}>
              {[1,2,3,4,5].map(n=>(
                <button key={n} onClick={()=>setForm(f=>({...f,rating:n}))}
                  style={{background:'none',border:'none',fontSize:19,lineHeight:1,color:n<=form.rating?'var(--ye-400)':'var(--bd-gl)'}}
                  aria-label={`${n} star${n>1?'s':''}`}>★</button>
              ))}
              <span style={{fontSize:11,color:'var(--tx-3)',marginLeft:6}}>{form.rating}/5</span>
            </div>
          </div>
        </div>

        <div className="form-grp">
          <label className="form-lbl">Tags <span style={{textTransform:'none',color:'var(--tx-3)'}}>(comma separated)</span></label>
          <input className="form-inp" placeholder="Breakout, Planned, A+ setup"
            value={form.tags} onChange={e=>setForm(f=>({...f,tags:e.target.value}))}/>
        </div>

        <div className="form-grp">
          <label className="form-lbl">Reflection</label>
          <textarea className={cx('form-inp',errs.note&&'inp-err')} rows={4}
            style={{resize:'vertical',minHeight:84,lineHeight:1.6,padding:'9px 11px'}}
            placeholder="What was the setup? Did you follow your plan? What would you do differently?"
            value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
          <FieldError>{errs.note}</FieldError>
          <div style={{fontSize:10,color:'var(--tx-3)',textAlign:'right'}}>{form.note.length} characters</div>
        </div>
      </Modal>

      {/* ── Detail modal ── */}
      <Modal open={!!detail} onClose={()=>setDetail(null)} size="lg" icon={detail?.pnl>=0?'📈':'📉'}
        title={detail?`${detail.pair} · ${detail.dir}`:''}
        sub={detail?`${detail.strategy} · ${fmtDate(detail.date)}`:''}
        footer={
          <>
            <button className="btn btn-g btn-md" style={{color:'var(--tx-err)'}} onClick={()=>setDel(detail)}>🗑 Delete</button>
            <button className="btn btn-g btn-md" onClick={()=>setDetail(null)}>Close</button>
            <button className="btn btn-p btn-md" onClick={()=>{ setDetail(null); go('backtest'); }}>▶ Backtest strategy</button>
          </>
        }>
        {detail&&(
          <>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
              {[['Realised P&L',fmtMoney(detail.pnl,2),dirClass(detail.pnl)],
                ['Execution Grade',`${detail.rating}/5`,'neu'],
                ['Direction',detail.dir,'neu']].map(([l,v,c])=>(
                <div key={l} className="bt-kpi">
                  <div className="bt-kpi-lbl">{l}</div>
                  <div className={cx('bt-kpi-val',c)}>{v}</div>
                </div>
              ))}
            </div>
            <div>
              <div className="section-lbl">Tags</div>
              <div className="jr-tags">{detail.tags.map(t=><span key={t} className="jr-tag">{t}</span>)}</div>
            </div>
            <div>
              <div className="section-lbl">Reflection</div>
              <div style={{fontSize:12,color:'var(--tx-2)',lineHeight:1.85}}>{detail.note}</div>
            </div>
          </>
        )}
      </Modal>

      <Confirm open={!!del} onClose={()=>setDel(null)} onConfirm={confirmDelete} loading={saving}
        title="Delete this entry?" confirmLabel="Delete entry"
        body={<>The {del?.pair} entry from {del?fmtDate(del.date):''} will be permanently removed.</>}/>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/pages/BillingPage.js                  ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — BILLING & SUBSCRIPTION
   Reuses: PageHd, Empty, Modal, Confirm, toast,
           .card / .btn / .tbl / .status-pill (v5)
══════════════════════════════════════════════ */

const BillingPage=({go})=>{
  const {data:plans,loading:pLoad}=useAsync(()=>api.billing.plans(),[]);
  const invoicesQ=useAsync(()=>api.billing.invoices(),[]);
  const {data:invoices,loading:iLoad}=invoicesQ;
  const usageQ=useAsync(()=>api.billing.usage(),[]);
  const {data:usage,loading:uLoad}=usageQ;
  const [cycle,setCycle]=useState('mo');
  const [renews,setRenews]=useState(null);
  /* First day of next month — matches the backend's usage-cycle reset. */
  const nextReset=useMemo(()=>{
    const d=new Date(); return new Date(d.getFullYear(),d.getMonth()+1,1);
  },[]);
  const fmtDay=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
  const [current,setCurrent]=useState('pro');
  const [confirm,setConfirm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [cardModal,setCardModal]=useState(false);

  const doSubscribe=async()=>{
    setSaving(true);
    const res=await api.billing.subscribe(confirm.id,cycle);
    if(res?.renews_at) setRenews(res.renews_at);
    setCurrent(confirm.id);
    setSaving(false);
    invoicesQ.refetch?.(); usageQ.refetch?.();
    toast.success('Plan updated',`You are now on the ${confirm.name} plan.`);
    setConfirm(null);
  };

  const price=p=>cycle==='mo'?p.price.mo:Math.round(p.price.yr/12);

  return(
    <div className="page fade-page">
      <PageHd title="Billing & Plan" sub="Manage your subscription, payment method, and usage">
        <button className="btn btn-g btn-sm" onClick={()=>go('settings')}>⚙ Account Settings</button>
        <button className="btn btn-p btn-sm" onClick={()=>setCardModal(true)}>💳 Update Payment</button>
      </PageHd>

      {/* ── Current plan banner ── */}
      <div className="card card-p" style={{background:'linear-gradient(135deg,rgba(139,92,246,.10),rgba(37,99,235,.06))',borderColor:'var(--bd-pu)'}}>
        <div className="row" style={{gap:14,flexWrap:'wrap'}}>
          <div className="mdl-hd-ico" style={{width:42,height:42,fontSize:19}}>💎</div>
          <div style={{flex:1,minWidth:180}}>
            <div style={{fontSize:14,fontWeight:700,color:'var(--tx-1)'}}>
              {plans?.find(p=>p.id===current)?.name||'Pro'} plan · active
            </div>
            <div style={{fontSize:11.5,color:'var(--tx-2)',marginTop:3,lineHeight:1.6}}>
              Renews on <strong style={{color:'var(--tx-1)'}}>{fmtDay(renews||nextReset)}</strong> · billed {cycle==='mo'?'monthly':'annually'} ·
              next charge {fmtMoney(plans?.find(p=>p.id===current)?.price[cycle]||49,2)}
            </div>
          </div>
          <div className="bill-toggle">
            {[['mo','Monthly'],['yr','Yearly']].map(([k,l])=>(
              <button key={k} className={cx('bill-tg',cycle===k&&'on')} onClick={()=>setCycle(k)}>
                {l}{k==='yr'&&<span className="save-tag">−20%</span>}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* ── Plans ── */}
      <div>
        <div className="section-lbl">Available Plans</div>
        {pLoad?(
          <div className="plans-grid">{Array.from({length:3},(_,i)=><SkelCard key={i} rows={6}/>)}</div>
        ):(
          <div className="plans-grid">
            {plans.map(p=>{
              const isCur=p.id===current;
              return(
                <div key={p.id} className={cx('plan',isCur&&'on')}>
                  {p.popular&&!isCur&&<span className="plan-tag">MOST POPULAR</span>}
                  {isCur&&<span className="plan-tag" style={{background:'var(--grad-success)'}}>CURRENT PLAN</span>}
                  <div>
                    <div className="plan-nm">{p.name}</div>
                    <div className="plan-desc" style={{marginTop:4}}>{p.desc}</div>
                  </div>
                  <div className="plan-price">
                    <span className="plan-amt">${price(p)}</span>
                    <span className="plan-per">/ month</span>
                  </div>
                  {cycle==='yr'&&p.price.yr>0&&
                    <div style={{fontSize:10.5,color:'var(--tx-ok)',marginTop:-6}}>${p.price.yr} billed annually</div>}
                  <div className="plan-feats">
                    {p.feats.map(([f,on])=>(
                      <div key={f} className={cx('plan-feat',!on&&'off')}>
                        <span className="plan-feat-ck">{on?'✓':'✕'}</span>{f}
                      </div>
                    ))}
                  </div>
                  <button className={cx('btn','btn-full','btn-md',isCur?'btn-g':'btn-p')}
                    disabled={isCur} onClick={()=>setConfirm(p)}>
                    {isCur?'✓ Current plan':p.price.mo===0?'Downgrade':'Upgrade to '+p.name}
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="port-grid" style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:16,alignItems:'start'}}>
        {/* ── Invoices ── */}
        <div className="card card-p">
          <div className="card-hd">
            <div className="card-title">🧾 Billing History</div>
            <button className="btn btn-g btn-sm" onClick={()=>toast.info('Export queued','Your invoice archive will be emailed shortly.')}>⬇ Export all</button>
          </div>
          {iLoad?<SkelTable rows={5} cols={5}/>:(
            <table className="tbl">
              <thead><tr><th>Invoice</th><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {invoices.map(inv=>(
                  <tr key={inv.id}>
                    <td style={{fontFamily:'JetBrains Mono,monospace',fontSize:11}}>{inv.id}</td>
                    <td>{inv.date}</td>
                    <td>{inv.plan}</td>
                    <td style={{fontFamily:'JetBrains Mono,monospace'}}>{fmtMoney(inv.amt,2)}</td>
                    <td><span className={cx('status-pill',inv.status==='paid'?'pill-ok':'pill-warn')}>
                      {inv.status==='paid'?'Paid':'Free'}</span></td>
                    <td><button className="copy-btn" onClick={()=>toast.success('Invoice downloaded',`${inv.id}.pdf saved.`)}>⬇ PDF</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>

        {/* ── Payment method + usage ── */}
        <div className="stack" style={{gap:16}}>
          <div className="card card-p">
            <div className="card-hd"><div className="card-title">💳 Payment Method</div></div>
            <div className="pm-card">
              <div className="pm-brand">VISA</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="pm-num">•••• •••• •••• 4242</div>
                <div className="pm-exp">Expires 08 / 2027 · Anwaar</div>
              </div>
            </div>
            <button className="btn btn-g btn-sm btn-full" style={{marginTop:10}} onClick={()=>setCardModal(true)}>
              Update card
            </button>
            <div style={{fontSize:10,color:'var(--tx-3)',marginTop:9,lineHeight:1.6,textAlign:'center'}}>
              🔒 Card details are tokenised and never stored on Quantoryx servers.
            </div>
          </div>

          <div className="card card-p">
            <div className="card-hd">
              <div>
                <div className="card-title">📊 Usage This Cycle</div>
                <div className="card-sub">Resets {fmtDay(nextReset)}</div>
              </div>
            </div>
            {uLoad?<SkelText lines={5}/>:usage.map(u=>{
              const unlimited=u.limit==='∞';
              const pct=unlimited?8:u.limit?Math.min(100,u.used/u.limit*100):0;
              const tone=pct>=90?'danger':pct>=70?'warn':'';
              return(
                <div key={u.label} className="usage-row">
                  <div className="usage-top">
                    <span className="usage-lbl">{u.label}</span>
                    <span className="usage-val">{fmtNum(u.used)} / {unlimited?'∞':fmtNum(u.limit)}</span>
                  </div>
                  <div className="usage-bar"><div className={cx('usage-fill',tone)} style={{width:`${pct}%`}}/></div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <Confirm open={!!confirm} onClose={()=>setConfirm(null)} onConfirm={doSubscribe} loading={saving}
        tone="info" title={`Switch to ${confirm?.name}?`} confirmLabel={`Switch to ${confirm?.name}`}
        body={<>Your plan changes immediately and billing is prorated against the remainder of the current cycle.
          {confirm&&confirm.price[cycle]>0&&<> You will be charged <strong style={{color:'var(--tx-1)'}}>{fmtMoney(confirm.price[cycle],2)}</strong> {cycle==='mo'?'per month':'per year'}.</>}</>}/>

      <Modal open={cardModal} onClose={()=>setCardModal(false)} icon="💳" size="sm"
        title="Update Payment Method" sub="Your new card replaces the one currently on file."
        footer={
          <>
            <button className="btn btn-g btn-md" onClick={()=>setCardModal(false)}>Cancel</button>
            <button className="btn btn-p btn-md" onClick={()=>{ setCardModal(false); toast.success('Card updated','Future invoices will use the new card.'); }}>Save card</button>
          </>
        }>
        <div className="form-grp">
          <label className="form-lbl">Cardholder Name</label>
          <input className="form-inp" placeholder="Name as it appears on the card" defaultValue="Anwaar"/>
        </div>
        <div className="form-grp">
          <label className="form-lbl">Card Number</label>
          <input className="form-inp" placeholder="4242 4242 4242 4242" style={{fontFamily:'JetBrains Mono,monospace'}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div className="form-grp">
            <label className="form-lbl">Expiry</label>
            <input className="form-inp" placeholder="MM / YY" style={{fontFamily:'JetBrains Mono,monospace'}}/>
          </div>
          <div className="form-grp">
            <label className="form-lbl">CVC</label>
            <input className="form-inp" placeholder="•••" style={{fontFamily:'JetBrains Mono,monospace'}}/>
          </div>
        </div>
      </Modal>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/pages/HelpPage.js                     ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — HELP & DOCS
   Wires up the previously inert "Help & Docs" sidebar button.
   Reuses: PageHd, Empty, Kbd, toast, .card / .btn / .form-* (v5)
══════════════════════════════════════════════ */

const HelpPage=({go})=>{
  const {data:faq,loading:fLoad}=useAsync(()=>api.help.faq(),[]);
  const {data:docs,loading:dLoad}=useAsync(()=>api.help.docs(),[]);
  const shortcuts=api.help.shortcuts();
  const [section,setSection]=useState('start');
  const [open,setOpen]=useState(0);
  const [q,setQ]=useState('');
  const dq=useDebounced(q);
  const [sent,setSent]=useState(false);
  const [msg,setMsg]=useState({subject:'',body:''});

  const nav=[
    {id:'start',    icon:'🚀',label:'Getting Started'},
    {id:'guides',   icon:'📚',label:'Guides'},
    {id:'faq',      icon:'❓',label:'FAQ'},
    {id:'shortcuts',icon:'⌨',label:'Shortcuts'},
    {id:'contact',  icon:'✉️',label:'Contact Support'},
  ];

  const shownFaq=(faq||[]).filter(f=>!dq||fuzzy(dq,f.q)||fuzzy(dq,f.a));
  const shownDocs=(docs||[]).filter(d=>!dq||fuzzy(dq,d.title)||fuzzy(dq,d.desc));

  const steps=[
    {n:1,icon:'📋',t:'Create or pick a strategy',d:'Use the visual Strategy Builder, or start from one of the seven prebuilt strategies in your library.',go:'builder'},
    {n:2,icon:'▶',t:'Backtest it on history',d:'Choose an instrument, timeframe, and date range. Review Sharpe, drawdown, and the full trade list.',go:'backtest'},
    {n:3,icon:'⚙',t:'Optimize the parameters',d:'Run a grid or genetic search and read the 3D surface to find stable parameter islands, not lucky spikes.',go:'optimize'},
    {n:4,icon:'📡',t:'Go live with signals & alerts',d:'Enable live signals and configure alerts so the platform tells you the moment a setup appears.',go:'signals'},
  ];

  const send=()=>{
    if(!msg.subject.trim()||!msg.body.trim()){
      toast.error('Missing details','Add a subject and describe the issue.');
      return;
    }
    setSent(true);
    toast.success('Message sent','Support usually replies within 4 hours on the Pro plan.');
  };

  return(
    <div className="page fade-page">
      <PageHd title="Help & Docs" sub="Guides, answers, and shortcuts for getting the most out of Quantoryx">
        <div className="tbl-search" style={{maxWidth:260}}>
          <span style={{color:'var(--tx-3)',fontSize:12}}>🔍</span>
          <input placeholder="Search help…" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <button className="btn btn-p btn-sm" onClick={()=>setSection('contact')}>✉️ Contact Support</button>
      </PageHd>

      <div className="help-grid">
        <div className="help-nav">
          {nav.map(n=>(
            <button key={n.id} className={cx('help-nav-i',section===n.id&&'on')} onClick={()=>setSection(n.id)}>
              <span>{n.icon}</span>{n.label}
            </button>
          ))}
          <div className="card card-p" style={{marginTop:12,background:'rgba(139,92,246,.06)',borderColor:'var(--bd-pu)'}}>
            <div style={{fontSize:11.5,fontWeight:700,color:'var(--tx-1)',marginBottom:4}}>🤖 Ask the AI</div>
            <div style={{fontSize:10.5,color:'var(--tx-2)',lineHeight:1.6,marginBottom:9}}>
              The assistant can answer platform questions as well as market ones.
            </div>
            <button className="btn btn-p btn-sm btn-full" onClick={()=>go('ai')}>Open assistant →</button>
          </div>
        </div>

        <div>
          {/* ── Getting started ── */}
          {section==='start'&&(
            <div className="stack" style={{gap:16}}>
              <div className="card card-p">
                <div className="card-hd">
                  <div>
                    <div className="card-title">🚀 Your first 10 minutes</div>
                    <div className="card-sub">Four steps from empty account to live signals</div>
                  </div>
                </div>
                <div className="stack" style={{gap:10}}>
                  {steps.map(s=>(
                    <div key={s.n} className="row" style={{gap:12,padding:'11px 13px',background:'var(--bg-card)',border:'1px solid var(--bd)',borderRadius:'var(--r)'}}>
                      <div className="mdl-hd-ico" style={{width:34,height:34}}>{s.icon}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12.5,fontWeight:600,color:'var(--tx-1)'}}>
                          <span style={{color:'var(--pu-400)',marginRight:6}}>{s.n}.</span>{s.t}
                        </div>
                        <div style={{fontSize:11,color:'var(--tx-2)',marginTop:3,lineHeight:1.6}}>{s.d}</div>
                      </div>
                      <button className="btn btn-g btn-sm" onClick={()=>go(s.go)}>Open →</button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card card-p">
                <div className="card-hd"><div className="card-title">📖 Key concepts</div></div>
                <div className="docs-grid">
                  {[
                    ['Sharpe Ratio','Risk-adjusted return. Above 1.0 is decent, above 2.0 is excellent — but only if the sample is large enough.'],
                    ['Max Drawdown','The deepest peak-to-trough equity decline. It is the number that decides whether you can actually stick with a strategy.'],
                    ['Walk-Forward','Repeatedly optimize on one window and test on the next unseen window. The honest way to validate a strategy.'],
                    ['Market Regime','A classification of the current environment — Bull, Neutral, or Bear — that determines which strategies are likely to work.'],
                  ].map(([t,d])=>(
                    <div key={t} className="doc-card" style={{cursor:'default'}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:700,color:'var(--tx-1)'}}>{t}</div>
                        <div style={{fontSize:11,color:'var(--tx-2)',marginTop:4,lineHeight:1.65}}>{d}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── Guides ── */}
          {section==='guides'&&(
            <div className="card card-p">
              <div className="card-hd">
                <div className="card-title">📚 Documentation</div>
                <div style={{fontSize:11,color:'var(--tx-3)'}}>{shownDocs.length} article{shownDocs.length===1?'':'s'}</div>
              </div>
              {dLoad?<div className="docs-grid">{Array.from({length:4},(_,i)=><SkelCard key={i} rows={2}/>)}</div>:
               shownDocs.length===0?<Empty icon="🔍" title={`No guides match “${q}”`} sub="Try a different keyword, or ask the AI assistant."/>:(
                <div className="docs-grid">
                  {shownDocs.map(d=>(
                    <div key={d.title} className="doc-card" onClick={()=>toast.info(d.title,'Opening documentation…')}>
                      <div className="doc-ico">{d.icon}</div>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:12.5,fontWeight:700,color:'var(--tx-1)'}}><Highlight text={d.title} q={dq}/></div>
                        <div style={{fontSize:11,color:'var(--tx-2)',marginTop:4,lineHeight:1.6}}>{d.desc}</div>
                        <div style={{fontSize:10,color:'var(--tx-3)',marginTop:6}}>⏱ {d.time}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── FAQ ── */}
          {section==='faq'&&(
            <div className="card card-p">
              <div className="card-hd">
                <div className="card-title">❓ Frequently Asked Questions</div>
                <div style={{fontSize:11,color:'var(--tx-3)'}}>{shownFaq.length} answer{shownFaq.length===1?'':'s'}</div>
              </div>
              {fLoad?<SkelText lines={6}/>:
               shownFaq.length===0?<Empty icon="🔍" title={`Nothing matches “${q}”`} sub="Contact support and we will answer directly."/>:
               shownFaq.map((f,i)=>(
                <div key={f.q} className={cx('faq',open===i&&'on')}>
                  <button className="faq-q" onClick={()=>setOpen(open===i?-1:i)}>
                    <span style={{color:'var(--pu-400)'}}>Q</span>
                    <span style={{flex:1}}><Highlight text={f.q} q={dq}/></span>
                    <span className="faq-arr">▼</span>
                  </button>
                  {open===i&&<div className="faq-a">{f.a}</div>}
                </div>
              ))}
            </div>
          )}

          {/* ── Shortcuts ── */}
          {section==='shortcuts'&&(
            <div className="card card-p">
              <div className="card-hd">
                <div>
                  <div className="card-title">⌨ Keyboard Shortcuts</div>
                  <div className="card-sub">Every shortcut works from any page</div>
                </div>
              </div>
              {shortcuts.map(s=>(
                <div key={s.desc} className="kbd-tbl-row">
                  <span>{s.desc}</span>
                  <span className="kbd-combo">
                    {s.keys.map((k,i)=><React.Fragment key={k}>{i>0&&<span style={{color:'var(--tx-3)',fontSize:10}}>+</span>}<Kbd>{k}</Kbd></React.Fragment>)}
                  </span>
                </div>
              ))}
            </div>
          )}

          {/* ── Contact ── */}
          {section==='contact'&&(
            <div className="stack" style={{gap:16}}>
              <div className="card card-p">
                <div className="card-hd">
                  <div>
                    <div className="card-title">✉️ Contact Support</div>
                    <div className="card-sub">Pro plan · typical first response under 4 hours</div>
                  </div>
                </div>
                {sent?(
                  <>
                    <Empty icon="✅" title="Message sent" sub="We have your request and will reply to anwaar@quantoryx.io shortly. Ticket #QX-4821."/>
                    <div style={{textAlign:'center'}}>
                      <button className="btn btn-g btn-sm" onClick={()=>{ setSent(false); setMsg({subject:'',body:''}); }}>Send another message</button>
                    </div>
                  </>
                ):(
                  <>
                    <div className="form-grp">
                      <label className="form-lbl">Subject</label>
                      <input className="form-inp" placeholder="Briefly, what do you need help with?"
                        value={msg.subject} onChange={e=>setMsg(m=>({...m,subject:e.target.value}))}/>
                    </div>
                    <div className="form-grp" style={{marginTop:10}}>
                      <label className="form-lbl">Message</label>
                      <textarea className="form-inp" rows={5} style={{resize:'vertical',minHeight:110,lineHeight:1.6,padding:'9px 11px'}}
                        placeholder="Include the strategy, page, or backtest ID involved so we can reproduce the issue."
                        value={msg.body} onChange={e=>setMsg(m=>({...m,body:e.target.value}))}/>
                    </div>
                    <button className="btn btn-p btn-full btn-md" style={{marginTop:12}} onClick={send}>Send message</button>
                  </>
                )}
              </div>

              <div className="docs-grid">
                {[['💬','Live chat','Available 9am–9pm UTC for Pro and Quant plans.'],
                  ['📧','Email','support@quantoryx.io — always open.'],
                  ['🐦','Community','Join 4,200 traders in the Quantoryx Discord.'],
                  ['📄','Status page','Live uptime and incident history.']].map(([i,t,d])=>(
                  <div key={t} className="doc-card" onClick={()=>toast.info(t,'Opening…')}>
                    <div className="doc-ico">{i}</div>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:700,color:'var(--tx-1)'}}>{t}</div>
                      <div style={{fontSize:11,color:'var(--tx-2)',marginTop:4,lineHeight:1.6}}>{d}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/app/AppShell.js                       ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — APP SHELL (backend-integrated)

   Extends the v5 shell WITHOUT modifying it. The v5 components
   (Sidebar, Header, MobNav, PageWrap, PageHd, Empty, Toggle,
   MiniLine, Spark, ChartTip and every v5 page) remain declared
   and are reused; the live pages replace only the data source.
══════════════════════════════════════════════ */

const NAV_V6=[
  {id:'dashboard', icon:'⬛',label:'Dashboard'},
  {id:'strategies',icon:'📋',label:'Strategies'},
  {id:'backtest',  icon:'▶', label:'Backtest'},
  {id:'optimize',  icon:'⚙', label:'Optimize'},
  {id:'ai',        icon:'🤖',label:'AI Assistant',dot:true},
  {id:'builder',   icon:'🧱',label:'Builder',badge:'New'},
  {id:'signals',   icon:'📡',label:'Live Signals'},
  {id:'alerts',    icon:'🔔',label:'Alerts'},
  {id:'portfolio', icon:'💼',label:'Portfolio'},
  {id:'reports',   icon:'📊',label:'Reports'},
  {id:'regime',    icon:'🌐',label:'Market Regime'},
  {id:'journal',   icon:'📓',label:'Trade Journal'},
  {id:'settings',  icon:'⚙', label:'Settings'},
];

const SidebarV6=({page,go,onLogout,wsState})=>(
  <nav className="sb">
    {NAV_V6.map(n=>(
      <button key={n.id} className={cx('sb-nav',page===n.id&&'on')} onClick={()=>go(n.id)}>
        <span className="sb-icon">{n.icon}</span>
        <span className="sb-lbl">{n.label}</span>
        {n.badge&&<span className="sb-badge">{n.badge}</span>}
        {n.dot&&<span className="sb-dot"/>}
      </button>
    ))}
    <div className="sb-spacer"/>
    <div className="sb-ai">
      <div style={{fontSize:22,marginBottom:4}}>🧠</div>
      <div className="sb-ai-title">Quantoryx AI</div>
      <div className="sb-ai-sub">Live decision engine.</div>
      <button className="sb-ai-btn" onClick={()=>go('ai')}>▶ Run AI Analysis →</button>
    </div>
    <div className="sb-footer">
      <div className="row" style={{gap:6,padding:'4px 12px',fontSize:10,color:'var(--tx-3)'}}>
        <span style={{width:7,height:7,borderRadius:'50%',
          background:wsState==='open'?'var(--gr-500)':wsState==='error'?'var(--re-500)':'var(--tx-3)',
          animation:wsState==='open'?'pulse 1.8s infinite':'none'}}/>
        {wsState==='open'?'Live socket':wsState==='error'?'Socket error':'Socket idle'}
      </div>
      <button className={cx('sb-nav',page==='billing'&&'on')} onClick={()=>go('billing')}>
        <span className="sb-icon">💳</span><span className="sb-lbl">Billing</span>
      </button>
      <button className={cx('sb-nav',page==='help'&&'on')} onClick={()=>go('help')}>
        <span className="sb-icon">❓</span><span className="sb-lbl">Help & Docs</span>
      </button>
      <button className="sb-nav" onClick={onLogout}>
        <span className="sb-icon">🚪</span><span className="sb-lbl">Logout</span>
      </button>
    </div>
  </nav>
);

const HeaderV6=({dark,toggleTheme,go,onOpenPalette,user,onLogout,apiUp})=>(
  <header className="hd">
    <div className="hd-logo" onClick={()=>go('dashboard')} style={{cursor:'pointer'}}>
      <div className="hd-logo-icon">Q</div>
      <div style={{display:'flex',flexDirection:'column',lineHeight:1}}>
        <span className="hd-logo-name">QUANTORYX</span>
        <span className="hd-logo-tag">AI-Powered Trading Platform</span>
      </div>
    </div>

    <button className="hd-search" onClick={onOpenPalette}
      style={{border:'1px solid var(--bd)',textAlign:'left',cursor:'text'}} aria-label="Open command palette">
      <span className="hd-search-icon">🔍</span>
      <span style={{flex:1,color:'var(--tx-3)',fontSize:13}}>Search strategies, pages, actions…</span>
      <span className="hd-kbd">Ctrl + K</span>
    </button>

    <div className="hd-gap"/>
    <div className="hd-mkt">
      <div className="hd-dot" style={{background:apiUp?'var(--gr-500)':'var(--re-500)'}}/>
      {apiUp?'API Connected':'API Offline'}
    </div>

    <div className="hd-actions">
      <NotificationBell go={go}/>
      <button className="hd-btn" onClick={toggleTheme} title={dark?'Switch to light mode':'Switch to dark mode'}>
        {dark?'☀️':'🌙'}
      </button>
      <button className="hd-btn" onClick={()=>go('settings')} title="Settings">⚙️</button>
      <ProfileMenu go={go} user={user} onLogout={onLogout} onToggleTheme={toggleTheme} dark={dark}/>
    </div>
  </header>
);

const MobNavV6=({page,go,onMore})=>{
  const primary=[
    {id:'dashboard',i:'⬛',l:'Home'},
    {id:'strategies',i:'📋',l:'Strategy'},
    {id:'ai',i:'🤖',l:'AI Chat'},
    {id:'portfolio',i:'💼',l:'Portfolio'},
  ];
  const inPrimary=primary.some(p=>p.id===page);
  return(
    <nav className="mob-nav">
      <div className="mob-nav-items">
        {primary.map(n=>(
          <button key={n.id} className={cx('mob-btn',page===n.id&&'on')} onClick={()=>go(n.id)}>
            <span className="mob-ico">{n.i}</span>{n.l}
          </button>
        ))}
        <button className={cx('mob-btn',!inPrimary&&'on')} onClick={onMore}>
          <span className="mob-ico">⋯</span>More
        </button>
      </div>
    </nav>
  );
};

/* ══════════════════════════════════════════════
   ROOT — AppV6
══════════════════════════════════════════════ */
const AppV6=()=>{
  const [dark,setDark]=usePersisted('theme.dark',true);
  const [page,setPage]=usePersisted('nav.page','dashboard');
  const [user,setUser]=useState(null);
  const [booting,setBooting]=useState(true);
  const [apiUp,setApiUp]=useState(true);
  const [wsState,setWsState]=useState('idle');
  const [palette,setPalette]=useState(false);
  const [more,setMore]=useState(false);
  const [logoutAsk,setLogoutAsk]=useState(false);
  const [strategies,setStrategies]=useState([]);

  useEffect(()=>{ document.body.classList.toggle('lm',!dark); },[dark]);
  const toggleTheme=useCallback(()=>setDark(d=>!d),[setDark]);

  /* ── Session restore: a stored token means we can skip login ── */
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{ await api.system.health(); if(alive) setApiUp(true); }
      catch{ if(alive) setApiUp(false); }
      if(api.isAuthed()){
        try{ const me=await api.auth.me(); if(alive) setUser(me); }
        catch{ api.tokens.clear(); }
      }
      if(alive) setBooting(false);
    })();
    return()=>{ alive=false; };
  },[]);

  /* ── Forced logout when refresh fails ── */
  useEffect(()=>api.events.subscribe(e=>{
    if(e.type==='logout'){
      setUser(null);
      if(e.reason==='expired') toast.warn('Session expired','Please sign in again.');
    }
  }),[]);

  /* ── Periodic API health probe ── */
  useInterval(()=>{
    api.system.health().then(()=>setApiUp(true)).catch(()=>setApiUp(false));
  },user?45000:null);

  /* ── Strategy catalogue for the command palette ── */
  useEffect(()=>{
    if(!user) return;
    api.strategies.list().then(setStrategies).catch(()=>{});
  },[user]);

  /* ── WebSocket: live prices, orders, notifications ── */
  useEffect(()=>{
    if(!user?.id) return;
    const close=api.ws.connect(user.id,{
      onStatus:setWsState,
      onMessage:m=>{
        if(!m||!m.type) return;
        if(m.type==='NOTIFICATION'){
          toast.info(m.title||'Notification',m.message||'');
        }else if(m.type==='SIGNAL'){
          toast.success('New signal',`${m.symbol||''} ${m.action||''}`.trim());
        }
      },
    });
    return close;
  },[user?.id]);

  const go=useCallback(p=>{
    setPage(p); setPalette(false); setMore(false);
    if(window.location.hash!==`#/${p}`) window.location.hash=`#/${p}`;
  },[setPage]);

  useEffect(()=>{
    const sync=()=>{
      const h=window.location.hash.replace(/^#\/?/,'');
      if(h&&h!==page) setPage(h);
    };
    sync();
    window.addEventListener('hashchange',sync);
    return()=>window.removeEventListener('hashchange',sync);
  },[page,setPage]);

  useHotkeys(useMemo(()=>({
    'ctrl+k':()=>setPalette(p=>!p),
    'ctrl+shift+t':toggleTheme,
    'g d':()=>go('dashboard'), 'g s':()=>go('strategies'),
    'g b':()=>go('backtest'),  'g o':()=>go('optimize'),
    'g a':()=>go('ai'),        'g p':()=>go('portfolio'),
    'g r':()=>go('reports'),   'g j':()=>go('journal'),
    'g l':()=>go('signals'),   '?':()=>go('help'),
  }),[go,toggleTheme]),!!user);

  const doLogout=async()=>{
    setLogoutAsk(false);
    await api.auth.logout();
    setUser(null); setPage('dashboard');
    toast.info('Signed out','See you next session.');
  };

  /* ── Boot splash ── */
  if(booting){
    return(
      <div className="login-page">
        <div className="login-card" style={{textAlign:'center',padding:'40px 30px'}}>
          <div className="login-logo-ico">Q</div>
          <div className="login-title" style={{marginTop:12}}>Quantoryx</div>
          <div className="row" style={{gap:9,justifyContent:'center',marginTop:16,color:'var(--tx-2)',fontSize:12}}>
            <Spinner dark/> Connecting to backend…
          </div>
        </div>
      </div>
    );
  }

  /* ── Protected: everything below requires a session ── */
  if(!user){
    return(
      <>
        {!apiUp&&(
          <div style={{position:'fixed',top:0,left:0,right:0,zIndex:999,padding:'8px 14px',
            background:'rgba(239,68,68,.14)',borderBottom:'1px solid rgba(239,68,68,.3)',
            color:'var(--tx-err)',fontSize:11.5,textAlign:'center',backdropFilter:'blur(10px)'}}>
            ⚠ Backend unreachable at <strong>{api._base}</strong> — start the API server, then sign in.
          </div>
        )}
        <LiveAuthPage onAuthed={setUser}/>
        <ToastHost/>
      </>
    );
  }

  const renderPage=()=>{
    switch(page){
      /* live, backend-bound */
      case 'dashboard':  return <LiveDashboard go={go}/>;
      case 'strategies': return <LiveStrategiesPage go={go}/>;
      case 'backtest':   return <LiveBacktestPage go={go}/>;
      case 'optimize':   return <LiveOptimizePage go={go}/>;
      case 'portfolio':  return <LivePortfolioPage go={go}/>;
      case 'reports':    return <LiveReportsPage/>;
      case 'regime':     return <LiveRegimePage/>;
      case 'ai':         return <LiveAIPage go={go}/>;
      case 'settings':   return <LiveSettingsPage dark={dark} toggleTheme={toggleTheme}
                                  user={user} onUserUpdate={setUser}/>;
      /* fixture-backed until backend routes exist */
      case 'builder':    return <BuilderPage go={go}/>;
      case 'signals':    return <SignalsPage go={go}/>;
      case 'alerts':     return <AlertsPage go={go}/>;
      case 'journal':    return <JournalPage go={go}/>;
      case 'billing':    return <BillingPage go={go}/>;
      case 'help':       return <HelpPage go={go}/>;
      default:           return <NotFoundPage go={go} page={page}/>;
    }
  };

  return(
    <div className={cx('shell',!dark&&'lm')}>
      <HeaderV6 dark={dark} toggleTheme={toggleTheme} go={go} user={user} apiUp={apiUp}
        onOpenPalette={()=>setPalette(true)} onLogout={()=>setLogoutAsk(true)}/>
      <SidebarV6 page={page} go={go} onLogout={()=>setLogoutAsk(true)} wsState={wsState}/>

      <PageWrap k={page}>
        <ErrorBoundary go={go} resetKey={page}>{renderPage()}</ErrorBoundary>
      </PageWrap>

      <MobNavV6 page={page} go={go} onMore={()=>setMore(true)}/>

      <CommandPalette open={palette} onClose={()=>setPalette(false)} go={go}
        onToggleTheme={toggleTheme} pages={NAV_V6}
        strategies={strategies.map(s=>({id:s.id,name:s.name,type:s.type,sharpe:'—',ret:s.key}))}
        reports={[]}/>

      <MobileMoreDrawer open={more} onClose={()=>setMore(false)} page={page} go={go}/>

      <Confirm open={logoutAsk} onClose={()=>setLogoutAsk(false)} onConfirm={doLogout}
        tone="warn" title="Sign out of Quantoryx?" confirmLabel="Sign out"
        body="Your refresh token will be revoked on the server and you'll need to sign in again."/>

      <ToastHost/>
    </div>
  );
};

ReactDOM.render(<AppV6/>,document.getElementById('root'));

</script>
</body>
</html>
