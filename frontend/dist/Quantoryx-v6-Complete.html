/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/lib/api.js                            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — API SERVICE LAYER (LIVE)

   Single seam between the UI and the FastAPI backend
   (github.com/qazianwaar1996-prog/Quantoryx).

   • All routers mount under /api  (backend/main.py:161-170)
   • JWT bearer auth, access + refresh token rotation
   • snake_case ⇄ camelCase adapters live here so no page
     component ever sees a backend field name
   • Endpoints the backend does not implement yet fall back to
     local fixtures, flagged with `degraded:true`, so the UI stays
     functional instead of showing a dead page.
══════════════════════════════════════════════ */

const API_BASE = (window.QX_API_BASE ?? 'https://quantoryx-backend-production.up.railway.app/api');
const WS_BASE  = (window.QX_WS_BASE  ?? 'wss://quantoryx-backend-production.up.railway.app');
const LATENCY  = [140, 380];            // fixture-only simulated latency

/* ── Token store (survives reload) ───────────────────── */
const TokenStore={
  get access(){ try{ return localStorage.getItem('qx.access')||null; }catch{ return null; } },
  get refresh(){ try{ return localStorage.getItem('qx.refresh')||null; }catch{ return null; } },
  set({access,refresh}){
    try{
      if(access)  localStorage.setItem('qx.access',access);
      if(refresh) localStorage.setItem('qx.refresh',refresh);
    }catch{}
  },
  clear(){ try{ localStorage.removeItem('qx.access'); localStorage.removeItem('qx.refresh'); }catch{} },
};

/* Decode a JWT payload without verifying (verification is the server's job).
   Used only to pre-empt expiry and to read the role claim for UI gating. */
const decodeJwt=t=>{
  try{
    const p=t.split('.')[1];
    return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));
  }catch{ return null; }
};
const jwtExpired=(t,skewMs=15000)=>{
  const c=decodeJwt(t);
  if(!c||!c.exp) return false;              // opaque token: let the server decide
  return Date.now()+skewMs >= c.exp*1000;
};

class ApiError extends Error{
  constructor(status,msg,body){
    super(msg||`Request failed (${status})`);
    this.status=status; this.name='ApiError'; this.body=body;
  }
}
/* Raised when the backend route genuinely does not exist yet */
class NotImplementedError extends ApiError{
  constructor(path){ super(501,`Not implemented on backend: ${path}`); this.name='NotImplementedError'; }
}

const _delay=()=>new Promise(r=>setTimeout(r,LATENCY[0]+Math.random()*(LATENCY[1]-LATENCY[0])));

/* ── Auth event bus: lets AppShell react to forced logout ── */
const AuthEvents=(()=>{
  let subs=[];
  return{ subscribe(fn){ subs.push(fn); return()=>{subs=subs.filter(s=>s!==fn);}; },
          emit(e){ subs.forEach(s=>s(e)); } };
})();

/* ── Tiny GET cache (dedupes in-flight + short TTL) ── */
const _cache=new Map();
const _inflight=new Map();
const cacheKey=(p,o)=>`${o?.method||'GET'} ${p}`;
const invalidate=pref=>{ [..._cache.keys()].forEach(k=>{ if(k.includes(pref)) _cache.delete(k); }); };

/* ── Core transport with refresh-once-on-401 + retry ── */
let _refreshing=null;

async function _raw(path,opts={}){
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),opts.timeout??45000);
  try{
    const res=await fetch(`${API_BASE}${path}`,{
      method:opts.method||'GET',
      headers:{
        ...(opts.body?{'Content-Type':'application/json'}:{}),
        ...(TokenStore.access?{Authorization:`Bearer ${TokenStore.access}`}:{}),
        ...(opts.headers||{}),
      },
      body:opts.body?JSON.stringify(opts.body):undefined,
      signal:ctrl.signal,
    });
    const text=await res.text();
    let data=null;
    try{ data=text?JSON.parse(text):null; }catch{ data=text; }
    if(!res.ok){
      const detail=(data&&typeof data==='object'&&data.detail)||res.statusText;
      if(res.status===404) throw new NotImplementedError(path);
      throw new ApiError(res.status,typeof detail==='string'?detail:JSON.stringify(detail),data);
    }
    return data;
  } finally { clearTimeout(timeout); }
}

async function _refreshTokens(){
  if(_refreshing) return _refreshing;
  const rt=TokenStore.refresh;
  if(!rt){ throw new ApiError(401,'Session expired'); }
  _refreshing=(async()=>{
    try{
      const t=await _raw('/auth/refresh',{method:'POST',body:{refresh_token:rt}});
      TokenStore.set({access:t.access_token,refresh:t.refresh_token});
      return t;
    } finally { _refreshing=null; }
  })();
  return _refreshing;
}

async function _http(path,opts={}){
  try{
    /* Pre-emptive refresh: avoids a guaranteed-401 round trip and the
       resulting UI flicker when the access token has already lapsed. */
    const at=TokenStore.access;
    if(at && jwtExpired(at) && TokenStore.refresh && !path.startsWith('/auth/refresh')){
      try{ await _refreshTokens(); }catch{}
    }
    return await _raw(path,opts);
  }catch(e){
    /* one transparent refresh attempt on expiry */
    if(e.status===401 && TokenStore.refresh && !opts._retried){
      try{
        await _refreshTokens();
        return await _raw(path,{...opts,_retried:true});
      }catch{
        TokenStore.clear();
        AuthEvents.emit({type:'logout',reason:'expired'});
        throw new ApiError(401,'Your session expired. Please sign in again.');
      }
    }
    if(e.status===401){ log.warn('auth','401 — clearing session',{path});
      TokenStore.clear(); AuthEvents.emit({type:'logout',reason:'unauthorised'}); }
    /* one retry for transient network/5xx on idempotent reads */
    if((e.name==='AbortError'||e.status>=500) && (opts.method||'GET')==='GET' && !opts._retried){
      await _delay();
      return _raw(path,{...opts,_retried:true});
    }
    throw e;
  }
}

/* Cached GET */
async function _get(path,{ttl=8000,force=false}={}){
  const k=cacheKey(path);
  const hit=_cache.get(k);
  if(!force && hit && Date.now()-hit.t<ttl) return hit.v;
  if(_inflight.has(k)) return _inflight.get(k);
  const p=_http(path).then(v=>{ _cache.set(k,{v,t:Date.now()}); _inflight.delete(k); return v; })
                     .catch(e=>{ _inflight.delete(k); throw e; });
  _inflight.set(k,p);
  return p;
}

const toMs=iso=>{ const t=Date.parse(iso); return Number.isNaN(t)?Date.now():t; };
/* Evenly sample an array down to `max` items, preserving both endpoints. */
const decimate=(arr,max=400)=>{
  if(!Array.isArray(arr)||arr.length<=max) return arr||[];
  const step=(arr.length-1)/(max-1);
  const out=[];
  for(let i=0;i<max;i++) out.push(arr[Math.round(i*step)]);
  out[out.length-1]=arr[arr.length-1];
  return out;
};

      let sock=null,hb=null,retry=0,closed=false;
      const open=()=>{
        if(closed) return;
        const tk=TokenStore.access;
        if(!tk){ onStatus?.('idle'); return; }   // backend rejects tokenless handshakes
        try{ sock=new WebSocket(`${WS_BASE}${API_BASE}/ws/${userId}?token=${encodeURIComponent(tk)}`); }
        catch{ onStatus?.('error'); return; }
        sock.onopen=()=>{ retry=0; onStatus?.('open');
          hb=setInterval(()=>{ try{ sock.readyState===1&&sock.send('ping'); }catch{} },25000); };
        sock.onmessage=e=>{ try{ onMessage?.(JSON.parse(e.data)); }catch{ onMessage?.({type:'RAW',data:e.data}); } };
        sock.onerror=()=>onStatus?.('error');
        sock.onclose=ev=>{
          clearInterval(hb); onStatus?.(ev?.code===1008?'unauthorised':'closed');
          if(closed||ev?.code===1008) return;   // 1008 = policy violation, retrying is futile
          retry=Math.min(retry+1,6);
          setTimeout(open,Math.min(1000*2**retry,30000));  // exponential backoff
        };
      };
      open();
      return ()=>{ closed=true; clearInterval(hb); try{ sock?.close(); }catch{} };
    },
  },
};

/* ── Close on outside click / Escape ── */
const useDismiss=(open,onClose)=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const onDown=e=>{ if(ref.current&&!ref.current.contains(e.target)) onClose(); };
    const onKey=e=>{ if(e.key==='Escape'){ e.stopPropagation(); onClose(); } };
    document.addEventListener('mousedown',onDown);
    document.addEventListener('keydown',onKey);
    return()=>{ document.removeEventListener('mousedown',onDown); document.removeEventListener('keydown',onKey); };
  },[open,onClose]);
  return ref;
};

/* ── Lock body scroll while an overlay is open ── */
const useScrollLock=locked=>{
  useEffect(()=>{
    if(!locked) return;
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    return()=>{ document.body.style.overflow=prev; };
  },[locked]);
};

/* ── Trap focus inside an overlay (a11y) ── */
const useFocusTrap=(open,ref)=>{
  useEffect(()=>{
    if(!open||!ref.current) return;
    const node=ref.current;
    const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
    const first=node.querySelectorAll(sel)[0];
    first?.focus?.();
    const onKey=e=>{
      if(e.key!=='Tab') return;
      const f=[...node.querySelectorAll(sel)].filter(el=>!el.disabled&&el.offsetParent!==null);
      if(!f.length) return;
      const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); }
      else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); }
    };
    node.addEventListener('keydown',onKey);
    return()=>node.removeEventListener('keydown',onKey);
  },[open,ref]);
};

/* ── Async data loader with loading / error / refetch ── */
const useAsync=(fn,deps=[])=>{
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [nonce,setNonce]=useState(0);
  useEffect(()=>{
    let alive=true;
    setLoading(true); setError(null);
    Promise.resolve(fn())
      .then(d=>{ if(alive){ setData(d); setLoading(false); } })
      .catch(e=>{ if(alive){ setError(e); setLoading(false); } });
    return()=>{ alive=false; };
  },[...deps,nonce]);
  return {data,loading,error,refetch:()=>setNonce(n=>n+1),setData};
};

/* ── Persisted state (safe if storage is unavailable) ── */
const usePersisted=(key,initial)=>{
  const [v,setV]=useState(()=>{
    try{ const raw=localStorage.getItem(`qx.${key}`); return raw?JSON.parse(raw):initial; }
    catch{ return initial; }
  });
  useEffect(()=>{
    try{ localStorage.setItem(`qx.${key}`,JSON.stringify(v)); }catch{}
  },[key,v]);
  return [v,setV];
};

/* ── Global hotkeys. map: {'ctrl+k':fn,'esc':fn,'g d':fn} ── */
const useHotkeys=(map,enabled=true)=>{
  const seq=useRef({key:'',at:0});
  useEffect(()=>{
    if(!enabled) return;
    const onKey=e=>{
      const tag=(e.target.tagName||'').toLowerCase();
      const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
      const k=e.key.toLowerCase();
      const combo=`${e.ctrlKey||e.metaKey?'ctrl+':''}${e.shiftKey?'shift+':''}${k==='escape'?'esc':k}`;
      if(map[combo]){ e.preventDefault(); map[combo](e); seq.current={key:'',at:0}; return; }
      if(typing) return;
      // two-key sequences e.g. "g d"
      const now=Date.now();
      if(seq.current.key&&now-seq.current.at<900){
        const pair=`${seq.current.key} ${k}`;
        if(map[pair]){ e.preventDefault(); map[pair](e); seq.current={key:'',at:0}; return; }
      }
      seq.current=/^[a-z]$/.test(k)?{key:k,at:now}:{key:'',at:0};
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[map,enabled]);
};


/* ── Debounced value (search inputs) ── */
const useDebounced=(value,ms=220)=>{
  const [v,setV]=useState(value);
  useEffect(()=>{ const t=setTimeout(()=>setV(value),ms); return()=>clearTimeout(t); },[value,ms]);
  return v;
};

/* ── setInterval that respects re-renders (live tickers) ── */
const useInterval=(fn,ms)=>{
  const saved=useRef(fn);
  useEffect(()=>{ saved.current=fn; },[fn]);
  useEffect(()=>{
    if(ms==null) return;
    const id=setInterval(()=>saved.current(),ms);
    return()=>clearInterval(id);
  },[ms]);
};

/* ── Copy to clipboard with transient "copied" flag ── */
const useCopy=(ms=1600)=>{
  const [copied,setCopied]=useState(false);
  const copy=useCallback(async text=>{
    try{ await navigator.clipboard.writeText(text); }
    catch{
      const ta=document.createElement('textarea');
      ta.value=text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch{}
      document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(()=>setCopied(false),ms);
  },[ms]);
  return [copied,copy];
};

const Modal=({open,onClose,title,sub,icon='◆',size='',children,footer,closeOnOverlay=true})=>{

    const onKey=e=>{ if(e.key==='Escape') onClose(); };

    return()=>document.removeEventListener('keydown',onKey);
  },[open,onClose]);

    <div className="ov" onMouseDown={e=>{ if(closeOnOverlay&&e.target===e.currentTarget) onClose(); }}>

/* ══════════════════════════════════════════════
   TOAST SYSTEM
   Global bus so any component can call toast.success(...)
   without prop-drilling. Upgrades the single v5 .toast.
══════════════════════════════════════════════ */
const ToastBus=(()=>{
  let listeners=[];
  const emit=t=>listeners.forEach(l=>l(t));
  const push=(tone,title,message)=>emit({id:uid(),tone,title,message});
  return{
    subscribe(fn){ listeners.push(fn); return()=>{ listeners=listeners.filter(l=>l!==fn); }; },
    success:(t,m)=>push('ok',t,m),
    error:  (t,m)=>push('err',t,m),
    warn:   (t,m)=>push('warn',t,m),
    info:   (t,m)=>push('info',t,m),
  };
})();
const toast=ToastBus;

const TOAST_ICON={ok:'✓',err:'✕',warn:'⚠',info:'ℹ'};

const ToastHost=({duration=4200})=>{
  const [items,setItems]=useState([]);
  useEffect(()=>ToastBus.subscribe(t=>{
    setItems(p=>[...p,t].slice(-4));
    setTimeout(()=>setItems(p=>p.filter(x=>x.id!==t.id)),duration);
  }),[duration]);
  const dismiss=id=>setItems(p=>p.filter(x=>x.id!==id));
  if(!items.length) return null;
  return(
    <div className="toast-stack" role="status" aria-live="polite">
      {items.map(t=>(
        <div key={t.id} className={cx('toast-i',t.tone)}>
          <span className="toast-ico">{TOAST_ICON[t.tone]}</span>
          <div style={{flex:1,minWidth:0}}>
            <div className="toast-t">{t.title}</div>
            {t.message&&<div className="toast-m">{t.message}</div>}
          </div>
          <button className="toast-x" onClick={()=>dismiss(t.id)} aria-label="Dismiss">✕</button>
        </div>
      ))}
    </div>
  );
};

/* ── Bottom drawer (mobile "More" sheet) ── */
const Drawer=({open,onClose,title,children})=>{

const PwMeter=({value})=>{

/* ══════════════════════════════════════════════
   QUANTORYX v6 — COMMAND PALETTE (Ctrl + K)
   Fulfils the "Ctrl + K" affordance already rendered in the
   v5 Header (.hd-kbd) which previously had no global handler.
   Searches pages, strategies, reports and actions.
══════════════════════════════════════════════ */

const CMD_ACTIONS=[
  {id:'a-newbt',   group:'Actions',icon:'▶',label:'Run a new backtest',      sub:'Open the backtest configurator', go:'backtest'},
  {id:'a-opt',     group:'Actions',icon:'⚙',label:'Optimize parameters',     sub:'Grid & genetic search',          go:'optimize'},
  {id:'a-ai',      group:'Actions',icon:'🤖',label:'Ask the AI assistant',    sub:'Market analysis & setups',       go:'ai'},
  {id:'a-build',   group:'Actions',icon:'🧱',label:'Build a new strategy',    sub:'Visual strategy builder',        go:'builder'},
  {id:'a-alert',   group:'Actions',icon:'🔔',label:'Create a price alert',    sub:'Price, risk & indicator alerts', go:'alerts'},
  {id:'a-journal', group:'Actions',icon:'📓',label:'Add a journal entry',     sub:'Log a trade and reflection',     go:'journal'},
  {id:'a-theme',   group:'Actions',icon:'🌗',label:'Toggle dark / light mode',sub:'Switch the interface theme',     act:'theme'},
  {id:'a-help',    group:'Actions',icon:'❓',label:'Help & documentation',    sub:'Guides, FAQ and shortcuts',      go:'help'},
];

const CommandPalette=({open,onClose,go,onToggleTheme,pages=[],strategies=[],reports=[]})=>{
  const [q,setQ]=useState('');
  const [idx,setIdx]=useState(0);
  const inputRef=useRef(null);
  const listRef=useRef(null);

  useScrollLock(open);
  useEffect(()=>{ if(open){ setQ(''); setIdx(0); setTimeout(()=>inputRef.current?.focus(),40); } },[open]);

  /* Build the searchable index from live app data — no duplication */
  const items=useMemo(()=>{
    const nav=pages.map(p=>({id:`p-${p.id}`,group:'Navigation',icon:p.icon,label:p.label,sub:'Jump to page',go:p.id}));
    const strat=strategies.map(s=>({id:`s-${s.id}`,group:'Strategies',icon:'📋',label:s.name,sub:`${s.type} · Sharpe ${s.sharpe} · ${s.ret}`,go:'strategies'}));
    const rep=reports.map(r=>({id:`r-${r.id}`,group:'Reports',icon:r.icon,label:r.name,sub:`${r.date} · ${r.type} · ${r.size}`,go:'reports'}));
    return [...nav,...CMD_ACTIONS,...strat,...rep];
  },[pages,strategies,reports]);

  const filtered=useMemo(()=>{
    if(!q.trim()) return items.slice(0,14);
    return items.filter(i=>fuzzy(q,i.label)||fuzzy(q,i.sub||'')||fuzzy(q,i.group)).slice(0,24);
  },[items,q]);

  useEffect(()=>{ setIdx(0); },[q]);

  const run=useCallback(item=>{
    if(!item) return;
    onClose();
    if(item.act==='theme') onToggleTheme?.();
    else if(item.go) go(item.go);
  },[go,onClose,onToggleTheme]);

  const onKey=e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); setIdx(i=>Math.min(i+1,filtered.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setIdx(i=>Math.max(i-1,0)); }
    else if(e.key==='Enter'){ e.preventDefault(); run(filtered[idx]); }
    else if(e.key==='Escape'){ e.preventDefault(); onClose(); }
  };

  /* keep the active row in view */
  useEffect(()=>{
    const el=listRef.current?.querySelector('.cp-item.on');
    el?.scrollIntoView({block:'nearest'});
  },[idx]);

  if(!open) return null;

  let lastGroup=null;
  return(
    <div className="ov" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="cp-w" role="dialog" aria-modal="true" aria-label="Command palette">
        <div className="cp-inp-w">
          <span className="cp-inp-ico">🔍</span>
          <input ref={inputRef} className="cp-inp" placeholder="Search pages, strategies, reports, actions…"
            value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKey}
            aria-label="Search commands" autoComplete="off"/>
          <Kbd>Esc</Kbd>
        </div>

        <div className="cp-list" ref={listRef}>
          {filtered.length===0&&(
            <div style={{padding:'26px 16px',textAlign:'center'}}>
              <div style={{fontSize:26,marginBottom:8}}>🔍</div>
              <div style={{fontSize:12.5,fontWeight:600,color:'var(--tx-1)'}}>No results for “{q}”</div>
              <div style={{fontSize:11,color:'var(--tx-3)',marginTop:4}}>Try a page name, strategy, or action.</div>
            </div>
          )}
          {filtered.map((it,i)=>{
            const head=it.group!==lastGroup?(lastGroup=it.group):null;
            return(
              <React.Fragment key={it.id}>
                {head&&<div className="cp-grp">{head}</div>}
                <button className={cx('cp-item',i===idx&&'on')}
                  onMouseEnter={()=>setIdx(i)} onClick={()=>run(it)}>
                  <span className="cp-item-ico">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}>
                    <span className="cp-item-nm"><Highlight text={it.label} q={q}/></span>
                    {it.sub&&<span className="cp-item-sub" style={{display:'block'}}>{it.sub}</span>}
                  </span>
                  {i===idx&&<span className="cp-item-kbd"><Kbd>↵</Kbd></span>}
                </button>
              </React.Fragment>
            );
          })}
        </div>

        <div className="cp-ft">
          <span className="cp-ft-k"><Kbd>↑</Kbd><Kbd>↓</Kbd> navigate</span>
          <span className="cp-ft-k"><Kbd>↵</Kbd> select</span>
          <span className="cp-ft-k"><Kbd>Esc</Kbd> close</span>
          <span style={{marginLeft:'auto'}}>{filtered.length} result{filtered.length===1?'':'s'}</span>
        </div>
      </div>
    </div>
  );
};

/* ── Runtime error boundary ── */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null,info:null,key:p.resetKey}; }
  static getDerivedStateFromError(err){ return {err}; }
  /* Clear the error when the route changes, otherwise one crashing
     page would keep the fallback pinned across every later navigation. */
  static getDerivedStateFromProps(props,state){
    if(props.resetKey!==state.key) return {key:props.resetKey,err:null,info:null};
    return null;
  }
  componentDidCatch(err,info){
    this.setState({info});
    log.error('render','Uncaught error in component tree',
      {error:err?.message,stack:String(err?.stack||'').split('\n').slice(0,4).join(' | '),
       component:String(info?.componentStack||'').trim().split('\n')[0]});
  }
  render(){
    if(!this.state.err) return this.props.children;
    return(
      <div className="page fade-page">
        <div className="err-page">
          <div style={{fontSize:44}}>💥</div>
          <div className="err-ttl">Something broke while rendering</div>
          <div className="err-sub">
            The interface hit an unexpected error. Your data is safe — reloading the module usually clears it.
          </div>

const ForgotPassword=({onBack})=>{
  const [email,setEmail]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [sent,setSent]=useState(false);

  const submit=async()=>{
    if(!isEmail(email)){ setErr('Enter a valid email address.'); return; }
    setErr(''); setLoading(true);
    await api.auth.forgot(email);
    setLoading(false); setSent(true);
  };

  return(
    <div className="login-page">
      <div className="login-glow" style={{width:400,height:400,background:'rgba(139,92,246,.07)',top:-100,right:-100}}/>
      <div className="login-glow" style={{width:300,height:300,background:'rgba(59,130,246,.05)',bottom:-80,left:-80}}/>
      <div className="login-card">
        <div style={{textAlign:'center',marginBottom:24}}>
          <div className="login-logo-ico">Q</div>
          <div className="login-title">{sent?'Check your inbox':'Reset your password'}</div>
          <div className="login-sub">{sent?'We sent you a secure reset link':'We’ll email you a link to set a new one'}</div>
        </div>

        {sent?(
          <>
            <div style={{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.22)',borderRadius:8,padding:'12px 14px',fontSize:12,color:'var(--tx-ok)',lineHeight:1.7}}>
              ✓ If an account exists for <strong>{email}</strong>, a reset link is on its way. The link expires in 30 minutes.
            </div>
            <button className="btn btn-p btn-full" style={{padding:10,fontSize:14,marginTop:14}} onClick={onBack}>
              ← Back to sign in
            </button>
          </>
        ):(
          <>
            {err&&<div className="login-err">⚠️ {err}</div>}
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label className="form-lbl">Email Address</label>
                <input className={cx('login-inp',err&&'inp-err')} type="email" placeholder="your@email.com"

              <button className="btn btn-p btn-full" style={{padding:10,fontSize:14,marginTop:6}} onClick={submit} disabled={loading}>
                {loading?<><Spinner/> Sending link…</>:'Send reset link'}

              <button className="btn btn-g btn-full" style={{padding:9}} onClick={onBack}>← Back to sign in</button>

        )}

    </div>
  );
};

const SparkLine = ({ data, color = '#8b5cf6', height = 40 }) => {
  if (!data || data.length < 2) return null;
  const vals = data.map(d => d.equity ?? d.value ?? d ?? 0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const w = 100, h = height;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / range) * h}`).join(' ');
  return React.createElement('svg', { width: '100%', height, viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none', style: { display: 'block' } },
    React.createElement('polyline', { points: pts, fill: 'none', stroke: color, strokeWidth: 1.5, strokeLinejoin: 'round', strokeLinecap: 'round' })
  );
};

/* ══════════════ BACKTEST ══════════════ */
const LiveBacktestPage=({go})=>{
  const {symbols,timeframes}=useMarketMeta();
  const {data:strats}=useAsync(()=>api.strategies.list(),[]);
  const [cfg,setCfg]=useState(()=>{
    let s='RSI'; try{ s=sessionStorage.getItem('qx.bt.strategy')||'RSI'; }catch{}
    return {strategy:s,symbol:'EURUSD',timeframe:'1H'};
  });
  const [res,setRes]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const set=k=>e=>setCfg(p=>({...p,[k]:e.target.value}));

  const run=async()=>{
    setBusy(true); setErr(null);
    try{
      const r=await api.backtest.run(cfg);
      setRes(r);
      toast.success('Backtest complete',`${r.trades} trades · Sharpe ${r.sharpe.toFixed(2)}`);
    }catch(e){ setErr(e); toast.error('Backtest failed',e.message); }
    finally{ setBusy(false); }

  const kpis=res?[

    {l:'Profit Factor',v:res.profitFactor.toFixed(3),c:res.profitFactor>=1?'ok':'err'},
    {l:'Max Drawdown',v:res.maxDrawdown.toFixed(4),c:'err'},
    {l:'Win Rate',v:`${res.winRate.toFixed(2)}%`,c:res.winRate>=50?'ok':'err'},
    {l:'Sharpe Ratio',v:res.sharpe.toFixed(3),c:res.sharpe>=0?'ok':'err'},
    {l:'Total Trades',v:fmtNum(res.trades),c:'neu'},
  ]:[];

  return(
    <div className="page fade-page">
      <PageHd title="Backtest" sub="Run the backend simulation engine on historical data"/>
      <div className="bt-layout">
        <div className="bt-form card card-p">

              {(strats||[]).map(s=><option key={s.key} value={s.key}>{s.name}</option>)}

          <div className="form-grp">
            <label className="form-lbl">Symbol</label>
            <select className="form-sel" value={cfg.symbol} onChange={set('symbol')}>
              {symbols.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Timeframe</label>
            <select className="form-sel" value={cfg.timeframe} onChange={set('timeframe')}>

            POST <code style={{fontFamily:'JetBrains Mono,monospace'}}>/api/backtest</code> — executes on the live engine.

/* ══════════════ OPTIMIZE (Celery-backed) ══════════════ */
const LiveOptimizePage=({go})=>{
  const {symbols,timeframes}=useMarketMeta();
  const {data:strats}=useAsync(()=>api.strategies.list(),[]);
  const [cfg,setCfg]=useState({strategy:'RSI',symbol:'EURUSD',timeframe:'1H'});
  const [task,setTask]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const set=k=>e=>setCfg(p=>({...p,[k]:e.target.value}));

  const run=async(kind)=>{
    setBusy(true); setErr(null); setTask(null);
    try{
      const r=kind==='wf'?await api.walkForward.run(cfg):await api.optimize.run(cfg);
      setTask(r);
      toast.success('Job queued',r.task_id?`Task ${r.task_id}`:'Dispatched to worker.');
    }catch(e){ setErr(e); toast.error('Could not queue job',e.message); }
    finally{ setBusy(false); }
  };

  const celeryDown=err&&/celery|redis|reconnect|result store/i.test(err.message||'');

  return(
    <div className="page fade-page">
      <PageHd title="Optimization" sub="Grid search and walk-forward validation via the backend task queue"/>

      {celeryDown&&(
        <div className="card card-p" style={{borderColor:'rgba(245,158,11,.3)',background:'rgba(245,158,11,.05)'}}>
          <div className="row" style={{gap:10,alignItems:'flex-start'}}>
            <span style={{fontSize:18}}>⚠</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12.5,fontWeight:700,color:'var(--tx-1)'}}>Task queue unavailable</div>
              <div style={{fontSize:11,color:'var(--tx-2)',marginTop:4,lineHeight:1.7}}>
                Optimization and walk-forward are dispatched to Celery and need Redis running.
                Start them with:
                <div className="code-prev" style={{marginTop:8}}>{`redis-server &\ncelery -A backend.tasks.celery_app worker --loglevel=info`}</div>
              </div>
            </div>
          </div>
        </div>
      )}

      <div className="bt-layout">
        <div className="bt-form card card-p">
          <div className="bt-form-title">Job Configuration</div>
          <div className="form-grp">
            <label className="form-lbl">Strategy</label>
            <select className="form-sel" value={cfg.strategy} onChange={set('strategy')}>
              {(strats||[]).map(s=><option key={s.key} value={s.key}>{s.name}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Symbol</label>
            <select className="form-sel" value={cfg.symbol} onChange={set('symbol')}>
              {symbols.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Timeframe</label>
            <select className="form-sel" value={cfg.timeframe} onChange={set('timeframe')}>
              {timeframes.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <button className="btn btn-p btn-full" style={{padding:9,marginTop:6}} onClick={()=>run('opt')} disabled={busy}>
            {busy?<><Spinner/> Queuing…</>:'⚙ Run Optimization'}
          </button>
          <button className="btn btn-g btn-full" style={{padding:9}} onClick={()=>run('wf')} disabled={busy}>
            🔄 Run Walk-Forward
          </button>
        </div>

        <div className="bt-results">
          {task?(
            <div className="card card-p">
              <div className="card-hd"><div className="card-title">✅ Job accepted</div></div>
              <div className="code-prev">{JSON.stringify(task,null,2)}</div>
              {task.task_id&&(
                <button className="btn btn-g btn-sm" style={{marginTop:10}}
                  onClick={async()=>{ try{ const s=await api.optimize.task(task.task_id);
                    toast.info('Task status',JSON.stringify(s).slice(0,120)); }
                    catch(e){ toast.error('Poll failed',e.message); } }}>
                  ↻ Poll status
                </button>
              )}
            </div>
          ):!err&&(
            <div className="card card-p">
              <Empty icon="⚙" title="No job running"
                sub="Queue an optimization or walk-forward run. Results are computed asynchronously by the worker."/>
            </div>
          )}
          {err&&!celeryDown&&<div className="card card-p"><Empty icon="⚠" title="Job failed" sub={err.message}/></div>}
        </div>
      </div>
    </div>
  );
};

const AI_SUGGESTIONS=[
  {icon:'📊',label:'Analyse EUR/USD',   symbol:'EURUSD',tf:'1H'},
  {icon:'🎯',label:'Best setup on GBP/USD',symbol:'GBPUSD',tf:'1H'},
  {icon:'🌐',label:'USD/JPY 4H regime', symbol:'USDJPY',tf:'4H'},
  {icon:'🛡',label:'AUD/USD daily risk',symbol:'AUDUSD',tf:'1D'},
];

const LiveAIPage=({go})=>{
  const {symbols,timeframes}=useMarketMeta();
  const [msgs,setMsgs]=useState([]);
  const [busy,setBusy]=useState(false);
  const [sel,setSel]=useState({symbol:'EURUSD',timeframe:'1H'});
  const [state,setState]=useState(null);
  const endRef=useRef(null);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,busy]);

  const ask=async(symbol,timeframe)=>{
    const s=symbol||sel.symbol, tf=timeframe||sel.timeframe;
    setSel({symbol:s,timeframe:tf});
    setMsgs(m=>[...m,{role:'user',text:`Analyse ${s} on ${tf}`,t:Date.now()}]);
    setBusy(true);
    try{
      const r=await api.ai.analyse({symbol:s,timeframe:tf});
      setState(r);
      setMsgs(m=>[...m,{role:'ai',data:r,t:Date.now()}]);
    }catch(e){
      setMsgs(m=>[...m,{role:'error',text:e.message,t:Date.now()}]);
      toast.error('AI analysis failed',e.message);
    }finally{ setBusy(false); }
  };

  const actionColor=a=>a==='EXECUTE'?'var(--tx-ok)':a==='REJECT'?'var(--tx-err)':'var(--tx-wrn)';

  return(
    <div className="page fade-page">
      <PageHd title="AI Assistant" sub="Live decision engine — regime, strategy selection, confidence and rationale">
        <select className="sel-sm" value={sel.symbol} onChange={e=>setSel(s=>({...s,symbol:e.target.value}))}>
          {symbols.map(o=><option key={o}>{o}</option>)}
        </select>
        <select className="sel-sm" value={sel.timeframe} onChange={e=>setSel(s=>({...s,timeframe:e.target.value}))}>
          {timeframes.map(o=><option key={o}>{o}</option>)}
        </select>
        <button className="btn btn-p btn-sm" onClick={()=>ask()} disabled={busy}>
          {busy?<><Spinner/> Analysing…</>:'⚡ Run Analysis'}
        </button>
      </PageHd>

      <div className="charts-grid" style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:16,alignItems:'start'}}>
        <div className="card card-p" style={{minHeight:440,display:'flex',flexDirection:'column'}}>
          <div className="chat-msgs" style={{flex:1,overflowY:'auto',maxHeight:'56vh',paddingRight:4}}>
            {msgs.length===0&&!busy&&(
              <Empty icon="🤖" title="Ask the decision engine"
                sub="Pick an instrument and timeframe, then run an analysis. The backend classifies the market regime, selects a strategy, scores confidence, and explains its reasoning."/>
            )}

            {msgs.map((m,i)=>(
              <div key={i} className="msg-row" style={{marginBottom:16}}>
                {m.role==='user'&&(
                  <div style={{display:'flex',justifyContent:'flex-end'}}>
                    <div className="bubble" style={{background:'var(--grad-brand)',color:'#fff',
                      padding:'9px 14px',borderRadius:14,fontSize:12.5,maxWidth:'75%'}}>{m.text}</div>
                  </div>
                )}
                {m.role==='error'&&(
                  <div className="card card-p" style={{borderColor:'rgba(239,68,68,.3)',background:'rgba(239,68,68,.05)'}}>
                    <div style={{fontSize:12,color:'var(--tx-err)'}}>⚠ {m.text}</div>
                  </div>
                )}
                {m.role==='ai'&&(
                  <div className="msg-grp">
                    <div className="msg-meta" style={{display:'flex',alignItems:'center',gap:7,marginBottom:6}}>
                      <span className="msg-av" style={{width:22,height:22,borderRadius:6,background:'var(--grad-accent)',
                        display:'flex',alignItems:'center',justifyContent:'center',fontSize:11}}>🤖</span>
                      <span className="msg-nm" style={{fontSize:11.5,fontWeight:700,color:'var(--tx-1)'}}>Quantoryx AI</span>
                      <span className="ai-badge">decision engine</span>
                      <span style={{fontSize:10,color:'var(--tx-3)',marginLeft:'auto'}}>{fmtTime(m.t)}</span>
                    </div>

                    <div className="card card-p" style={{background:'var(--bg-base)'}}>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:12}}>
                        {[['Action',m.data.action,actionColor(m.data.action)],
                          ['Confidence',`${m.data.confidence.toFixed(1)}%`,'var(--tx-1)'],
                          ['Regime',m.data.regime,'var(--tx-1)'],
                          ['Strategy',m.data.strategy,'var(--pu-400)']].map(([l,v,c])=>(
                          <div key={l}>
                            <div className="micro-lbl">{l}</div>
                            <div style={{fontSize:13,fontWeight:700,color:c}}>{v}</div>
                          </div>
                        ))}
                      </div>
                      <div className="conf-bar"><div className="conf-fill" style={{width:`${m.data.confidence}%`}}/></div>
                      <div style={{fontSize:11.5,color:'var(--tx-2)',lineHeight:1.8,marginTop:12,whiteSpace:'pre-wrap'}}>
                        {m.data.explanation}
                      </div>
                      <div style={{display:'flex',gap:8,marginTop:12}}>
                        <button className="btn btn-g btn-sm" onClick={()=>{
                          try{ sessionStorage.setItem('qx.bt.strategy',m.data.strategy);}catch{}
                          go('backtest');
                        }}>▶ Backtest {m.data.strategy}</button>
                        <CopyBtn text={m.data.explanation} label="Copy rationale"/>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))}

            {busy&&(
              <div className="row" style={{gap:8,color:'var(--tx-3)',fontSize:12}}>
                <Spinner dark/> Running regime detection and strategy selection…
              </div>
            )}
            <div ref={endRef}/>
          </div>

          <div className="prompts" style={{display:'flex',flexWrap:'wrap',gap:7,paddingTop:12,borderTop:'1px solid var(--bd)'}}>
            {AI_SUGGESTIONS.map(s=>(
              <button key={s.label} className="prompt-chip" onClick={()=>ask(s.symbol,s.tf)} disabled={busy}>
                {s.icon} {s.label}
              </button>
            ))}
          </div>
        </div>

        {/* ── Insight rail ── */}
        <div className="stack" style={{gap:14}}>
          <div className="card card-p">
            <div className="card-hd"><div className="card-title">📊 Latest Signal</div></div>
            {state?(
              <>
                <div className="ins-card">
                  <div className="ins-lbl">Decision</div>
                  <div className="ins-val" style={{color:actionColor(state.action)}}>{state.action}</div>
                </div>
                <div className="ins-card" style={{marginTop:8}}>
                  <div className="ins-lbl">Confidence</div>
                  <div className="ins-val">{state.confidence.toFixed(1)}%</div>
                  <div className="conf-bar" style={{marginTop:6}}><div className="conf-fill" style={{width:`${state.confidence}%`}}/></div>
                </div>
                <div className="ins-card" style={{marginTop:8}}>
                  <div className="ins-lbl">Market Regime</div>
                  <div className="ins-val" style={{fontSize:15}}>{state.regime}</div>
                </div>
                <div className="ins-card" style={{marginTop:8}}>
                  <div className="ins-lbl">Selected Strategy</div>
                  <div className="ins-val" style={{fontSize:15,color:'var(--pu-400)'}}>{state.strategy}</div>
                </div>
              </>
            ):<Empty icon="📡" title="No analysis yet" sub="Run an analysis to populate live engine output."/>}
          </div>

          <div className="card card-p">
            <div className="card-hd"><div className="card-title">🔗 Engine</div></div>
            <div style={{fontSize:11,color:'var(--tx-2)',lineHeight:1.8}}>
              Powered by <code style={{fontFamily:'JetBrains Mono,monospace'}}>POST /api/ai-analysis</code><br/>
              Pipeline: regime detector → strategy selector → confidence model → explanation engine.
            </div>
            <button className="btn btn-g btn-sm btn-full" style={{marginTop:10}} onClick={()=>go('regime')}>
              🌐 View regime analysis
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/pages/LiveSettingsPage.js             ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — LIVE SETTINGS
   GET/PUT /api/portfolio/settings · PUT /api/auth/profile
   POST /api/auth/change-password · GET /api/auth/me
   Reuses v5 .settings-* classes and the Toggle primitive.
══════════════════════════════════════════════ */

const LiveSettingsPage=({dark,toggleTheme,user,onUserUpdate})=>{
  const {symbols,timeframes}=useMarketMeta();
  const st=useAsync(()=>api.portfolio.settings(),[]);
  const [section,setSection]=useState('profile');
  const [form,setForm]=useState(null);
  const [profile,setProfile]=useState({name:user?.name||'',email:user?.email||''});
  const [pw,setPw]=useState({old:'',next:'',confirm:''});
  const [saving,setSaving]=useState(false);
  const [errs,setErrs]=useState({});

  useEffect(()=>{ if(st.data) setForm(st.data); },[st.data]);
  useEffect(()=>{ if(user) setProfile({name:user.name||'',email:user.email||''}); },[user]);

  const nav=[
    {id:'profile',icon:'👤',label:'Profile'},
    {id:'trading',icon:'⚙',label:'Trading'},
    {id:'appearance',icon:'🎨',label:'Appearance'},
    {id:'security',icon:'🛡',label:'Security'},
    {id:'system',icon:'📡',label:'System'},
  ];

  const saveTrading=async()=>{
    setSaving(true);
    try{
      const saved=await api.portfolio.saveSettings(form);
      setForm(saved);
      toast.success('Settings saved','Trading preferences updated on the backend.');
    }catch(e){ toast.error('Save failed',e.message); }
    finally{ setSaving(false); }
  };

  const saveProfile=async()=>{
    const e={};
    if(!profile.name.trim()) e.name='Name cannot be empty.';
    if(!isEmail(profile.email)) e.email='Enter a valid email address.';
    setErrs(e); if(Object.keys(e).length) return;
    setSaving(true);
    try{
      const u=await api.auth.updateProfile(profile);
      onUserUpdate?.(u);
      toast.success('Profile updated','Your details were saved.');
    }catch(err){ toast.error('Update failed',err.message); }
    finally{ setSaving(false); }
  };

  const changePw=async()=>{
    const e={};
    if(!pw.old) e.old='Enter your current password.';
    if(pwStrength(pw.next)<2) e.next='Choose a stronger password.';
    if(pw.next!==pw.confirm) e.confirm='Passwords do not match.';
    setErrs(e); if(Object.keys(e).length) return;
    setSaving(true);
    try{
      await api.auth.changePassword(pw.old,pw.next);
      setPw({old:'',next:'',confirm:''});
      toast.success('Password changed','Use your new password next time you sign in.');
    }catch(err){ toast.error('Change failed',err.message); }
    finally{ setSaving(false); }
  };

  const isAdmin=api.isAdmin();
  const sys=useAsync(()=>Promise.all([
    api.system.health().catch(e=>({error:e.message})),
    api.system.version().catch(e=>({error:e.message})),
    api.system.status().catch(e=>({error:e.message})),
    isAdmin?api.system.systemHealth().catch(e=>({error:e.message})):Promise.resolve(null),
  ]),[isAdmin]);

  return(
    <div className="page fade-page">
      <PageHd title="Settings" sub="Profile, trading preferences, and platform configuration"/>

      <div className="settings-layout">
        <div className="settings-nav">
          {nav.map(n=>(
            <button key={n.id} className={cx('settings-nav-item',section===n.id&&'on')} onClick={()=>setSection(n.id)}>
              <span>{n.icon}</span>{n.label}
            </button>
          ))}
        </div>

        <div className="settings-body">
          {/* ── Profile ── */}
          {section==='profile'&&(
            <div className="settings-section">
              <div className="settings-section-title">Profile Information</div>
              <div className="settings-section-sub">Synced with <code style={{fontFamily:'JetBrains Mono,monospace'}}>/api/auth/me</code>.</div>
              <div className="avatar-upload" style={{display:'flex',gap:14,alignItems:'center',margin:'14px 0'}}>
                <div className="avatar-lg">{(profile.name||'A').charAt(0).toUpperCase()}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--tx-1)'}}>{user?.name||'—'}</div>
                  <div style={{fontSize:11,color:'var(--tx-3)',marginTop:2}}>
                    {user?.role||'user'} · {user?.plan||'Pro'} plan
                  </div>
                  <div style={{fontSize:10,color:'var(--tx-3)',marginTop:2,fontFamily:'JetBrains Mono,monospace'}}>
                    id: {user?.id?.slice(0,8)}…
                  </div>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div className="form-grp">
                  <label className="form-lbl">Full Name</label>
                  <input className={cx('form-inp',errs.name&&'inp-err')} aria-label="Full name" value={profile.name}
                    onChange={e=>setProfile(p=>({...p,name:e.target.value}))}/>
                  <FieldError>{errs.name}</FieldError>
                </div>
                <div className="form-grp">
                  <label className="form-lbl">Email</label>
                  <input className={cx('form-inp',errs.email&&'inp-err')} aria-label="Email address" value={profile.email}
                    onChange={e=>setProfile(p=>({...p,email:e.target.value}))}/>
                  <FieldError>{errs.email}</FieldError>
                </div>
                <div className="form-grp">
                  <label className="form-lbl">Username</label>
                  <input className="form-inp" aria-label="Username (read only)" value={user?.username||''} disabled/>
                </div>
                <div className="form-grp">
                  <label className="form-lbl">Role</label>
                  <input className="form-inp" aria-label="Role (read only)" value={user?.role||''} disabled/>
                </div>
              </div>
              <button className="btn btn-p btn-md" style={{marginTop:14}} onClick={saveProfile} disabled={saving}>
                {saving?<><Spinner/> Saving…</>:'💾 Save Profile'}
              </button>
            </div>
          )}

          {/* ── Trading ── */}
          {section==='trading'&&(
            <div className="settings-section">
              <div className="settings-section-title">Trading Preferences</div>
              <div className="settings-section-sub">
                Persisted via <code style={{fontFamily:'JetBrains Mono,monospace'}}>PUT /api/portfolio/settings</code>.
              </div>
              {st.loading||!form?<SkelText lines={6}/>:(
                <>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:12}}>
                    <div className="form-grp">
                      <label className="form-lbl">Default Symbol</label>
                      <select className="form-sel" value={form.symbol}
                        onChange={e=>setForm(f=>({...f,symbol:e.target.value}))}>
                        {symbols.map(o=><option key={o}>{o}</option>)}
                      </select>
                    </div>
                    <div className="form-grp">
                      <label className="form-lbl">Default Timeframe</label>
                      <select className="form-sel" value={form.timeframe}
                        onChange={e=>setForm(f=>({...f,timeframe:e.target.value}))}>
                        {timeframes.map(o=><option key={o}>{o}</option>)}
                      </select>
                    </div>
                    {[['Risk per trade (%)','riskPerTrade'],['Leverage','leverage'],
                      ['Spread','spread'],['AI confidence threshold','confidenceThreshold']].map(([l,k])=>(
                      <div key={k} className="form-grp">
                        <label className="form-lbl">{l}</label>
                        <input className="form-inp" type="number" step="any" aria-label={l} value={form[k]}
                          onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}/>
                      </div>
                    ))}
                  </div>
                  <button className="btn btn-p btn-md" style={{marginTop:14}} onClick={saveTrading} disabled={saving}>
                    {saving?<><Spinner/> Saving…</>:'💾 Save Trading Settings'}
                  </button>
                </>
              )}
            </div>
          )}

          {/* ── Appearance ── */}
          {section==='appearance'&&(
            <div className="settings-section">
              <div className="settings-section-title">Appearance</div>
              <div className="settings-section-sub">Stored locally in your browser.</div>
              <div className="settings-row" style={{display:'flex',alignItems:'center',padding:'12px 0',borderBottom:'1px solid var(--bd)'}}>
                <div style={{flex:1}}>
                  <div className="settings-row-lbl">Dark mode</div>
                  <div className="settings-row-sub">Toggle between the dark and light theme</div>
                </div>
                <Toggle on={dark} onChange={toggleTheme}/>
              </div>
            </div>
          )}

          {/* ── Security ── */}
          {section==='security'&&(
            <div className="settings-section">
              <div className="settings-section-title">Security</div>
              <div className="settings-section-sub">
                JWT access + refresh tokens. Changing your password revokes existing sessions.
              </div>
              <div style={{display:'grid',gap:12,maxWidth:420,marginTop:12}}>
                <div className="form-grp">
                  <label className="form-lbl">Current Password</label>
                  <input className={cx('form-inp',errs.old&&'inp-err')} type="password" aria-label="Current password" autoComplete="current-password" value={pw.old}
                    onChange={e=>setPw(p=>({...p,old:e.target.value}))}/>
                  <FieldError>{errs.old}</FieldError>
                </div>
                <div className="form-grp">
                  <label className="form-lbl">New Password</label>
                  <input className={cx('form-inp',errs.next&&'inp-err')} type="password" aria-label="New password" autoComplete="new-password" value={pw.next}
                    onChange={e=>setPw(p=>({...p,next:e.target.value}))}/>
                  <PwMeter value={pw.next}/>
                  <FieldError>{errs.next}</FieldError>
                </div>
                <div className="form-grp">
                  <label className="form-lbl">Confirm New Password</label>
                  <input className={cx('form-inp',errs.confirm&&'inp-err')} type="password" aria-label="Confirm new password" autoComplete="new-password" value={pw.confirm}
                    onChange={e=>setPw(p=>({...p,confirm:e.target.value}))}/>
                  <FieldError>{errs.confirm}</FieldError>
                </div>
                <button className="btn btn-p btn-md" onClick={changePw} disabled={saving}>
                  {saving?<><Spinner/> Updating…</>:'🛡 Change Password'}
                </button>
              </div>
            </div>
          )}

          {/* ── System ── */}
          {section==='system'&&(
            <div className="settings-section">
              <div className="settings-section-title">System Health</div>
              <div className="settings-section-sub">Live status from the backend.</div>
              {sys.loading?<SkelText lines={5}/>:(
                <div className="code-prev" style={{marginTop:12}}>
                  {JSON.stringify({health:sys.data?.[0],version:sys.data?.[1],status:sys.data?.[2],
                    ...(sys.data?.[3]?{systemHealth:sys.data[3]}:{})},null,2)}
                </div>
              )}
              {!isAdmin&&(
                <div style={{fontSize:10.5,color:'var(--tx-3)',marginTop:8,lineHeight:1.6}}>
                  🔒 Detailed system diagnostics require an admin role. Signed in as
                  {' '}<strong style={{color:'var(--tx-2)'}}>{user?.role||'user'}</strong>.
                </div>
              )}
              <button className="btn btn-g btn-sm" style={{marginTop:12}} onClick={sys.refetch} aria-label="Refresh system health" title="Refresh">↻ Refresh</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/app/AuthScreens.js                    ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — AUTH SCREENS (live backend)
   POST /api/auth/login · /api/auth/register
   Reuses the v5 .login-* design language exactly.
══════════════════════════════════════════════ */

const LiveAuthPage=({onAuthed})=>{
  const [tab,setTab]=useState('login');
  const [f,setF]=useState({u:'',p:'',email:'',name:'',confirm:''});
  const [err,setErr]=useState('');
  const [errs,setErrs]=useState({});
  const [loading,setLoading]=useState(false);
  const [forgot,setForgot]=useState(false);

  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const submit=async()=>{
    setErr(''); setErrs({});
    const e={};
    if(!f.u.trim()) e.u='Username is required.';
    if(!f.p) e.p='Password is required.';
    if(tab==='register'){
      if(!isEmail(f.email)) e.email='Enter a valid email address.';
      if(pwStrength(f.p)<2) e.p='Choose a stronger password (8+ chars, mixed case, a digit).';
      if(f.p!==f.confirm) e.confirm='Passwords do not match.';
    }
    setErrs(e);
    if(Object.keys(e).length) return;

    setLoading(true);
    try{
      const res=tab==='login'
        ? await api.auth.login({u:f.u.trim(),p:f.p})
        : await api.auth.register({username:f.u.trim(),email:f.email.trim(),password:f.p,fullName:f.name.trim()||f.u.trim()});
      toast.success(tab==='login'?'Welcome back':'Account created',`Signed in as ${res.user.name}.`);
      onAuthed(res.user);
    }catch(ex){
      setErr(ex.status===401?'Invalid credentials. Please try again.':
             ex.status===0||ex.name==='AbortError'?'Cannot reach the backend. Is the API running?':
             ex.message);
    }finally{ setLoading(false); }
  };

  if(forgot) return <ForgotPassword onBack={()=>setForgot(false)}/>;

  return(
    <div className="login-page">
      <div className="login-glow" style={{width:400,height:400,background:'rgba(139,92,246,.07)',top:-100,right:-100}}/>
      <div className="login-glow" style={{width:300,height:300,background:'rgba(59,130,246,.05)',bottom:-80,left:-80}}/>
      <div className="login-card">
        <div style={{textAlign:'center',marginBottom:24}}>
          <div className="login-logo-ico">Q</div>
          <div className="login-title">Welcome to Quantoryx</div>
          <div className="login-sub">AI-Powered Trading Platform v6.0</div>
        </div>

        <div className="login-tabs">
          {['login','register'].map(t=>(
            <button key={t} className={cx('login-tab',tab===t&&'on')}
              onClick={()=>{setTab(t);setErr('');setErrs({});}}>
              {t==='login'?'Sign In':'Register'}
            </button>
          ))}
        </div>

        {err&&<div className="login-err">⚠️ {err}</div>}

        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label className="form-lbl">Username</label>
            <input className={cx('login-inp',errs.u&&'inp-err')} placeholder="Enter your username"
              value={f.u} onChange={set('u')} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus/>
            <FieldError>{errs.u}</FieldError>
          </div>

          {tab==='register'&&(
            <>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label className="form-lbl">Full Name</label>
                <input className="login-inp" placeholder="Your display name" value={f.name} onChange={set('name')}/>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label className="form-lbl">Email</label>
                <input className={cx('login-inp',errs.email&&'inp-err')} type="email" placeholder="your@email.com"
                  value={f.email} onChange={set('email')}/>
                <FieldError>{errs.email}</FieldError>
              </div>
            </>
          )}

          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label className="form-lbl">Password</label>
            <input className={cx('login-inp',errs.p&&'inp-err')} type="password" placeholder="••••••••"
              value={f.p} onChange={set('p')} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            {tab==='register'&&<PwMeter value={f.p}/>}
            <FieldError>{errs.p}</FieldError>
          </div>

          {tab==='register'&&(
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label className="form-lbl">Confirm Password</label>
              <input className={cx('login-inp',errs.confirm&&'inp-err')} type="password" placeholder="••••••••"
                value={f.confirm} onChange={set('confirm')} onKeyDown={e=>e.key==='Enter'&&submit()}/>
              <FieldError>{errs.confirm}</FieldError>
            </div>
          )}

          <button className="btn btn-p btn-full" style={{padding:10,fontSize:14,marginTop:6}}
            onClick={submit} disabled={loading}>
            {loading?<><Spinner/> {tab==='login'?'Signing in…':'Creating account…'}</>
                    :(tab==='login'?'→ Sign In':'Create Account')}
          </button>

          {tab==='login'&&(
            <button className="btn btn-g btn-full" style={{padding:8,fontSize:12}} onClick={()=>setForgot(true)}>
              Forgot your password?
            </button>
          )}
        </div>

        <div className="login-demo">
          🔗 Connected to <strong>{api._base}</strong> — real accounts, JWT authentication.
        </div>

        <div className="login-feats">
          {[['🤖','AI Decision Engine'],['📊','Live Analytics'],['⚡','Real Backtesting'],['🛡','JWT Secured']].map(([i,t])=>(
            <div key={t} className="login-feat"><span>{i}</span><span>{t}</span></div>
          ))}
        </div>
      </div>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/pages/AlertsPage.js                   ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — ALERTS PAGE
   Reuses: PageHd, Empty, Toggle, Modal, Confirm, toast,
           .card / .btn / .filter-chip / .form-* / .tbl (v5)
══════════════════════════════════════════════ */

const ALERT_TONE={
  price:      {icon:'💲',bg:'rgba(139,92,246,.13)',fg:'var(--pu-400)'},
  risk:       {icon:'🛡',bg:'rgba(239,68,68,.13)', fg:'var(--re-400)'},
  volatility: {icon:'📊',bg:'rgba(245,158,11,.13)',fg:'var(--ye-400)'},
  indicator:  {icon:'📈',bg:'rgba(59,130,246,.13)',fg:'var(--bl-400)'},
  pnl:        {icon:'💰',bg:'rgba(16,185,129,.13)',fg:'var(--gr-400)'},
};
const CHANNEL_ICON={push:'📱',email:'✉️',sms:'💬'};

const AlertsPage=({go})=>{
  const {data,loading,setData}=useAsync(()=>api.alerts.list(),[]);
  const {data:strats}=useAsync(()=>api.strategies.list().catch(()=>[]),[]);
  const [filter,setFilter]=useState('All');
  const [modal,setModal]=useState(false);
  const [del,setDel]=useState(null);
  const [saving,setSaving]=useState(false);
  const [form,setForm]=useState({name:'',type:'price',instrument:'EUR/USD',op:'>',value:'',channel:['push'],strategy:'All strategies'});
  const [errs,setErrs]=useState({});

  const alerts=data||[];
  const filters=['All','Active','Paused'];
  const shown=alerts.filter(a=>filter==='All'||(filter==='Active'?a.on:!a.on));
  const activeCount=alerts.filter(a=>a.on).length;
  const firedTotal=alerts.reduce((s,a)=>s+a.fired,0);

  const toggle=(id,on)=>{
    setData(p=>p.map(a=>a.id===id?{...a,on}:a));
    api.alerts.toggle(id,on);
    toast.info(on?'Alert enabled':'Alert paused',alerts.find(a=>a.id===id)?.name);
  };

  const confirmDelete=async()=>{
    setSaving(true);
    await api.alerts.remove(del.id);
    setData(p=>p.filter(a=>a.id!==del.id));
    setSaving(false); setDel(null);
    toast.success('Alert deleted',`“${del.name}” has been removed.`);
  };

  const toggleChannel=c=>setForm(f=>({
    ...f,channel:f.channel.includes(c)?f.channel.filter(x=>x!==c):[...f.channel,c],
  }));

  const save=async()=>{
    const e={};
    if(!form.name.trim()) e.name='Give the alert a name.';
    if(!String(form.value).trim()) e.value='Enter a trigger value.';
    if(!form.channel.length) e.channel='Pick at least one delivery channel.';
    setErrs(e);
    if(Object.keys(e).length) return;
    setSaving(true);
    const cond=`${form.instrument} ${form.op} ${form.value}`;
    const created=await api.alerts.create({...form,cond,on:true});
    setData(p=>[created,...p]);
    setSaving(false); setModal(false);
    setForm({name:'',type:'price',instrument:'EUR/USD',op:'>',value:'',channel:['push'],strategy:'All strategies'});
    toast.success('Alert created',`“${created.name}” is now live.`);
  };

  return(
    <div className="page fade-page">
      <PageHd title="Alerts" sub="Get notified when the market meets your conditions">
        <button className="btn btn-g btn-sm" onClick={()=>go('signals')}>📡 Live Signals</button>
        <button className="btn btn-p btn-sm" onClick={()=>setModal(true)}>+ New Alert</button>
      </PageHd>

      <div className="stats-row" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        {[
          {l:'Total Alerts',v:alerts.length,c:'stat-pu',i:'🔔'},
          {l:'Active',v:activeCount,c:'stat-gr',i:'✓'},
          {l:'Paused',v:alerts.length-activeCount,c:'stat-or',i:'⏸'},
          {l:'Triggered (30d)',v:firedTotal,c:'stat-bl',i:'⚡'},
        ].map(s=>(
          <div key={s.l} className={cx('stat',s.c)}>
            <div className="stat-hd">
              <span className="stat-lbl">{s.l}</span>
              <span className="stat-ico">{s.i}</span>
            </div>
            <div className="stat-val">{loading?'—':s.v}</div>
          </div>
        ))}
      </div>

      <div className="alerts-grid">
        <div>
          <div className="strat-filters" style={{marginBottom:12}}>
            {filters.map(f=>(
              <button key={f} className={cx('filter-chip',filter===f&&'on')} onClick={()=>setFilter(f)}>
                {f}{f!=='All'&&` (${f==='Active'?activeCount:alerts.length-activeCount})`}
              </button>
            ))}
          </div>

          {loading&&Array.from({length:4},(_,i)=><div key={i} style={{marginBottom:9}}><SkelCard rows={1}/></div>)}

          {!loading&&shown.length===0&&(
            <div className="card card-p">
              <Empty icon="🔔" title="No alerts here"
                sub="Create an alert to be notified the moment price, risk, or an indicator hits your threshold."/>
              <div style={{textAlign:'center'}}>
                <button className="btn btn-p btn-sm" onClick={()=>setModal(true)}>+ Create your first alert</button>
              </div>
            </div>
          )}

          {!loading&&shown.map(a=>{
            const tone=ALERT_TONE[a.type]||ALERT_TONE.price;
            return(
              <div key={a.id} className={cx('alert-row',!a.on&&'off')}>
                <span className="alert-ico" style={{background:tone.bg,color:tone.fg}}>{tone.icon}</span>
                <div style={{minWidth:0,flex:1}}>
                  <div className="alert-nm">{a.name}</div>
                  <div className="alert-cond">{a.cond}</div>
                  <div className="alert-meta">
                    <span>{a.strategy}</span>
                    <span>· {a.fired} triggered</span>
                    <span>· {a.last?relTime(a.last):'never fired'}</span>
                    <span>· {a.channel.map(c=>CHANNEL_ICON[c]).join(' ')}</span>
                  </div>
                </div>
                <div className="alert-acts">
                  <Toggle on={a.on} onChange={v=>toggle(a.id,v)}/>
                  <button className="alert-ib" title="Edit alert"
                    onClick={()=>toast.info('Edit alert','Inline editing opens the alert configurator.')}>✎</button>
                  <button className="alert-ib danger" title="Delete alert" onClick={()=>setDel(a)}>🗑</button>
                </div>
              </div>
            );
          })}
        </div>

        <div className="card card-p">
          <div className="card-hd"><div className="card-title">⚡ Recent Triggers</div></div>
          {loading?<SkelTable rows={5} cols={2}/>:(
            <div className="stack" style={{gap:0}}>
              {alerts.filter(a=>a.last).sort((a,b)=>b.last-a.last).slice(0,5).map(a=>(
                <div key={a.id} className="tick-row">
                  <span className="tick-pair" style={{minWidth:0,flex:1}}>{a.name}</span>
                  <span style={{fontSize:10,color:'var(--tx-3)'}}>{relTime(a.last)}</span>
                </div>
              ))}
            </div>
          )}

          <div className="section-lbl" style={{marginTop:16}}>Delivery Channels</div>
          {[['📱','Push notifications','Browser & mobile'],['✉️','Email','anwaar@quantoryx.io'],['💬','SMS','Quant plan only']].map(([i,t,s])=>(
            <div key={t} className="row" style={{gap:9,padding:'8px 0',borderBottom:'1px solid var(--bd)'}}>
              <span style={{fontSize:14}}>{i}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11.5,fontWeight:600,color:'var(--tx-1)'}}>{t}</div>
                <div style={{fontSize:10,color:'var(--tx-3)',marginTop:1}}>{s}</div>
              </div>
            </div>
          ))}
          <button className="btn btn-g btn-sm btn-full" style={{marginTop:12}} onClick={()=>go('settings')}>
            ⚙ Notification settings
          </button>
        </div>
      </div>

      <Modal open={modal} onClose={()=>setModal(false)} icon="🔔"
        title="Create Alert" sub="Define the condition and how you want to be notified."
        footer={
          <>
            <span className="mdl-ft-l">Alerts are evaluated on every tick.</span>
            <button className="btn btn-g btn-md" onClick={()=>setModal(false)} disabled={saving}>Cancel</button>
            <button className="btn btn-p btn-md" onClick={save} disabled={saving}>
              {saving?<><Spinner/> Creating…</>:'Create Alert'}
            </button>
          </>
        }>
        <div className="form-grp">
          <label className="form-lbl">Alert Name</label>
          <input className={cx('form-inp',errs.name&&'inp-err')} placeholder="e.g. EUR/USD breakout"
            value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          <FieldError>{errs.name}</FieldError>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div className="form-grp">
            <label className="form-lbl">Type</label>
            <select className="form-sel" value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
              {['price','risk','volatility','indicator','pnl'].map(t=><option key={t} value={t}>{t[0].toUpperCase()+t.slice(1)}</option>)}
            </select>
          </div>
          <div className="form-grp">
            <label className="form-lbl">Strategy</label>
            <select className="form-sel" value={form.strategy} onChange={e=>setForm(f=>({...f,strategy:e.target.value}))}>
              <option>All strategies</option>
              <option>Account-wide</option>
              {(strats||[]).map(s=><option key={s.id}>{s.name}</option>)}
            </select>
          </div>
        </div>

        <div className="form-grp">
          <label className="form-lbl">Condition</label>
          <div style={{display:'grid',gridTemplateColumns:'1.4fr .7fr 1fr',gap:8}}>
            <select className="form-sel" value={form.instrument} onChange={e=>setForm(f=>({...f,instrument:e.target.value}))}>
              {['EUR/USD','GBP/USD','USD/JPY','XAU/USD','BTC/USD','NASDAQ','Drawdown','Daily P&L','RSI(14)','ATR(14)'].map(o=><option key={o}>{o}</option>)}
            </select>
            <select className="form-sel" value={form.op} onChange={e=>setForm(f=>({...f,op:e.target.value}))}>
              {['>','<','≥','≤','='].map(o=><option key={o}>{o}</option>)}
            </select>
            <input className={cx('form-inp',errs.value&&'inp-err')} placeholder="value"
              value={form.value} onChange={e=>setForm(f=>({...f,value:e.target.value}))}/>
          </div>
          <FieldError>{errs.value}</FieldError>
          {form.value&&<div style={{fontSize:10.5,color:'var(--tx-3)',marginTop:4,fontFamily:'JetBrains Mono,monospace'}}>
            Preview: {form.instrument} {form.op} {form.value}
          </div>}
        </div>

        <div className="form-grp">
          <label className="form-lbl">Delivery Channels</label>
          <div className="strat-filters">
            {['push','email','sms'].map(c=>(
              <button key={c} className={cx('filter-chip',form.channel.includes(c)&&'on')} onClick={()=>toggleChannel(c)}>
                {CHANNEL_ICON[c]} {c[0].toUpperCase()+c.slice(1)}
              </button>
            ))}
          </div>
          <FieldError>{errs.channel}</FieldError>
        </div>
      </Modal>

      <Confirm open={!!del} onClose={()=>setDel(null)} onConfirm={confirmDelete} loading={saving}
        title="Delete this alert?" confirmLabel="Delete alert"
        body={<>“{del?.name}” will stop monitoring immediately. This cannot be undone.</>}/>
    </div>
  );
};



/* ╔══════════════════════════════════════════════════════════╗

/* ══════════════════════════════════════════════
   QUANTORYX v6 — LIVE SIGNALS PAGE
   Reuses: PageHd, Empty, Modal, toast, useInterval,
           .card / .btn / .filter-chip / .stat (v5)
══════════════════════════════════════════════ */

const SignalsPage=({go})=>{
  const {data,loading}=useAsync(()=>api.signals.list(),[]);
  const {data:tickData,loading:tickLoading}=useAsync(()=>api.signals.tickers(),[]);
  const [ticks,setTicks]=useState([]);
  const [flash,setFlash]=useState({});
  const [filter,setFilter]=useState('All');
  const [live,setLive]=useState(true);
  const [detail,setDetail]=useState(null);

  useEffect(()=>{ if(tickData) setTicks(tickData); },[tickData]);

  /* Simulated tick stream — replace with a WebSocket in api.js */
  useInterval(()=>{
    if(!live||!ticks.length) return;
    const i=Math.floor(Math.random()*ticks.length);
    setTicks(p=>p.map((t,ix)=>{
      if(ix!==i) return t;
      const drift=(Math.random()-0.48)*(t.px*0.0004);
      const px=+(t.px+drift).toFixed(t.px>1000?1:t.px>100?2:4);
      return {...t,px,chg:+(t.chg+drift/t.px*100).toFixed(2)};
    }));
    setFlash({[ticks[i].pair]:Math.random()>0.5?'up':'dn'});
    setTimeout(()=>setFlash({}),620);
  },live?1400:null);

  const signals=data||[];
  const filters=['All','Buy','Sell','Active'];
  const shown=signals.filter(s=>
    filter==='All'?true:
    filter==='Active'?s.status==='active':
    s.dir===filter.toLowerCase());
  const activeN=signals.filter(s=>s.status==='active').length;
  const avgConf=signals.length?Math.round(signals.reduce((a,s)=>a+s.conf,0)/signals.length):0;

  return(
    <div className="page fade-page">
      <PageHd title="Live Signals" sub="Real-time entries generated by your active strategies">
        <span className="sig-live-badge">
          <span className="sig-live-dot" style={{animation:live?undefined:'none',opacity:live?1:.4}}/>
          {live?'Streaming':'Paused'}
        </span>
        <button className="btn btn-g btn-sm" onClick={()=>setLive(l=>!l)}>{live?'⏸ Pause':'▶ Resume'}</button>
        <button className="btn btn-p btn-sm" onClick={()=>go('alerts')}>🔔 Alert Rules</button>
      </PageHd>

      <div className="stats-row" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        {[
          {l:'Open Signals',v:activeN,c:'stat-pu',i:'📡'},
          {l:'Avg Confidence',v:`${avgConf}%`,c:'stat-bl',i:'🎯'},
          {l:'Buy / Sell',v:`${signals.filter(s=>s.dir==='buy').length} / ${signals.filter(s=>s.dir==='sell').length}`,c:'stat-gr',i:'⚖'},
          {l:'Instruments',v:ticks.length,c:'stat-cy',i:'🌐'},
        ].map(s=>(
          <div key={s.l} className={cx('stat',s.c)}>
            <div className="stat-hd"><span className="stat-lbl">{s.l}</span><span className="stat-ico">{s.i}</span></div>
            <div className="stat-val">{loading?'—':s.v}</div>
          </div>
        ))}
      </div>

      <div className="sig-grid">
        <div>
          <div className="strat-filters" style={{marginBottom:12}}>
            {filters.map(f=><button key={f} className={cx('filter-chip',filter===f&&'on')} onClick={()=>setFilter(f)}>{f}</button>)}
          </div>

          {loading&&Array.from({length:3},(_,i)=><div key={i} style={{marginBottom:10}}><SkelCard rows={2}/></div>)}

          {!loading&&shown.length===0&&(
            <div className="card card-p">
              <Empty icon="📡" title="No signals match this filter"
                sub="Signals appear here the moment an active strategy triggers an entry condition."/>
            </div>
          )}

          {!loading&&shown.map(s=>(
            <div key={s.id} className={cx('sig-card',s.dir)}>
              <div className="sig-hd">
                <span className="sig-pair">{s.pair}</span>
                <span className={cx('sig-dir',s.dir)}>{s.dir.toUpperCase()}</span>
                <span className="status-pill" style={{background:'var(--bg-base)',color:'var(--tx-3)'}}>{s.tf}</span>
                {s.status!=='active'&&<span className={cx('status-pill',s.status==='filled'?'pill-ok':'pill-warn')}>{s.status}</span>}
                <span className="sig-time">{relTime(s.time)}</span>
              </div>

              <div className="sig-levels">
                {[['Entry',s.entry],['Stop Loss',s.sl],['Take Profit',s.tp],['R:R',s.rr]].map(([l,v])=>(
                  <div key={l}>
                    <div className="sig-lv-l">{l}</div>
                    <div className="sig-lv-v">{v}</div>
                  </div>
                ))}
              </div>

              <div>
                <div className="row" style={{justifyContent:'space-between',fontSize:10.5,color:'var(--tx-3)'}}>
                  <span>Confidence</span><span style={{fontWeight:600,color:'var(--tx-1)'}}>{s.conf}%</span>
                </div>
                <div className="sig-bar"><div className="sig-bar-f" style={{width:`${s.conf}%`}}/></div>
              </div>

              <div className="sig-foot">
                <span className="sig-src">📋 {s.strategy}</span>
                <div style={{marginLeft:'auto',display:'flex',gap:7}}>
                  <button className="btn btn-g btn-sm" onClick={()=>setDetail(s)}>Details</button>
                  <button className="btn btn-p btn-sm" onClick={()=>toast.success('Order staged',`${s.dir.toUpperCase()} ${s.pair} @ ${s.entry} queued for execution.`)}>
                    ⚡ Execute
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>

        <div className="card card-p">
          <div className="card-hd">
            <div className="card-title">🌐 Market Watch</div>
            <span className="sig-live-badge" style={{fontSize:9,padding:'2px 7px'}}>
              <span className="sig-live-dot" style={{animation:live?undefined:'none'}}/>LIVE
            </span>
          </div>
          {tickLoading?<SkelTable rows={8} cols={3}/>:(
            <div className="sig-feed">
              {ticks.map(t=>(
                <div key={t.pair} className={cx('tick-row',flash[t.pair]==='up'&&'tick-flash-up',flash[t.pair]==='dn'&&'tick-flash-dn')}>
                  <span className="tick-pair">{t.pair}</span>
                  <span className="tick-px">{t.px.toLocaleString('en-US',{minimumFractionDigits:t.px>1000?1:t.px>100?2:4})}</span>
                  <span className={cx('tick-chg',t.chg>=0?'up':'down')}>{t.chg>=0?'+':''}{t.chg.toFixed(2)}%</span>
                </div>
              ))}
            </div>
          )}
          <div style={{fontSize:10,color:'var(--tx-3)',marginTop:10,textAlign:'center'}}>
            Prices are simulated · swap to a WebSocket feed in <code style={{fontFamily:'JetBrains Mono,monospace'}}>api.signals</code>
          </div>
        </div>
      </div>

      <Modal open={!!detail} onClose={()=>setDetail(null)} size="lg" icon={detail?.dir==='buy'?'📈':'📉'}
        title={detail?`${detail.pair} · ${detail.dir.toUpperCase()} signal`:''}
        sub={detail?`${detail.strategy} · ${detail.tf} · generated ${relTime(detail.time)}`:''}
        footer={
          <>
            <span className="mdl-ft-l">Risk 2% of equity per the active money-management rule.</span>
            <button className="btn btn-g btn-md" onClick={()=>setDetail(null)}>Dismiss</button>
            <button className="btn btn-p btn-md" onClick={()=>{ toast.success('Order staged',`${detail.pair} queued.`); setDetail(null); }}>⚡ Execute</button>
          </>
        }>
        {detail&&(
          <>
            <div className="bt-kpi-row" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
              {[['Entry',detail.entry,'neu'],['Stop Loss',detail.sl,'err'],['Take Profit',detail.tp,'ok'],['Risk:Reward',detail.rr,'neu']].map(([l,v,c])=>(
                <div key={l} className="bt-kpi">
                  <div className="bt-kpi-lbl">{l}</div>
                  <div className={cx('bt-kpi-val',c)}>{v}</div>
                </div>
              ))}
            </div>
            <div>
              <div className="section-lbl">Signal Confidence</div>
              <div className="sig-bar" style={{height:6}}><div className="sig-bar-f" style={{width:`${detail.conf}%`}}/></div>
              <div style={{fontSize:11,color:'var(--tx-2)',marginTop:7,lineHeight:1.7}}>
                The model scores this setup at <strong style={{color:'var(--tx-1)'}}>{detail.conf}%</strong> confidence based on
                trend alignment, volatility regime, and confirmation from correlated instruments.
              </div>
            </div>
            <div>
              <div className="section-lbl">Rationale</div>
              <div style={{fontSize:11.5,color:'var(--tx-2)',lineHeight:1.8}}>
                {detail.dir==='buy'
                  ?`Price cleared the prior swing high on expanding volume while the ${detail.tf} trend filter remains positive. Momentum and breadth both confirm continuation, and the stop sits below structural support.`
                  :`Price rejected a well-tested supply zone with bearish divergence on the oscillator. The ${detail.tf} trend filter has rolled over and the stop sits above the invalidation high.`}
              </div>
            </div>
          </>
        )}
      </Modal>
    </div>
  );
};
