<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quantoryx v6.0 — AI-Powered Trading Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ════════════════════════════════════════════════════
   QUANTORYX v5.0 — PIXEL-PERFECT DESIGN SYSTEM
   Reconstructed from approved design mockup
════════════════════════════════════════════════════ */
:root {
  /* ── Core backgrounds ── */
  --bg-base:        #0a0b14;
  --bg-elevated:    #0f1022;
  --bg-card:        rgba(255,255,255,0.035);
  --bg-card-hov:    rgba(255,255,255,0.065);
  --bg-sidebar:     #0c0d1e;
  --bg-glass:       rgba(10,11,20,0.88);
  --bg-input:       rgba(255,255,255,0.05);
  --bg-ai-card:     linear-gradient(145deg,#0e0c28 0%,#130d35 100%);

  /* ── Brand gradients ── */
  --grad-brand:     linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#2563eb 100%);
  --grad-accent:    linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);
  --grad-success:   linear-gradient(135deg,#059669 0%,#10b981 100%);
  --grad-danger:    linear-gradient(135deg,#dc2626 0%,#ef4444 100%);
  --grad-warning:   linear-gradient(135deg,#d97706 0%,#f59e0b 100%);
  --grad-spark-pu:  #a78bfa;
  --grad-spark-bl:  #60a5fa;
  --grad-spark-gr:  #34d399;
  --grad-spark-rd:  #fca5a5;
  --grad-spark-or:  #fcd34d;
  --grad-spark-cy:  #67e8f9;

  /* ── Text hierarchy ── */
  --tx-1:   #f0f1ff;
  --tx-2:   #8b8fa8;
  --tx-3:   #5a5e7a;
  --tx-acc: #a78bfa;
  --tx-ok:  #10b981;
  --tx-err: #f87171;
  --tx-wrn: #fbbf24;

  /* ── Borders ── */
  --bd:     rgba(255,255,255,0.07);
  --bd-act: rgba(139,92,246,0.42);
  --bd-gl:  rgba(255,255,255,0.11);
  --bd-pu:  rgba(139,92,246,0.25);

  /* ── Brand hues ── */
  --pu-300: #c4b5fd;
  --pu-400: #a78bfa;
  --pu-500: #8b5cf6;
  --pu-600: #7c3aed;
  --bl-400: #60a5fa;
  --bl-500: #3b82f6;
  --gr-400: #34d399;
  --gr-500: #10b981;
  --re-400: #f87171;
  --re-500: #ef4444;
  --ye-400: #fbbf24;
  --cy-400: #67e8f9;

  /* ── Shadows ── */
  --sh-card:  0 4px 24px rgba(0,0,0,0.28);
  --sh-glow:  0 0 30px rgba(139,92,246,0.14);
  --sh-elev:  0 8px 40px rgba(0,0,0,0.42);
  --sh-btn:   0 2px 14px rgba(139,92,246,0.32);

  /* ── Layout ── */
  --sb-w:   220px;
  --hd-h:   56px;
  --r:      12px;
  --r-sm:   8px;
  --r-lg:   16px;

  /* ── Transitions ── */
  --t:    0.15s ease;
  --t-md: 0.25s ease;
  --t-lg: 0.35s ease;
}

/* ── Light mode overrides ── */
.lm {
  --bg-base:     #f3f4f9;
  --bg-elevated: #ffffff;
  --bg-card:     rgba(255,255,255,0.92);
  --bg-card-hov: #ffffff;
  --bg-sidebar:  #ffffff;
  --bg-glass:    rgba(255,255,255,0.93);
  --bg-input:    rgba(0,0,0,0.04);
  --bg-ai-card:  linear-gradient(145deg,#f8f7ff 0%,#f0eeff 100%);
  --tx-1:  #0f1022;
  --tx-2:  #4b5563;
  --tx-3:  #9ca3af;
  --tx-acc:#7c3aed;
  --tx-ok: #059669;
  --tx-err:#dc2626;
  --tx-wrn:#d97706;
  --bd:    rgba(0,0,0,0.08);
  --bd-act:rgba(139,92,246,0.32);
  --bd-gl: rgba(0,0,0,0.1);
  --bd-pu: rgba(139,92,246,0.2);
  --sh-card:0 2px 16px rgba(0,0,0,0.07);
  --sh-glow:0 0 24px rgba(139,92,246,0.09);
  --sh-elev:0 8px 32px rgba(0,0,0,0.1);
}


:focus-visible { outline: 2px solid var(--pu-500); outline-offset: 2px; border-radius: 4px; }
button:focus-visible { outline: 2px solid var(--pu-500); outline-offset: 2px; }

/* ════ RESET ════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{background:var(--bg-base);color:var(--tx-1);transition:background .3s,color .3s;}
input,button,select,textarea{font-family:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.28);border-radius:2px;}
::selection{background:rgba(139,92,246,.2);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* ════ APP SHELL ════ */
.shell{display:grid;grid-template-columns:var(--sb-w) 1fr;grid-template-rows:var(--hd-h) 1fr;height:100vh;overflow:hidden;}

/* ════ HEADER ════ */
.hd{
  grid-column:1/-1;
  background:var(--bg-glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 20px;gap:14px;
  position:relative;z-index:100;
}
.hd-logo{display:flex;align-items:center;gap:10px;width:var(--sb-w);flex-shrink:0;padding-left:2px;}
.hd-logo-icon{
  width:32px;height:32px;background:var(--grad-brand);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;letter-spacing:-1px;flex-shrink:0;
  box-shadow:0 2px 10px rgba(124,58,237,.35);
}
.hd-logo-name{font-size:14px;font-weight:800;color:var(--tx-1);letter-spacing:.6px;}
.hd-logo-tag{font-size:9px;color:var(--tx-3);font-weight:400;margin-top:1px;letter-spacing:.3px;}
.hd-search{
  flex:1;max-width:440px;display:flex;align-items:center;gap:8px;
  background:var(--bg-input);border:1px solid var(--bd);
  border-radius:var(--r-sm);padding:0 12px;height:36px;
  transition:border-color var(--t);
}
.hd-search:focus-within{border-color:var(--bd-act);}
.hd-search input{flex:1;background:none;border:none;outline:none;color:var(--tx-1);font-size:13px;}
.hd-search input::placeholder{color:var(--tx-3);}
.hd-search-icon{font-size:13px;color:var(--tx-3);flex-shrink:0;}
.hd-kbd{background:var(--bg-card);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--tx-3);white-space:nowrap;}
.hd-gap{flex:1;}
.hd-mkt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--tx-2);white-space:nowrap;}
.hd-dot{width:7px;height:7px;border-radius:50%;background:var(--gr-500);box-shadow:0 0 6px var(--gr-500);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hd-actions{display:flex;align-items:center;gap:3px;}
.hd-btn{
  width:34px;height:34px;border-radius:var(--r-sm);border:none;
  background:var(--bg-card);color:var(--tx-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all var(--t);
}
.hd-btn:hover{background:var(--bg-card-hov);color:var(--tx-1);}
.hd-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;
  border:2px solid var(--bd-act);
  box-shadow:0 0 0 0 rgba(139,92,246,.4);
  transition:box-shadow var(--t);
}
.hd-avatar:hover{box-shadow:0 0 0 3px rgba(139,92,246,.2);}

/* ════ SIDEBAR ════ */
.sb{
  background:var(--bg-sidebar);border-right:1px solid var(--bd);
  overflow-y:auto;display:flex;flex-direction:column;padding:10px 8px;gap:1px;
}
.sb-nav{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:var(--r-sm);color:var(--tx-2);font-size:13px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
  transition:all var(--t);position:relative;
}
.sb-nav:hover{background:var(--bg-card);color:var(--tx-1);}
.sb-nav.on{background:rgba(139,92,246,.12);color:var(--pu-400);}
.sb-nav.on::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--grad-accent);border-radius:0 2px 2px 0;
}
.sb-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.sb-lbl{flex:1;}
.sb-badge{
  margin-left:auto;background:var(--grad-accent);color:#fff;
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;
}
.sb-dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--gr-500);}
.sb-spacer{flex:1;}
.sb-ai{
  margin:10px 4px 4px;padding:16px;background:var(--grad-brand);
  border-radius:var(--r);position:relative;overflow:hidden;
}
.sb-ai::after{
  content:'';position:absolute;top:-24px;right:-24px;
  width:88px;height:88px;background:rgba(255,255,255,.07);border-radius:50%;
}
.sb-ai-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;position:relative;z-index:1;}
.sb-ai-sub{font-size:11px;color:rgba(255,255,255,.68);margin-bottom:12px;position:relative;z-index:1;}
.sb-ai-btn{
  width:100%;background:rgba(255,255,255,.18);border:none;border-radius:6px;
  color:#fff;font-size:12px;font-weight:600;padding:7px 12px;
  transition:background var(--t);position:relative;z-index:1;
}
.sb-ai-btn:hover{background:rgba(255,255,255,.28);}
.sb-footer{margin-top:auto;border-top:1px solid var(--bd);padding-top:6px;}

/* ════ PAGE AREA ════ */
.page-wrap{overflow-y:auto;background:var(--bg-base);height:100%;}
.page{padding:20px;display:flex;flex-direction:column;gap:18px;min-height:100%;}

/* ════ PAGE HEADER ════ */
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.pg-title{font-size:20px;font-weight:800;color:var(--tx-1);letter-spacing:-.3px;}
.pg-sub{font-size:13px;color:var(--tx-2);margin-top:3px;}
.pg-acts{display:flex;gap:8px;align-items:center;}

/* ════ BUTTONS ════ */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;
  font-weight:600;transition:all var(--t);white-space:nowrap;
}
.btn:disabled{opacity:.5;pointer-events:none;}
.btn-p{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-btn);}
.btn-p:hover{box-shadow:0 4px 20px rgba(139,92,246,.5);transform:translateY(-1px);}
.btn-g{background:var(--bg-card);border:1px solid var(--bd);color:var(--tx-2);}
.btn-g:hover{border-color:var(--bd-gl);color:var(--tx-1);}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px;}
.btn-md{padding:7px 14px;font-size:12px;}
.btn-full{width:100%;justify-content:center;}

/* ════ CARDS ════ */
.card{box-sizing:border-box;
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  backdrop-filter:blur(12px);transition:border-color var(--t),box-shadow var(--t);
}
.card:hover{border-color:var(--bd-gl);box-shadow:var(--sh-card);}
.card-p{padding:16px;}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:13px;gap:10px;}
.card-title{font-size:13px;font-weight:700;color:var(--tx-1);display:flex;align-items:center;gap:6px;}
.card-sub{font-size:11px;color:var(--tx-3);margin-top:2px;}
.card-acts{display:flex;align-items:center;gap:6px;flex-shrink:0;}

/* ════ STAT CARDS ════ */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.stat{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 15px;cursor:pointer;transition:all var(--t-md);position:relative;overflow:hidden;
}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  opacity:0;transition:opacity var(--t);border-radius:var(--r) var(--r) 0 0;
}
.stat:hover{border-color:var(--bd-act);box-shadow:var(--sh-glow);}
.stat:hover::after{opacity:1;}
.stat-pu::after{background:var(--grad-accent);}
.stat-bl::after{background:linear-gradient(90deg,var(--bl-500),#06b6d4);}
.stat-gr::after{background:var(--grad-success);}
.stat-rd::after{background:var(--grad-danger);}
.stat-or::after{background:var(--grad-warning);}
.stat-cy::after{background:linear-gradient(90deg,#06b6d4,var(--bl-500));}
.stat-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.stat-lbl{font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.5px;}
.stat-ico{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.ico-pu{background:rgba(139,92,246,.14);color:var(--pu-400);}
.ico-bl{background:rgba(59,130,246,.14);color:var(--bl-400);}
.ico-gr{background:rgba(16,185,129,.14);color:var(--gr-400);}
.ico-rd{background:rgba(239,68,68,.14);color:var(--re-400);}
.ico-or{background:rgba(245,158,11,.14);color:var(--ye-400);}
.ico-cy{background:rgba(6,182,212,.14);color:var(--cy-400);}
.stat-val{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;line-height:1.1;}
.stat-chg{font-size:11px;font-weight:500;display:flex;align-items:center;gap:3px;}
.up{color:var(--tx-ok);}.down{color:var(--tx-err);}.neu{color:var(--tx-3);}

/* ════ CHARTS GRID ════ */
.charts-grid{display:grid;grid-template-columns:1fr 300px 252px;gap:13px;}

/* ── Performance Card ── */
.perf-legend{display:flex;gap:14px;margin-bottom:10px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-2);}
.leg-line{width:20px;height:2px;border-radius:1px;}
.leg-dashed{background:none!important;border-top:2px dashed #6b7280;}
.perf-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid var(--bd);}
.pm-lbl{font-size:10px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.pm-val{font-size:14px;font-weight:700;}
.pm-ok{color:var(--tx-ok);}.pm-err{color:var(--tx-err);}.pm-neu{color:var(--tx-1);}

/* ── AI Insight ── */
.ai-card{
  background:var(--bg-ai-card);border:1px solid var(--bd-pu);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.ai-card::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:150px;height:150px;
  background:radial-gradient(circle,rgba(139,92,246,.13) 0%,transparent 70%);
  pointer-events:none;
}
.ai-hd{display:flex;align-items:center;justify-content:space-between;}
.ai-hd-lbl{font-size:11px;font-weight:600;color:var(--tx-2);display:flex;align-items:center;gap:6px;}
.ai-badge{background:var(--grad-accent);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;}
.ai-signal{font-size:28px;font-weight:800;letter-spacing:-.5px;}
.sig-bull{color:var(--gr-500);}.sig-bear{color:var(--re-500);}.sig-neu{color:var(--ye-400);}
.ai-conf-lbl{font-size:13px;font-weight:500;color:var(--tx-2);margin-top:-4px;}
.ai-conf-lbl span{color:var(--pu-400);font-weight:700;}
.conf-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.conf-fill{height:100%;border-radius:2px;background:var(--grad-accent);transition:width 1s ease;}
.ai-desc{font-size:12px;color:var(--tx-2);font-style:italic;line-height:1.5;}
.ai-factors{display:flex;flex-direction:column;gap:4px;}
.ai-fac{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-2);}
.fac-dot{width:5px;height:5px;border-radius:50%;background:var(--gr-500);flex-shrink:0;}
.ai-acts{display:flex;gap:8px;margin-top:2px;}

/* ── Market Regime ── */
.regime-donut{display:flex;justify-content:center;position:relative;margin:6px 0;}
.regime-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.reg-name{font-size:13px;font-weight:700;}
.reg-pct{font-size:11px;color:var(--tx-2);}
.reg-legend{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.reg-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.reg-lbl{display:flex;align-items:center;gap:7px;color:var(--tx-2);}
.reg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.reg-val{font-weight:600;color:var(--tx-1);}

/* ════ MID GRID ════ */
.mid-grid{display:grid;grid-template-columns:390px 1fr;gap:13px;}

/* ── Optimize ── */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.form-grp{display:flex;flex-direction:column;gap:4px;}
.form-lbl{font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;}
.form-sel,.form-inp,.login-inp,select,input{
  background:var(--bg-base);border:1px solid var(--bd);border-radius:6px;
  padding:7px 10px;color:var(--tx-1);font-size:12px;outline:none;
  transition:border-color var(--t);
}
.form-sel:focus,.form-inp:focus{border-color:var(--pu-500);}
.sl-row{margin-bottom:7px;}
.sl-hd{display:flex;justify-content:space-between;margin-bottom:3px;}
.sl-lbl{font-size:11px;color:var(--tx-2);}
.sl-val{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--tx-1);}
.slider{
  width:100%;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--bd);border-radius:2px;outline:none;cursor:pointer;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--pu-500);cursor:pointer;
  border:2px solid var(--bg-base);box-shadow:0 0 6px rgba(139,92,246,.5);
}
.surf-chart{
  background:linear-gradient(135deg,#1a0a3f 0%,#0f1a4f 100%);
  border-radius:8px;padding:8px;margin-top:6px;overflow:hidden;
}
.surf-lbls{display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.32);margin-top:2px;}
.best-params{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
.param-box{
  text-align:center;background:var(--bg-base);border:1px solid var(--bd);
  border-radius:6px;padding:5px 4px;
}
.param-k{font-size:9px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.param-v{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--tx-1);}

/* ── Portfolio ── */
.port-grid{display:grid;grid-template-columns:1fr 260px;gap:16px;}
.port-top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.port-equity{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--tx-1);}
.port-day{font-size:18px;font-weight:700;color:var(--tx-ok);}
.port-cash{font-size:18px;font-weight:700;color:var(--tx-1);}
.micro-lbl{font-size:10px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.alloc-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;}
.alloc-nm{width:65px;color:var(--tx-2);font-size:11px;}
.alloc-bar-t{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden;}
.alloc-bar-f{height:100%;border-radius:2px;transition:width .6s ease;}
.alloc-pct{width:30px;text-align:right;font-weight:600;font-size:11px;font-family:'JetBrains Mono',monospace;}

/* ── Tables ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;position:sticky;top:0;z-index:1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-3);padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--bd);color:var(--tx-2);}
.tbl tbody tr:hover td{background:var(--bg-card-hov);}
.tbl td:first-child{color:var(--tx-1);font-weight:500;}
.tbl tbody tr:last-child td{border-bottom:none;}
.pair-chip{
  display:inline-block;background:rgba(139,92,246,.12);
  color:var(--pu-400);font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;
}
.risk-warn{
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.18);
  border-radius:var(--r-sm);padding:8px 12px;display:flex;align-items:flex-start;
  gap:8px;font-size:11px;color:var(--tx-wrn);margin-top:10px;line-height:1.5;
}

/* ════ BOTTOM GRID ════ */
.bot-grid{display:grid;grid-template-columns:1fr 1fr 268px;gap:13px;}

/* ── System Status ── */
.sys-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.live-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--gr-500);box-shadow:0 0 6px var(--gr-500);
  animation:pulse 2s infinite;margin-right:6px;
}
.strat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;background:var(--bg-base);border:1px solid var(--bd);
  border-radius:7px;margin-bottom:5px;transition:border-color var(--t);
}
.strat-row:hover{border-color:var(--bd-gl);}
.strat-nm{font-size:12px;font-weight:500;color:var(--tx-1);}
.strat-dt{font-size:10px;color:var(--tx-3);margin-top:1px;font-family:'JetBrains Mono',monospace;}

/* ── Quick Actions ── */
.qa-btn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:var(--bg-base);border:1px solid var(--bd);border-radius:8px;
  transition:border-color var(--t),background var(--t);width:100%;text-align:left;
  margin-bottom:7px;
}
.qa-btn:hover{border-color:var(--bd-gl);background:var(--bg-card-hov);}
.qa-ico{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.qa-lbl{font-size:13px;font-weight:600;color:var(--tx-1);}
.qa-sub{font-size:11px;color:var(--tx-3);margin-top:1px;}
.qa-arr{margin-left:auto;color:var(--tx-3);font-size:16px;}

/* ════ TABS ════ */
.tabs{display:flex;gap:2px;background:var(--bg-base);border-radius:6px;padding:2px;}
.tab{
  padding:4px 10px;border-radius:5px;border:none;background:none;
  color:var(--tx-3);font-size:11px;font-weight:500;transition:all var(--t);
}
.tab.on{background:var(--bg-card);color:var(--tx-1);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.sel-sm{
  background:var(--bg-base);border:1px solid var(--bd);border-radius:6px;
  padding:4px 8px;color:var(--tx-2);font-size:11px;outline:none;cursor:pointer;
}
.section-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-3);margin-bottom:6px;}
.status-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.pill-ok{background:rgba(16,185,129,.12);color:var(--gr-400);}
.pill-err{background:rgba(239,68,68,.12);color:var(--re-400);}
.pill-warn{background:rgba(245,158,11,.12);color:var(--ye-400);}


select option { background: var(--bg-elevated); color: var(--tx-1); }
.sel-sm option { background: var(--bg-elevated); color: var(--tx-1); }

/* ════ SKELETON ════ */
.skel{
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hov) 50%,var(--bg-card) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;
}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ════ TOOLTIP ════ */
.chart-tip{
  background:rgba(10,11,20,.96);border:1px solid var(--bd-gl);
  border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:var(--sh-elev);
}
.tip-lbl{color:var(--tx-2);margin-bottom:4px;font-size:11px;}
.tip-row{display:flex;align-items:center;gap:6px;margin-top:2px;}
.tip-dot{width:6px;height:6px;border-radius:50%;}
.tip-val{color:var(--tx-1);font-weight:600;margin-left:auto;padding-left:8px;font-family:'JetBrains Mono',monospace;}

/* ════ PAGE TRANSITION ════ */
.fade-page{animation:fadeUp .22s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.stagger > *:nth-child(1){animation-delay:.04s;}
.stagger > *:nth-child(2){animation-delay:.08s;}
.stagger > *:nth-child(3){animation-delay:.12s;}
.stagger > *:nth-child(4){animation-delay:.16s;}
.stagger > *:nth-child(5){animation-delay:.20s;}
.stagger > *:nth-child(6){animation-delay:.24s;}

/* ════════════════════════════════════════
   AI TRADING ASSISTANT MODULE
════════════════════════════════════════ */
.ai-page{display:grid;grid-template-columns:1fr 292px;height:100%;min-height:0;overflow:hidden;background:var(--bg-base);}

/* ── Chat column ── */
.chat-col{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;border-right:1px solid var(--bd);}
.chat-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 20px 11px;border-bottom:1px solid var(--bd);flex-shrink:0;
  background:var(--bg-glass);backdrop-filter:blur(16px);
}
.chat-topbar-l{display:flex;align-items:center;gap:10px;}
.chat-topbar-title{font-size:15px;font-weight:700;color:var(--tx-1);}
.chat-topbar-sub{font-size:11px;color:var(--tx-2);margin-top:1px;}
.ai-live{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);
  border-radius:20px;padding:3px 8px;font-size:10px;font-weight:600;color:var(--gr-500);
}
.ai-live-d{width:5px;height:5px;border-radius:50%;background:var(--gr-500);animation:pulse 2s infinite;}
.chat-top-acts{display:flex;align-items:center;gap:6px;}
.chat-act{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--bd);background:var(--bg-card);color:var(--tx-2);
  font-size:11px;font-weight:500;transition:all var(--t);
}
.chat-act:hover{border-color:var(--bd-gl);color:var(--tx-1);}
.chat-act.danger:hover{border-color:rgba(239,68,68,.3);color:var(--tx-err);}
.ksc{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx-3);}
.ktag{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:4px;
  padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tx-3);
}

/* ── Messages ── */
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:4px;}

/* ── Welcome ── */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:16px;padding:32px 20px;text-align:center;
}
.w-orb{
  width:68px;height:68px;background:var(--grad-brand);border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 12px 32px rgba(139,92,246,.35),0 0 60px rgba(139,92,246,.1);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.w-title{font-size:20px;font-weight:700;color:var(--tx-1);}
.w-sub{font-size:13px;color:var(--tx-2);max-width:340px;line-height:1.6;}
.w-caps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;}
.w-cap{
  display:flex;align-items:center;gap:6px;background:var(--bg-card);
  border:1px solid var(--bd);border-radius:6px;padding:5px 10px;
  font-size:11px;font-weight:500;color:var(--tx-2);
}
.w-cap-d{width:5px;height:5px;border-radius:50%;}
.prompts-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-3);text-align:left;margin-bottom:2px;width:100%;max-width:500px;}
.prompts{display:flex;flex-direction:column;gap:6px;width:100%;max-width:500px;}
.prompt-chip{cursor:pointer;
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--bd);border-radius:10px;
  color:var(--tx-2);text-align:left;transition:all var(--t-md);width:100%;
  animation:fadeUp .35s ease both;
}
.prompt-chip:hover{border-color:var(--bd-act);color:var(--tx-1);background:rgba(139,92,246,.06);box-shadow:var(--sh-glow);transform:translateX(3px);}
.pc-ico{width:30px;height:30px;border-radius:8px;background:rgba(139,92,246,.1);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:background var(--t);}
.prompt-chip:hover .pc-ico{background:rgba(139,92,246,.2);}
.pc-txt{flex:1;font-size:13px;font-weight:500;}
.pc-sub{font-size:11px;color:var(--tx-3);margin-top:1px;}
.pc-arr{color:var(--tx-3);font-size:14px;transition:all var(--t);}
.prompt-chip:hover .pc-arr{transform:translateX(3px);color:var(--pu-400);}

/* ── Message bubbles ── */
.msg-grp{display:flex;flex-direction:column;gap:2px;animation:fadeUp .22s ease both;margin-bottom:6px;}
.msg-row{display:flex;align-items:flex-start;gap:10px;padding:3px 0;}
.msg-row.user{flex-direction:row-reverse;}
.msg-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px;
}
.msg-av.ai{background:var(--grad-brand);color:#fff;box-shadow:0 2px 8px rgba(139,92,246,.3);}
.msg-av.user{background:rgba(139,92,246,.15);color:var(--pu-400);border:1px solid var(--bd-act);}
.msg-body{max-width:76%;display:flex;flex-direction:column;gap:4px;}
.msg-row.user .msg-body{align-items:flex-end;} .msg-row.user .bubble{box-shadow:0 2px 12px rgba(124,58,237,.22);}
.msg-meta{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx-3);padding:0 4px;}
.msg-row.user .msg-meta{flex-direction:row-reverse;}
.msg-nm{font-weight:600;color:var(--tx-2);font-size:11px;}
.msg-mdl{background:rgba(139,92,246,.12);color:var(--pu-400);font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;}
.bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.65;word-break:break-word;}
.bubble.ai{background:var(--bg-card);border:1px solid var(--bd);border-radius:14px 14px 14px 4px;color:var(--tx-1);}
.bubble.user{background:var(--grad-brand);color:#fff;border-radius:14px 14px 4px 14px;box-shadow:0 2px 12px rgba(139,92,246,.25);}
.msg-acts{display:flex;gap:3px;margin-top:2px;opacity:0;transition:opacity var(--t);}
.msg-grp:hover .msg-acts{opacity:1;}
.msg-act{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);
  background:var(--bg-card);color:var(--tx-3);
  display:flex;align-items:center;justify-content:center;font-size:12px;
  transition:all var(--t);
}
.msg-act:hover{border-color:var(--bd-gl);color:var(--tx-1);}
.msg-act.cp{color:var(--gr-500);border-color:rgba(16,185,129,.3);}

/* ── Markdown ── */
.md h1{font-size:17px;font-weight:700;margin:12px 0 6px;color:var(--tx-1);}
.md h2{font-size:15px;font-weight:700;margin:10px 0 5px;color:var(--tx-1);}
.md h3{font-size:13px;font-weight:600;margin:8px 0 4px;color:var(--tx-1);}
.md p{margin:5px 0;}
.md ul,.md ol{padding-left:18px;margin:5px 0;}
.md li{margin:3px 0;}
.md strong{font-weight:700;color:var(--tx-1);}
.md em{font-style:italic;}
.md hr{border:none;border-top:1px solid var(--bd);margin:10px 0;}
.md code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(139,92,246,.12);color:var(--pu-400);padding:1px 5px;border-radius:4px;}
.bubble.user .md code{background:rgba(255,255,255,.2);color:rgba(255,255,255,.95);}
.md-block{margin:9px 0;border-radius:8px;overflow:hidden;border:1px solid var(--bd);}
.md-block-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--bd);}
.md-block-lang{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-3);font-family:'JetBrains Mono',monospace;}
.md-block-cp{font-size:10px;font-weight:600;color:var(--tx-3);background:none;border:none;display:flex;align-items:center;gap:4px;transition:color var(--t);}
.md-block-cp:hover{color:var(--tx-1);}
.md-block-cp.done{color:var(--gr-500);}
.md-block pre{margin:0;padding:12px 14px;overflow-x:auto;background:rgba(0,0,0,.25);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:#c9d1d9;}

/* ── Typing ── */
.typing{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--bd);
  border-radius:14px 14px 14px 4px;width:fit-content;animation:fadeUp .2s ease both;
}
.t-dots{display:flex;gap:4px;align-items:center;}
.t-dot{width:6px;height:6px;border-radius:50%;background:var(--pu-400);animation:bounce 1.2s ease-in-out infinite;}
.t-dot:nth-child(2){animation-delay:.2s;}.t-dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-6px);opacity:1;}}
.t-lbl{font-size:11px;color:var(--tx-3);font-style:italic;}
.cursor{display:inline-block;width:2px;height:14px;background:var(--pu-400);border-radius:1px;vertical-align:middle;margin-left:2px;animation:blink .8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── Input ── */
.chat-input-area{flex-shrink:0;padding:12px 20px 16px;border-top:1px solid var(--bd);background:var(--bg-glass);backdrop-filter:blur(16px);}
.inline-chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:1px;}
.inline-chip{cursor:pointer;
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--bd);background:var(--bg-card);color:var(--tx-2);
  font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0;
  transition:all var(--t);
}
.inline-chip:hover{border-color:var(--bd-act);color:var(--tx-1);}
.input-wrap{
  display:flex;align-items:flex-end;gap:10px;background:var(--bg-card);
  border:1px solid var(--bd);border-radius:14px;padding:10px 14px;
  transition:border-color var(--t-md),box-shadow var(--t-md);
}
.input-wrap:focus-within{border-color:var(--bd-act);box-shadow:0 0 0 3px rgba(139,92,246,.08),var(--sh-glow);}
.chat-ta{
  flex:1;background:none;border:none;outline:none;color:var(--tx-1);
  font-size:13px;line-height:1.5;resize:none;
  min-height:22px;max-height:140px;overflow-y:auto;
}
.chat-ta::placeholder{color:var(--tx-3);}
.input-acts{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.att-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--bd);
  background:none;color:var(--tx-3);font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all var(--t);
}
.att-btn:hover{border-color:var(--bd-gl);color:var(--tx-2);}
.send-btn{
  width:34px;height:34px;border-radius:9px;border:none;background:var(--grad-brand);
  color:#fff;font-size:16px;box-shadow:0 2px 10px rgba(139,92,246,.35);
  display:flex;align-items:center;justify-content:center;transition:all var(--t);flex-shrink:0;
}
.send-btn:hover:not(:disabled){box-shadow:0 4px 18px rgba(139,92,246,.55);transform:scale(1.06);}
.send-btn:disabled{opacity:.45;}
.send-btn.stop{background:var(--grad-danger);}
.input-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--tx-3);}
.char-ct{font-family:'JetBrains Mono',monospace;}
.char-ct.warn{color:var(--tx-wrn);}

/* ── Right panel ── */
.rp{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-base);}
.rp-tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;}
.rp-tab{flex:1;padding:12px 8px;border:none;background:none;font-size:11px;font-weight:500;color:var(--tx-3);border-bottom:2px solid transparent;transition:all var(--t);}
.rp-tab.on{color:var(--pu-400);border-bottom-color:var(--pu-500);}
.rp.content{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* ── Insight cards ── */
.ins-card{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  padding:13px 14px;transition:border-color var(--t),box-shadow var(--t);position:relative;overflow:hidden;
}
.ins-card:hover{border-color:var(--bd-gl);box-shadow:var(--sh-card);}
.ins-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity var(--t);}
.ins-card:hover::before{opacity:1;}
.ins-bull::before{background:var(--grad-success);}
.ins-bear::before{background:var(--grad-danger);}
.ins-pu::before{background:var(--grad-accent);}
.ins-bl::before{background:linear-gradient(90deg,var(--bl-500),#06b6d4);}
.ins-or::before{background:var(--grad-warning);}
.ins-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ins-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-3);}
.ins-ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.ins-val{font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-bottom:3px;}
.ins-sub{font-size:10px;color:var(--tx-3);line-height:1.4;}
.conf-ring-w{display:flex;align-items:center;gap:10px;margin-top:4px;}
.conf-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.conf-ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bd);stroke-width:4;}
.ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.vol-wrap{margin-top:6px;}
.vol-track{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;}
.vol-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--bl-500),#06b6d4);transition:width .8s ease;}
.vol-lbls{display:flex;justify-content:space-between;font-size:9px;color:var(--tx-3);font-family:'JetBrains Mono',monospace;margin-top:3px;}
.risk-meter{display:flex;gap:3px;margin-top:6px;}
.risk-seg{flex:1;height:6px;border-radius:2px;background:var(--bd);transition:background .5s ease;}
.strat-chip{display:flex;align-items:center;gap:8px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);border-radius:8px;padding:8px 10px;margin-top:6px;}
.strat-chip-ico{width:28px;height:28px;border-radius:7px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.strat-chip-nm{font-size:12px;font-weight:700;color:var(--tx-1);}
.strat-chip-sub{font-size:10px;color:var(--tx-3);margin-top:1px;}

/* ── History ── */
.hist-new{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;
  border:1px dashed var(--bd-act);background:rgba(139,92,246,.05);
  color:var(--pu-400);font-size:12px;font-weight:600;width:100%;text-align:left;
  transition:all var(--t);margin-bottom:6px;
}
.hist-new:hover{background:rgba(139,92,246,.1);}
.hist-item{
  display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--bd);width:100%;text-align:left;font-family:inherit;
  background:none;transition:all var(--t);margin-bottom:4px;
}
.hist-item:hover{background:var(--bg-card-hov);border-color:var(--bd-gl);}
.hist-item.on{background:rgba(139,92,246,.08);border-color:var(--bd-act);}
.hist-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.hist-nm{font-size:12px;font-weight:500;color:var(--tx-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px;}
.hist-mt{font-size:10px;color:var(--tx-3);}


.ins-card { animation: fadeUp .3s ease both; }
.ins-card:nth-child(1){ animation-delay:.05s }
.ins-card:nth-child(2){ animation-delay:.1s }
.ins-card:nth-child(3){ animation-delay:.15s }
.ins-card:nth-child(4){ animation-delay:.2s }
.ins-card:nth-child(5){ animation-delay:.25s }

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--bg-card);border:1px solid var(--bd-gl);border-radius:10px;
  padding:10px 16px;font-size:12px;font-weight:500;color:var(--tx-1);
  box-shadow:var(--sh-elev);backdrop-filter:blur(16px);
  display:flex;align-items:center;gap:8px;z-index:999;
  animation:fadeUp .25s ease both;
}

/* ════ LOGIN ════ */
.login-page{
  min-height:100vh;background:var(--bg-base);
  display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;
}
.login-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.login-card{
  width:100%;max-width:400px;background:var(--bg-card);border:1px solid var(--bd);
  border-radius:18px;padding:34px;backdrop-filter:blur(20px);
  position:relative;z-index:1;box-shadow:var(--sh-elev);
}
.login-logo-ico{
  width:52px;height:52px;background:var(--grad-brand);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#fff;
  margin:0 auto 14px;box-shadow:0 8px 24px rgba(139,92,246,.38);
}
.login-title{font-size:21px;font-weight:800;color:var(--tx-1);}
.login-sub{font-size:12px;color:var(--tx-2);margin-top:4px;}
.login-tabs{display:flex;background:var(--bg-base);border-radius:8px;padding:3px;gap:3px;margin-bottom:20px;}
.login-tab{flex:1;padding:7px;border-radius:6px;border:none;background:none;font-size:13px;font-weight:500;color:var(--tx-3);transition:all var(--t);}
.login-tab.on{background:var(--bg-card);color:var(--tx-1);box-shadow:0 1px 6px rgba(0,0,0,.2);}
.login-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--re-400);margin-bottom:14px;}
.login-inp{
  background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:7px;
  padding:9px 12px;color:var(--tx-1);font-size:13px;width:100%;outline:none;
  transition:border-color var(--t);
}
.login-inp:focus{border-color:rgba(139,92,246,.5);}
.login-demo{margin-top:18px;padding:10px 14px;background:rgba(139,92,246,.06);border:1px solid var(--bd-pu);border-radius:8px;font-size:11px;color:var(--tx-3);text-align:center;line-height:1.5;}
.login-feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);}
.login-feat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-3);}

/* ════ PLACEHOLDER ════ */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;padding:40px;text-align:center;}
.ph-icon{font-size:52px;}
.ph-title{font-size:20px;font-weight:700;color:var(--tx-1);}
.ph-sub{font-size:13px;color:var(--tx-2);max-width:360px;line-height:1.6;}
.ph-badge{background:var(--grad-accent);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-top:4px;}

/* ════ MOBILE NAV ════ */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-glass);backdrop-filter:blur(20px);border-top:1px solid var(--bd);padding:8px 0 12px;z-index:200;}
.mob-nav-items{display:flex;justify-content:space-around;align-items:center;}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--tx-3);border:none;background:none;padding:4px 12px;border-radius:8px;transition:color var(--t);}
.mob-btn.on{color:var(--pu-400);}
.mob-ico{font-size:20px;}

/* ════ RESPONSIVE ════ */
@media(max-width:1280px){
  .stats-row{grid-template-columns:repeat(3,1fr);}
  .charts-grid{grid-template-columns:1fr 260px;}
  .mid-grid{grid-template-columns:340px 1fr;}
}
@media(max-width:1060px){
  .charts-grid{grid-template-columns:1fr 240px;}
  .bot-grid{grid-template-columns:1fr 1fr;}
  .ai-page{grid-template-columns:1fr;}
  .rp{display:none;}
}
@media(max-width:900px){
  .mid-grid{grid-template-columns:1fr;}
  .port-grid{grid-template-columns:1fr;}
}
@media(max-width:768px){
  :root{--sb-w:0px;}
  .shell{grid-template-columns:1fr;}
  .sb{display:none;}
  .mob-nav{display:block;}
  .page{padding:14px 12px 80px;}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .charts-grid{grid-template-columns:1fr;}
  .bot-grid{grid-template-columns:1fr;}
  .hd-search{display:none;}
  .pg-hd{flex-direction:column;}
  .port-top{flex-direction:column;}
  .ksc{display:none;}
  .chat-input-area{padding:10px 14px 70px;}
  .chat-msgs{padding:14px;}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr;}
  .opt-grid{grid-template-columns:1fr;}
}

/* ════════════════════════════════════════════════════════
   STRATEGIES PAGE
════════════════════════════════════════════════════════ */
.strat-page-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
.strat-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filter-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--bg-card);color:var(--tx-2);font-size:11px;font-weight:500;transition:all var(--t);cursor:pointer;}
.filter-chip:hover,.filter-chip.on{border-color:var(--bd-act);background:rgba(139,92,246,.1);color:var(--pu-400);}
.strat-cards{display:flex;flex-direction:column;gap:10px;}
.scard{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;cursor:pointer;transition:all var(--t-md);position:relative;overflow:hidden;}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-accent);opacity:0;transition:opacity var(--t);}
.scard:hover{border-color:var(--bd-act);box-shadow:var(--sh-glow);transform:translateX(2px);}
.scard:hover::before{opacity:1;}
.scard.active-card{border-color:var(--bd-act);background:rgba(139,92,246,.05);}
.scard.active-card::before{opacity:1;}
.scard-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.scard-name{font-size:14px;font-weight:700;color:var(--tx-1);}
.scard-type{font-size:10px;color:var(--tx-3);margin-top:2px;}
.scard-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-active{background:rgba(16,185,129,.12);color:var(--gr-400);}
.badge-paused{background:rgba(245,158,11,.12);color:var(--ye-400);}
.badge-testing{background:rgba(139,92,246,.12);color:var(--pu-400);}
.scard-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:10px;}
.scard-m-lbl{font-size:9px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.scard-m-val{font-size:13px;font-weight:700;}
.scard-footer{display:flex;align-items:center;justify-content:space-between;}
.scard-tags{display:flex;gap:5px;}
.stag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--bg-base);border:1px solid var(--bd);color:var(--tx-3);}
.detail-panel{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;position:sticky;top:0;}
.detail-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.detail-stat{background:var(--bg-base);border-radius:8px;padding:10px;}
.detail-stat-lbl{font-size:9px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.detail-stat-val{font-size:16px;font-weight:800;}

/* ════ BACKTEST PAGE ════ */
.bt-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}
.bt-form{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;}
.bt-form-title{font-size:14px;font-weight:700;color:var(--tx-1);margin-bottom:4px;}
.bt-results{display:flex;flex-direction:column;gap:14px;}
.bt-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.bt-kpi{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:center;}
.bt-kpi-lbl{font-size:10px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.bt-kpi-val{font-size:20px;font-weight:800;}
.trade-dir{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;}
.dir-long{background:rgba(16,185,129,.12);color:var(--gr-400);}
.dir-short{background:rgba(239,68,68,.12);color:var(--re-400);}
.dd-chart-wrap{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;}

/* ════ OPTIMIZE PAGE ════ */
.opt-page-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.opt-panel{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;position:sticky;top:0;}
.opt-results-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.heatmap-cell{border-radius:3px;transition:all var(--t);cursor:pointer;}
.heatmap-cell:hover{transform:scale(1.08);z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.param-result-row{display:grid;grid-template-columns:auto repeat(5,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px;}
.param-result-row:last-child{border-bottom:none;}
.rank-badge{width:22px;height:22px;border-radius:50%;background:var(--grad-accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ════ PORTFOLIO PAGE ════ */
.port-page-grid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start;}
.equity-hero{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;}
.equity-hero-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;}
.equity-big{font-size:36px;font-weight:900;letter-spacing:-1px;color:var(--tx-1);}
.equity-chg{font-size:13px;margin-top:4px;}
.port-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--bd);}
.port-stat-box{text-align:center;}
.trades-full{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;}
.tbl-filters{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.tbl-search{flex:1;max-width:220px;display:flex;align-items:center;gap:6px;background:var(--bg-base);border:1px solid var(--bd);border-radius:6px;padding:0 10px;height:32px;}
.tbl-search input{flex:1;background:none;border:none;outline:none;color:var(--tx-1);font-size:12px;}
.port-side{display:flex;flex-direction:column;gap:14px;}
.risk-gauge-wrap{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;}
.gauge-arc{transition:stroke-dashoffset 1s ease;}

/* ════ REPORTS PAGE ════ */
.reports-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.report-card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;cursor:pointer;transition:all var(--t-md);}
.report-card:hover{border-color:var(--bd-act);box-shadow:var(--sh-glow);transform:translateY(-2px);}
.report-icon-wrap{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;}
.report-name{font-size:13px;font-weight:700;color:var(--tx-1);margin-bottom:4px;}
.report-desc{font-size:11px;color:var(--tx-2);line-height:1.5;margin-bottom:12px;}
.report-meta{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--bd);font-size:10px;color:var(--tx-3);}
.report-table-wrap{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;}

/* ════ MARKET REGIME PAGE ════ */
.regime-page-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.regime-hero{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;grid-column:1/-1;}
.regime-hist-bar{display:flex;height:40px;border-radius:8px;overflow:hidden;gap:2px;margin:16px 0;}
.rh-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transition:flex var(--t-md);cursor:pointer;border-radius:4px;}
.regime-timeline{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;grid-column:1/-1;}
.regime-entry{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd);}
.regime-entry:last-child{border-bottom:none;}
.regime-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.regime-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.regime-stat-card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;}

/* ════ SETTINGS PAGE ════ */
.settings-layout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;}
.settings-nav{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:8px;position:sticky;top:0;}
.settings-nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:500;color:var(--tx-2);border:none;background:none;width:100%;text-align:left;transition:all var(--t);}
.settings-nav-item:hover{background:var(--bg-card-hov);color:var(--tx-1);}
.settings-nav-item.on{background:rgba(139,92,246,.12);color:var(--pu-400);}
.settings-body{display:flex;flex-direction:column;gap:16px;}
.settings-section{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;}
.settings-section-title{font-size:14px;font-weight:700;color:var(--tx-1);margin-bottom:4px;}
.settings-section-sub{font-size:12px;color:var(--tx-3);margin-bottom:18px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd);}
.settings-row:last-child{border-bottom:none;}
.settings-row-lbl{font-size:13px;font-weight:500;color:var(--tx-1);}
.settings-row-sub{font-size:11px;color:var(--tx-3);margin-top:2px;}
.toggle{width:40px;height:22px;border-radius:11px;border:none;padding:2px;cursor:pointer;transition:background var(--t-md);flex-shrink:0;position:relative;}
.toggle.on{background:var(--pu-500);}
.toggle.off{background:var(--bd-gl);}
.toggle-thumb{width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--t-md);position:absolute;top:2px;left:2px;}
.toggle.on .toggle-thumb{transform:translateX(18px);}
.settings-input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.avatar-upload{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--bd);}
.avatar-lg{width:56px;height:56px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;flex-shrink:0;}
.api-key-row{display:flex;align-items:center;gap:8px;}
.api-key-input{flex:1;background:var(--bg-base);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx-1);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;}
.color-swatch{width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all var(--t);}
.color-swatch.on{border-color:var(--tx-1);transform:scale(1.15);}
.notif-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--re-500);color:#fff;font-size:9px;font-weight:700;margin-left:auto;}

/* ════ RESPONSIVE — new pages ════ */
@media(max-width:1060px){
  .strat-page-grid{grid-template-columns:1fr;}
  .detail-panel{position:static;}
  .bt-layout{grid-template-columns:1fr;}
  .bt-form{position:static;}
  .opt-page-grid{grid-template-columns:1fr;}
  .opt-panel{position:static;}
  .port-page-grid{grid-template-columns:1fr;}
  .regime-page-grid{grid-template-columns:1fr;}
  .settings-layout{grid-template-columns:1fr;}
  .settings-nav{position:static;}
  .reports-grid{grid-template-columns:1fr 1fr;}
  .opt-results-grid{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .bt-kpi-row{grid-template-columns:1fr 1fr;}
  .detail-stat-grid{grid-template-columns:1fr 1fr;}
  .port-stats-row{grid-template-columns:1fr 1fr;}
  .reports-grid{grid-template-columns:1fr;}
  .regime-stats-grid{grid-template-columns:1fr;}
  .settings-input-row{grid-template-columns:1fr;}
  .equity-hero-top{flex-direction:column;align-items:flex-start;gap:8px;}
}


/* ── extensions.css ── */
/* ════════════════════════════════════════════════════
   QUANTORYX v6.0 — STYLE EXTENSIONS
   Additive only. Consumes v5 tokens (--bg-*, --tx-*, --pu-*,
   --bd-*, --sh-*, --r*, --t*). Never redefines a v5 token.
   Light mode inherits automatically via .lm token cascade.
════════════════════════════════════════════════════ */

/* ════ OVERLAY / SCRIM (shared by modal, palette, drawer) ════ */
.ov{
  position:fixed;inset:0;z-index:900;
  background:rgba(6,7,14,.62);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;
  animation:ovIn .18s ease both;
}
.lm .ov{background:rgba(15,16,34,.34);}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}

/* ════ MODAL ════ */
.mdl-w{
  position:relative;margin:auto;width:min(560px,calc(100vw - 32px));
  max-height:calc(100vh - 64px);display:flex;flex-direction:column;
  background:var(--bg-elevated);border:1px solid var(--bd-gl);
  border-radius:var(--r-lg);box-shadow:var(--sh-elev);
  animation:mdlIn .22s cubic-bezier(.16,1,.3,1) both;overflow:hidden;
}
.mdl-w.sm{width:min(420px,calc(100vw - 32px));}
.mdl-w.lg{width:min(820px,calc(100vw - 32px));}
@keyframes mdlIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:none;}}
.mdl-hd{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--bd);}
.mdl-hd-ico{
  width:32px;height:32px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:rgba(139,92,246,.13);color:var(--pu-400);
}
.mdl-ttl{font-size:14px;font-weight:700;color:var(--tx-1);line-height:1.3;}
.mdl-sub{font-size:11px;color:var(--tx-3);margin-top:3px;line-height:1.5;}
.mdl-x{
  margin-left:auto;flex-shrink:0;width:26px;height:26px;border-radius:6px;
  border:1px solid var(--bd);background:var(--bg-card);color:var(--tx-2);
  font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--t);
}
.mdl-x:hover{border-color:var(--bd-gl);color:var(--tx-1);}
.mdl-bd{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.mdl-ft{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd);background:var(--bg-card);}
.mdl-ft-l{margin-right:auto;font-size:11px;color:var(--tx-3);}

/* ════ COMMAND PALETTE (Ctrl+K) ════ */
.cp-w{
  position:relative;margin-top:12vh;width:min(620px,calc(100vw - 32px));
  background:var(--bg-elevated);border:1px solid var(--bd-gl);
  border-radius:var(--r-lg);box-shadow:var(--sh-elev);overflow:hidden;
  animation:mdlIn .2s cubic-bezier(.16,1,.3,1) both;
}
.cp-inp-w{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);}
.cp-inp-ico{font-size:14px;color:var(--tx-3);}
.cp-inp{flex:1;background:none;border:none;outline:none;color:var(--tx-1);font-size:14px;}
.cp-inp::placeholder{color:var(--tx-3);}
.cp-list{max-height:min(420px,52vh);overflow-y:auto;padding:6px;}
.cp-grp{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx-3);padding:8px 10px 5px;}
.cp-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--r-sm);border:1px solid transparent;background:none;
  color:var(--tx-2);font-size:12.5px;text-align:left;transition:all var(--t);
}
.cp-item:hover{background:var(--bg-card-hov);color:var(--tx-1);}
.cp-item.on{background:rgba(139,92,246,.12);border-color:var(--bd-pu);color:var(--tx-1);}
.cp-item-ico{
  width:26px;height:26px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  background:var(--bg-card);border:1px solid var(--bd);
}
.cp-item.on .cp-item-ico{background:rgba(139,92,246,.16);border-color:var(--bd-pu);}
.cp-item-nm{font-weight:600;color:var(--tx-1);line-height:1.3;}
.cp-item-sub{font-size:10.5px;color:var(--tx-3);margin-top:1px;}
.cp-item-kbd{margin-left:auto;flex-shrink:0;}
.cp-ft{display:flex;align-items:center;gap:14px;padding:9px 14px;border-top:1px solid var(--bd);background:var(--bg-card);font-size:10px;color:var(--tx-3);}
.cp-ft-k{display:inline-flex;align-items:center;gap:4px;}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:4px;
  background:var(--bg-base);border:1px solid var(--bd-gl);
  font-size:9.5px;font-weight:600;color:var(--tx-2);font-family:'JetBrains Mono',monospace;
}

/* ════ HEADER DROPDOWNS (notifications / profile) ════ */
.dd-anchor{position:relative;}
.dd-pop{
  position:absolute;top:calc(100% + 9px);right:0;z-index:820;
  background:var(--bg-elevated);border:1px solid var(--bd-gl);
  border-radius:var(--r);box-shadow:var(--sh-elev);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  animation:ddIn .16s ease both;overflow:hidden;
}
@keyframes ddIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
.dd-notif{width:min(348px,calc(100vw - 24px));}
.dd-prof{width:236px;}
.dd-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bd);}
.dd-hd-t{font-size:12.5px;font-weight:700;color:var(--tx-1);}
.dd-hd-a{font-size:10.5px;color:var(--pu-400);background:none;border:none;font-weight:600;transition:opacity var(--t);}
.dd-hd-a:hover{opacity:.7;}
.dd-scroll{max-height:min(330px,46vh);overflow-y:auto;}
.dd-row{
  display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);
  cursor:pointer;transition:background var(--t);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;
}
.dd-row:hover{background:var(--bg-card-hov);}
.dd-row:last-child{border-bottom:none;}
.dd-row.unread{background:rgba(139,92,246,.05);}
.dd-row-ico{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.dd-row-t{font-size:12px;font-weight:600;color:var(--tx-1);line-height:1.35;}
.dd-row-s{font-size:11px;color:var(--tx-2);margin-top:2px;line-height:1.5;}
.dd-row-tm{font-size:10px;color:var(--tx-3);margin-top:4px;}
.dd-unread-dot{width:7px;height:7px;border-radius:50%;background:var(--pu-500);flex-shrink:0;margin-top:5px;}
.dd-ft{padding:9px 14px;border-top:1px solid var(--bd);background:var(--bg-card);text-align:center;}
.dd-ft-btn{font-size:11px;font-weight:600;color:var(--pu-400);background:none;border:none;transition:opacity var(--t);}
.dd-ft-btn:hover{opacity:.72;}
.dd-prof-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--bd);}
.dd-prof-nm{font-size:12.5px;font-weight:700;color:var(--tx-1);}
.dd-prof-em{font-size:10.5px;color:var(--tx-3);margin-top:2px;}
.dd-prof-plan{
  display:inline-block;margin-top:5px;padding:1.5px 7px;border-radius:20px;
  font-size:9px;font-weight:700;background:rgba(139,92,246,.14);color:var(--pu-400);
}
.dd-items{padding:5px;}
.dd-item{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;
  border-radius:var(--r-sm);border:none;background:none;color:var(--tx-2);
  font-size:12px;text-align:left;transition:all var(--t);
}
.dd-item:hover{background:var(--bg-card-hov);color:var(--tx-1);}
.dd-item.danger{color:var(--tx-err);}
.dd-item.danger:hover{background:rgba(239,68,68,.1);}
.dd-item-kbd{margin-left:auto;}
.dd-sep{height:1px;background:var(--bd);margin:5px 0;}

/* ════ TOAST STACK (upgrades the single v5 .toast) ════ */
.toast-stack{
  position:fixed;bottom:24px;right:24px;z-index:960;
  display:flex;flex-direction:column-reverse;gap:9px;pointer-events:none;
}
.toast-i{
  pointer-events:auto;display:flex;align-items:flex-start;gap:9px;
  min-width:256px;max-width:min(380px,calc(100vw - 40px));
  background:var(--bg-elevated);border:1px solid var(--bd-gl);border-left-width:3px;
  border-radius:10px;padding:11px 13px;box-shadow:var(--sh-elev);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:fadeUp .24s ease both;
}
.toast-i.out{animation:toastOut .2s ease both;}
@keyframes toastOut{to{opacity:0;transform:translateX(14px);}}
.toast-i.ok{border-left-color:var(--gr-500);}
.toast-i.err{border-left-color:var(--re-500);}
.toast-i.warn{border-left-color:var(--ye-400);}
.toast-i.info{border-left-color:var(--pu-500);}
.toast-ico{font-size:14px;line-height:1.3;flex-shrink:0;}
.toast-t{font-size:12px;font-weight:600;color:var(--tx-1);line-height:1.35;}
.toast-m{font-size:11px;color:var(--tx-2);margin-top:2px;line-height:1.5;}
.toast-x{
  margin-left:auto;flex-shrink:0;background:none;border:none;
  color:var(--tx-3);font-size:12px;padding:0 2px;transition:color var(--t);
}
.toast-x:hover{color:var(--tx-1);}
@media(max-width:768px){.toast-stack{bottom:78px;right:12px;left:12px;}}

/* ════ CONFIRM DIALOG ════ */
.cf-ico{
  width:40px;height:40px;border-radius:50%;margin:0 auto 4px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.cf-ico.danger{background:rgba(239,68,68,.13);color:var(--re-400);}
.cf-ico.warn{background:rgba(245,158,11,.13);color:var(--ye-400);}
.cf-ico.info{background:rgba(139,92,246,.13);color:var(--pu-400);}
.btn-d{background:var(--grad-danger);color:#fff;box-shadow:0 2px 14px rgba(239,68,68,.3);}
.btn-d:hover{box-shadow:0 4px 20px rgba(239,68,68,.44);transform:translateY(-1px);}

/* ════ DRAWER (mobile "More" sheet) ════ */
.drw{
  position:fixed;left:0;right:0;bottom:0;z-index:940;
  background:var(--bg-elevated);border-top:1px solid var(--bd-gl);
  border-radius:18px 18px 0 0;box-shadow:var(--sh-elev);
  padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px));
  animation:drwIn .26s cubic-bezier(.16,1,.3,1) both;max-height:76vh;overflow-y:auto;
}
@keyframes drwIn{from{transform:translateY(100%);}to{transform:none;}}
.drw-grab{width:36px;height:4px;border-radius:2px;background:var(--bd-gl);margin:6px auto 12px;}
.drw-ttl{font-size:13px;font-weight:700;color:var(--tx-1);margin-bottom:10px;padding:0 2px;}
.drw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.drw-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;
  border-radius:var(--r);border:1px solid var(--bd);background:var(--bg-card);
  color:var(--tx-2);font-size:10px;font-weight:500;transition:all var(--t);
}
.drw-btn:hover,.drw-btn.on{border-color:var(--bd-act);background:rgba(139,92,246,.09);color:var(--pu-400);}
.drw-btn-ico{font-size:19px;}

/* ════ GLOBAL SEARCH RESULT HIGHLIGHT ════ */
.hl{background:rgba(139,92,246,.26);color:var(--tx-1);border-radius:2px;padding:0 1px;}

/* ════ ALERTS PAGE ════ */
.alerts-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
.alert-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  transition:all var(--t);margin-bottom:9px;
}
.alert-row:hover{border-color:var(--bd-gl);box-shadow:var(--sh-card);}
.alert-row.off{opacity:.55;}
.alert-ico{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.alert-nm{font-size:12.5px;font-weight:600;color:var(--tx-1);line-height:1.35;}
.alert-cond{font-size:11px;color:var(--tx-2);margin-top:3px;font-family:'JetBrains Mono',monospace;}
.alert-meta{display:flex;gap:10px;margin-top:5px;font-size:10px;color:var(--tx-3);}
.alert-acts{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.alert-ib{
  width:27px;height:27px;border-radius:6px;border:1px solid var(--bd);
  background:var(--bg-card);color:var(--tx-3);font-size:11px;
  display:flex;align-items:center;justify-content:center;transition:all var(--t);
}
.alert-ib:hover{border-color:var(--bd-gl);color:var(--tx-1);}
.alert-ib.danger:hover{border-color:rgba(239,68,68,.4);color:var(--re-400);}

/* ════ TRADE JOURNAL ════ */
.jr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.jr-entry{
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;transition:all var(--t);cursor:pointer;
}
.jr-entry:hover{border-color:var(--bd-act);box-shadow:var(--sh-glow);transform:translateY(-2px);}
.jr-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.jr-pair{font-size:13px;font-weight:700;color:var(--tx-1);}
.jr-pnl{margin-left:auto;font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.jr-note{
  font-size:11.5px;color:var(--tx-2);line-height:1.6;margin:9px 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.jr-tags{display:flex;gap:5px;flex-wrap:wrap;}
.jr-tag{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--bg-base);border:1px solid var(--bd);color:var(--tx-3);}
.jr-rating{display:flex;gap:2px;font-size:11px;}
.jr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--bd);}

/* ════ LIVE SIGNALS ════ */
.sig-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
.sig-card{
  background:var(--bg-card);border:1px solid var(--bd);border-left-width:3px;
  border-radius:var(--r);padding:13px 15px;margin-bottom:10px;transition:all var(--t);
  animation:fadeUp .3s ease both;
}
.sig-card:hover{border-color:var(--bd-gl);box-shadow:var(--sh-card);}
.sig-card.buy{border-left-color:var(--gr-500);}
.sig-card.sell{border-left-color:var(--re-500);}
.sig-hd{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.sig-pair{font-size:14px;font-weight:700;color:var(--tx-1);}
.sig-dir{font-size:10px;font-weight:700;padding:2.5px 9px;border-radius:5px;letter-spacing:.4px;}
.sig-dir.buy{background:rgba(16,185,129,.13);color:var(--gr-400);}
.sig-dir.sell{background:rgba(239,68,68,.13);color:var(--re-400);}
.sig-time{margin-left:auto;font-size:10px;color:var(--tx-3);font-family:'JetBrains Mono',monospace;}
.sig-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px;}
.sig-lv-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-3);}
.sig-lv-v{font-size:12px;font-weight:600;color:var(--tx-1);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.sig-bar{height:4px;border-radius:2px;background:var(--bg-base);overflow:hidden;margin-top:4px;}
.sig-bar-f{height:100%;border-radius:2px;background:var(--grad-accent);transition:width var(--t-lg);}
.sig-foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--bd);}
.sig-src{font-size:10.5px;color:var(--tx-3);}
.sig-live-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  color:var(--gr-400);background:rgba(16,185,129,.1);padding:3px 9px;border-radius:20px;
}
.sig-live-dot{width:6px;height:6px;border-radius:50%;background:var(--gr-500);animation:pulse 1.6s infinite;}
.sig-feed{max-height:520px;overflow-y:auto;padding-right:2px;}
.tick-row{
  display:flex;align-items:center;gap:9px;padding:8px 10px;
  border-bottom:1px solid var(--bd);font-size:11.5px;
}
.tick-row:last-child{border-bottom:none;}
.tick-pair{font-weight:600;color:var(--tx-1);min-width:66px;}
.tick-px{font-family:'JetBrains Mono',monospace;color:var(--tx-2);}
.tick-chg{margin-left:auto;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px;}
.tick-flash-up{animation:flashUp .6s ease;}
.tick-flash-dn{animation:flashDn .6s ease;}
@keyframes flashUp{0%{background:rgba(16,185,129,.16);}100%{background:transparent;}}
@keyframes flashDn{0%{background:rgba(239,68,68,.16);}100%{background:transparent;}}

/* ════ STRATEGY BUILDER ════ */
.sbd-grid{display:grid;grid-template-columns:220px 1fr 300px;gap:14px;align-items:start;}
.blk-lib{display:flex;flex-direction:column;gap:7px;}
.blk-cat{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-3);margin:8px 0 2px;}
.blk-chip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-sm);
  font-size:11.5px;color:var(--tx-2);cursor:grab;transition:all var(--t);text-align:left;width:100%;
}
.blk-chip:hover{border-color:var(--bd-act);color:var(--tx-1);transform:translateX(2px);}
.blk-chip:active{cursor:grabbing;}
.blk-chip-ico{font-size:13px;}
.canvas{
  min-height:400px;background:var(--bg-card);border:1px dashed var(--bd-gl);
  border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;
}
.canvas.drag{border-color:var(--pu-500);background:rgba(139,92,246,.05);}
.node{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  background:var(--bg-elevated);border:1px solid var(--bd);border-radius:var(--r-sm);
  transition:all var(--t);animation:fadeUp .2s ease both;
}
.node:hover{border-color:var(--bd-act);}
.node.on{border-color:var(--pu-500);box-shadow:var(--sh-glow);}
.node-ico{
  width:30px;height:30px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  background:rgba(139,92,246,.12);color:var(--pu-400);
}
.node-nm{font-size:12px;font-weight:600;color:var(--tx-1);}
.node-sub{font-size:10.5px;color:var(--tx-3);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.node-x{margin-left:auto;background:none;border:none;color:var(--tx-3);font-size:13px;transition:color var(--t);}
.node-x:hover{color:var(--re-400);}
.node-link{display:flex;align-items:center;gap:7px;padding-left:14px;font-size:10px;font-weight:700;color:var(--tx-3);letter-spacing:.5px;}
.node-link::before{content:'';width:1px;height:14px;background:var(--bd-gl);}
.code-prev{
  background:var(--bg-base);border:1px solid var(--bd);border-radius:var(--r-sm);
  padding:12px;font-family:'JetBrains Mono',monospace;font-size:11px;
  line-height:1.75;color:var(--tx-2);overflow-x:auto;white-space:pre;
}
.code-kw{color:var(--pu-400);}
.code-str{color:var(--gr-400);}
.code-num{color:var(--ye-400);}
.code-cm{color:var(--tx-3);font-style:italic;}

/* ════ BILLING ════ */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.plan{
  position:relative;background:var(--bg-card);border:1px solid var(--bd);
  border-radius:var(--r-lg);padding:20px 18px;transition:all var(--t-md);
  display:flex;flex-direction:column;gap:12px;
}
.plan:hover{border-color:var(--bd-gl);transform:translateY(-3px);box-shadow:var(--sh-card);}
.plan.on{border-color:var(--pu-500);box-shadow:var(--sh-glow);background:rgba(139,92,246,.045);}
.plan-tag{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  padding:3px 12px;border-radius:20px;font-size:9.5px;font-weight:700;
  letter-spacing:.5px;background:var(--grad-brand);color:#fff;white-space:nowrap;
}
.plan-nm{font-size:13px;font-weight:700;color:var(--tx-1);}
.plan-desc{font-size:11px;color:var(--tx-3);line-height:1.55;}
.plan-price{display:flex;align-items:baseline;gap:4px;}
.plan-amt{font-size:30px;font-weight:800;color:var(--tx-1);letter-spacing:-1px;}
.plan-per{font-size:11.5px;color:var(--tx-3);}
.plan-feats{display:flex;flex-direction:column;gap:8px;flex:1;}
.plan-feat{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--tx-2);line-height:1.5;}
.plan-feat-ck{color:var(--gr-400);flex-shrink:0;font-size:11px;margin-top:1px;}
.plan-feat.off{opacity:.4;}
.plan-feat.off .plan-feat-ck{color:var(--tx-3);}
.bill-toggle{display:inline-flex;gap:2px;background:var(--bg-base);border-radius:20px;padding:3px;border:1px solid var(--bd);}
.bill-tg{padding:5px 15px;border-radius:20px;border:none;background:none;color:var(--tx-3);font-size:11.5px;font-weight:600;transition:all var(--t);}
.bill-tg.on{background:var(--bg-card);color:var(--tx-1);box-shadow:0 1px 5px rgba(0,0,0,.2);}

/* ╔══════════════════════════════════════════════════════════╗
   ║  v6 MODULE · src/lib/logger.js                         ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ══════════════════════════════════════════════
   QUANTORYX v6 — LOGGING & ERROR REPORTING

   One channel for all diagnostics. In production only warn/error
   are emitted; debug/info are suppressed. Every error is also
   pushed to a bounded in-memory ring buffer so the UI can show
   recent failures, and forwarded to `onReport` for a real sink
   (Sentry, Datadog, a backend /logs route…).
══════════════════════════════════════════════ */

const LOG_LEVELS={debug:10,info:20,warn:30,error:40,silent:99};
const IS_PROD=(window.QX_ENV||'development')==='production';
const MIN_LEVEL=LOG_LEVELS[window.QX_LOG_LEVEL||(IS_PROD?'warn':'debug')]??LOG_LEVELS.debug;

const log=(()=>{
  const buffer=[];              // bounded ring of recent events
  const MAX=50;
  let reporter=null;            // external sink

  const emit=(level,scope,msg,extra)=>{
    if(LOG_LEVELS[level]<MIN_LEVEL) return;
    const entry={level,scope,msg:String(msg),extra,t:Date.now()};
    if(level==='warn'||level==='error'){
      buffer.push(entry);
      if(buffer.length>MAX) buffer.shift();
      try{ reporter?.(entry); }catch{}
    }
    const tag=`%c[qx:${scope}]`;
    const style=level==='error'?'color:#f87171;font-weight:600'
              :level==='warn' ?'color:#fbbf24;font-weight:600'
              :'color:#a78bfa';
    const fn=console[level]||console.log;
    extra!==undefined?fn(tag,style,msg,extra):fn(tag,style,msg);
  };

  return{
    debug:(s,m,e)=>emit('debug',s,m,e),
    info: (s,m,e)=>emit('info', s,m,e),
    warn: (s,m,e)=>emit('warn', s,m,e),
    error:(s,m,e)=>emit('error',s,m,e),
    /* Attach a real sink: log.setReporter(e=>fetch('/api/logs',…)) */
    setReporter(fn){ reporter=fn; },
    recent(){ return [...buffer]; },
    clear(){ buffer.length=0; },
  };
})();

/* Catch anything that escapes React's tree (async callbacks, WS handlers). */
window.addEventListener('error',e=>{
  log.error('window',e.message,{src:e.filename,line:e.lineno});
});
window.addEventListener('unhandledrejection',e=>{
  const r=e.reason;
  log.error('promise',r?.message||String(r),{status:r?.status});
});

/* ── Formatters ── */
const fmtMoney=(n,dp=2)=>{
  const s=n<0?'−':'';
  return `${s}$${Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})}`;
};
const fmtPct=(n,dp=2)=>`${n>=0?'+':'−'}${Math.abs(n).toFixed(dp)}%`;
const fmtNum=(n,dp=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const fmtTime=d=>new Date(d).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const relTime=d=>{
  const s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return `${Math.floor(s/60)}m ago`;
  if(s<86400) return `${Math.floor(s/3600)}h ago`;
  if(s<604800) return `${Math.floor(s/86400)}d ago`;
  return fmtDate(d);
};

/* ── Class name join (matches v5 template-literal style) ── */
const cx=(...a)=>a.filter(Boolean).join(' ');

/* ── Colour helper mirroring v5 .up/.down/.neu ── */
const dirClass=n=>n>0?'up':n<0?'down':'neu';

/* ── Fuzzy match for the command palette / global search ── */
const fuzzy=(needle,hay)=>{
  if(!needle) return true;
  const n=needle.toLowerCase(),h=String(hay).toLowerCase();
  if(h.includes(n)) return true;
  let i=0;
  for(const ch of h){ if(ch===n[i]) i++; if(i===n.length) return true; }
  return false;
};

/* ── Highlight matched substring → array of React-safe parts ── */
const splitMatch=(text,q)=>{
  if(!q) return [{t:text,m:false}];
  const i=String(text).toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return [{t:text,m:false}];
  return [
    {t:text.slice(0,i),m:false},
    {t:text.slice(i,i+q.length),m:true},
    {t:text.slice(i+q.length),m:false},
  ].filter(p=>p.t);
};

  if(/\d/.test(p)) s++;
  if(/[^A-Za-z0-9]/.test(p)) s++;
  return clamp(s,0,4);
};
